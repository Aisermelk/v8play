<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V8 Play+</title>
    <!-- Tailwind CSS para estilização moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0f1016] text-white min-h-screen font-sans">

    <!-- Header / Barra Superior -->
    <header class="flex items-center justify-between px-6 py-4 bg-[#14151f] border-b border-gray-800 sticky top-0 z-50 shadow-md">
        <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-2">
                <span class="bg-gradient-to-r from-red-600 to-orange-500 text-white font-extrabold px-3 py-1 rounded-lg text-lg tracking-wider shadow-lg">V8+</span>
                <span class="text-xl font-bold tracking-wide">V8 Play+</span>
            </div>
        </div>
        
        <div class="flex-1 max-w-xl mx-8 hidden md:block">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="searchInput" placeholder="Buscar filmes, séries e doramas..." class="w-full bg-[#1e2029] text-sm text-white pl-10 pr-4 py-2.5 rounded-full focus:outline-none focus:ring-2 focus:ring-red-600 border border-transparent">
            </div>
        </div>

        <div>
            <button onclick="logout()" class="bg-cyan-500 hover:bg-cyan-600 text-black font-bold px-5 py-2 rounded-full text-sm transition-all shadow-md">
                Sair
            </button>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-6 py-8">
        
        <!-- Seção de Destaque / Hero -->
        <section class="mb-10">
            <h2 class="text-xl font-bold mb-4 text-gray-200">Em Alta</h2>
            <div id="heroContainer">
                <!-- Card com link direto para o player -->
                <a href="player.html?v=P8Gb3PlIes" class="group block relative rounded-xl overflow-hidden shadow-xl transition-transform duration-300 hover:scale-[1.01] max-w-xs">
                    <div class="relative aspect-[2/3] rounded-xl overflow-hidden bg-gray-800 border border-gray-800">
                        <img src="https://istoe.com.br/wp-content/uploads/2025/11/Michael.jpg" alt="Michael" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <span class="absolute top-3 right-3 bg-cyan-500 text-black font-bold text-xs px-2.5 py-1 rounded-md shadow-md uppercase">Grátis</span>
                    </div>
                </a>
            </div>
        </section>

        <!-- Seção de Filmes -->
        <section>
            <h2 class="text-xl font-bold mb-4 text-gray-200 flex items-center gap-2">
                <i class="fa-solid fa-film text-red-500"></i> Filmes
            </h2>
            
            <!-- Grid de Filmes -->
            <div id="moviesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                <!-- Card de Filme -->
                <a href="player.html?v=P8Gb3PlIes" class="group block relative rounded-xl overflow-hidden shadow-lg transition-transform duration-300 hover:scale-105">
                    <div class="relative aspect-[2/3] rounded-xl overflow-hidden bg-gray-800 border border-gray-800">
                        <img src="https://istoe.com.br/wp-content/uploads/2025/11/Michael.jpg" alt="Michael" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <span class="absolute top-3 right-3 bg-cyan-500 text-black font-bold text-xs px-2.5 py-1 rounded-md shadow-md uppercase">Grátis</span>
                    </div>
                </a>
            </div>
        </section>

    </main>

    <!-- Firebase SDK e Inicialização -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            // Configurações do seu projeto Firebase
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            console.log("🔥 Firebase conectado ao V8 Play+");
        } catch (error) {
            console.error("Erro ao conectar ao Firebase:", error);
        }

        window.logout = function() {
            localStorage.clear();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
