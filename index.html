<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>V8 Play+ | Player</title>

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


    <style>

        :root {
            --primary: #00d4ff;
            --primary-hover: #00a2c7;

            --bg: #050507;
            --surface: #101014;
            --surface2: #18181d;

            --text: #ffffff;
            --text2: #aaaaaa;

            --danger: #ff4d4d;
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: "Poppins", sans-serif;
        }


        body {
            overflow-x: hidden;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .player-header {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            height: 70px;

            display: flex;

            align-items: center;

            gap: 15px;

            padding: 0 30px;

            z-index: 1000;

            background:
                linear-gradient(
                    to bottom,
                    rgba(5,5,7,.98),
                    rgba(5,5,7,.75),
                    transparent
                );

            backdrop-filter: blur(8px);

        }


        .btn-voltar {

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: 1px solid rgba(255,255,255,.12);

            background:
                rgba(255,255,255,.08);

            color: white;

            border-radius: 50%;

            cursor: pointer;

            transition: .2s;

            font-size: 16px;

        }


        .btn-voltar:hover {

            background: var(--primary);

            color: #000;

            transform: scale(1.05);

        }


        .player-brand {

            font-size: 1.25rem;

            font-weight: 800;

            white-space: nowrap;

        }


        .player-brand span {

            color: var(--primary);

        }


        /* =====================================================
           PLAYER
        ===================================================== */

        .player-page {

            min-height: 100vh;

            padding-top: 70px;

            display: flex;

            flex-direction: column;

        }


        .player-container {

            width: 100%;

            max-width: 1400px;

            margin: 0 auto;

            padding: 20px;

        }


        .video-wrapper {

            width: 100%;

            position: relative;

            background: #000;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 20px 60px rgba(0,0,0,.55);

            aspect-ratio: 16 / 9;

        }


        /* =====================================================
           VIDEO
        ===================================================== */

        #videoPlayer {

            width: 100%;

            height: 100%;

            display: block;

            background: #000;

            object-fit: contain;

        }


        /* =====================================================
           IFRAME
        ===================================================== */

        #iframePlayer {

            width: 100%;

            height: 100%;

            border: none;

            display: none;

            background: #000;

        }


        /* =====================================================
           LOADING
        ===================================================== */

        #loading {

            position: absolute;

            inset: 0;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            gap: 15px;

            background: #000;

            z-index: 10;

        }


        .spinner {

            width: 48px;

            height: 48px;

            border-radius: 50%;

            border:

                4px solid
                rgba(255,255,255,.15);

            border-top-color:
                var(--primary);

            animation:
                girar .8s linear infinite;

        }


        @keyframes girar {

            to {
                transform: rotate(360deg);
            }

        }


        #loadingText {

            color: #aaa;

            font-size: .9rem;

        }


        /* =====================================================
           ERRO
        ===================================================== */

        #errorBox {

            position: absolute;

            inset: 0;

            z-index: 20;

            display: none;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 30px;

            background:
                radial-gradient(
                    circle at center,
                    #18181d,
                    #050507
                );

        }


        #errorBox i {

            font-size: 48px;

            color: var(--danger);

            margin-bottom: 15px;

        }


        #errorBox h2 {

            font-size: 1.3rem;

            margin-bottom: 8px;

        }


        #errorBox p {

            color: #aaa;

            max-width: 500px;

            font-size: .9rem;

            line-height: 1.5;

        }


        .btn-tentar {

            margin-top: 20px;

            border: none;

            background: var(--primary);

            color: #000;

            font-weight: 700;

            padding: 10px 20px;

            border-radius: 6px;

            cursor: pointer;

        }


        /* =====================================================
           INFORMAÇÕES
        ===================================================== */

        .player-info {

            padding:

                22px
                5px
                40px;

        }


        #playerTitle {

            font-size: 1.6rem;

            font-weight: 700;

            margin-bottom: 8px;

        }


        .player-meta {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            color: var(--text2);

            font-size: .85rem;

            margin-bottom: 15px;

        }


        .badge {

            padding: 4px 9px;

            border-radius: 5px;

            background:
                rgba(0,212,255,.12);

            color: var(--primary);

            border:
                1px solid
                rgba(0,212,255,.3);

        }


        #playerDescription {

            color: #aaa;

            max-width: 900px;

            line-height: 1.6;

            font-size: .9rem;

        }


        /* =====================================================
           BOTÕES
        ===================================================== */

        .player-actions {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            margin-top: 20px;

        }


        .action-btn {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 10px 18px;

            border-radius: 7px;

            border: 1px solid #333;

            background: #17171c;

            color: white;

            cursor: pointer;

            font-family: inherit;

            font-weight: 600;

            transition: .2s;

        }


        .action-btn:hover {

            border-color:
                var(--primary);

            background:
                rgba(0,212,255,.1);

        }


        /* =====================================================
           MENSAGEM TRAILER
        ===================================================== */

        .trailer-badge {

            display: inline-flex;

            align-items: center;

            gap: 6px;

            background:
                rgba(255,170,0,.12);

            border:
                1px solid
                rgba(255,170,0,.35);

            color: #ffaa00;

            padding: 5px 10px;

            border-radius: 5px;

            font-size: .75rem;

            font-weight: 700;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .player-header {

                height: 60px;

                padding:
                    0 15px;

            }


            .btn-voltar {

                width: 38px;
                height: 38px;

            }


            .player-brand {

                font-size: 1rem;

            }


            .player-page {

                padding-top: 60px;

            }


            .player-container {

                padding:
                    10px 0;

            }


            .video-wrapper {

                border-radius: 0;

            }


            .player-info {

                padding:
                    20px 15px 35px;

            }


            #playerTitle {

                font-size: 1.25rem;

            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="player-header">

    <button
        class="btn-voltar"
        id="btnVoltar"
        title="Voltar">

        <i class="fa-solid fa-arrow-left"></i>

    </button>


    <div class="player-brand">

        V8 <span>Play+</span>

    </div>

</header>



<!-- =========================================================
     PLAYER
========================================================= -->

<main class="player-page">


    <div class="player-container">


        <div class="video-wrapper">


            <!-- LOADING -->

            <div id="loading">

                <div class="spinner"></div>

                <div id="loadingText">
                    Carregando vídeo...
                </div>

            </div>


            <!-- VIDEO HTML5 -->

            <video
                id="videoPlayer"
                controls
                playsinline
                preload="metadata"
                controlsList="nodownload">

            </video>


            <!-- IFRAME -->

            <iframe
                id="iframePlayer"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen>
            </iframe>


            <!-- ERRO -->

            <div id="errorBox">

                <i class="fa-solid fa-circle-exclamation"></i>

                <h2>
                    Não foi possível reproduzir
                </h2>

                <p id="errorText">
                    O vídeo não pôde ser carregado.
                </p>

                <button
                    class="btn-tentar"
                    id="btnTentar">

                    <i class="fa-solid fa-rotate-right"></i>
                    Tentar novamente

                </button>

            </div>


        </div>


        <!-- =================================================
             INFORMAÇÕES
        ================================================= -->

        <section class="player-info">


            <h1 id="playerTitle">
                Carregando...
            </h1>


            <div class="player-meta">

                <span
                    class="badge"
                    id="badgeTipo">

                    V8 Play+

                </span>


                <span id="badgeAno"></span>


                <span
                    id="trailerBadge"
                    class="trailer-badge"
                    style="display:none;">

                    <i class="fa-solid fa-film"></i>

                    TRAILER

                </span>

            </div>


            <p id="playerDescription">
                Carregando informações...
            </p>


            <div class="player-actions">


                <button
                    class="action-btn"
                    id="btnVoltar2">

                    <i class="fa-solid fa-arrow-left"></i>

                    Voltar

                </button>


                <button
                    class="action-btn"
                    id="btnRecarregar">

                    <i class="fa-solid fa-rotate-right"></i>

                    Recarregar vídeo

                </button>


            </div>


        </section>


    </div>


</main>



<script type="module">


    // =========================================================
    // FIREBASE
    // =========================================================

    import {
        db
    } from "./js/firebase.js";


    import {
        doc,
        getDoc
    } from
        "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";



    // =========================================================
    // ELEMENTOS
    // =========================================================

    const videoPlayer =
        document.getElementById(
            "videoPlayer"
        );


    const iframePlayer =
        document.getElementById(
            "iframePlayer"
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const loadingText =
        document.getElementById(
            "loadingText"
        );


    const errorBox =
        document.getElementById(
            "errorBox"
        );


    const errorText =
        document.getElementById(
            "errorText"
        );


    const playerTitle =
        document.getElementById(
            "playerTitle"
        );


    const playerDescription =
        document.getElementById(
            "playerDescription"
        );


    const badgeTipo =
        document.getElementById(
            "badgeTipo"
        );


    const badgeAno =
        document.getElementById(
            "badgeAno"
        );


    const trailerBadge =
        document.getElementById(
            "trailerBadge"
        );



    // =========================================================
    // PARÂMETROS
    // =========================================================

    const params =
        new URLSearchParams(
            window.location.search
        );


    const itemId =
        params.get("id");


    const colecao =
        params.get("colecao");


    const videoParametro =
        params.get("video");


    const tituloParametro =
        params.get("title");


    const ehTrailer =
        params.get("trailer") === "true";



    console.log(
        "🎬 V8 Play+ Player iniciado"
    );


    console.log(
        "ID:",
        itemId
    );


    console.log(
        "Coleção:",
        colecao
    );


    console.log(
        "Vídeo recebido:",
        videoParametro
    );


    console.log(
        "Título:",
        tituloParametro
    );


    console.log(
        "Trailer:",
        ehTrailer
    );



    // =========================================================
    // VOLTAR
    // =========================================================

    function voltar() {

        if (
            window.history.length > 1
        ) {

            window.history.back();

        }

        else {

            window.location.href =
                "index.html";

        }

    }


    document
        .getElementById(
            "btnVoltar"
        )
        .onclick =
        voltar;


    document
        .getElementById(
            "btnVoltar2"
        )
        .onclick =
        voltar;



    // =========================================================
    // MOSTRAR ERRO
    // =========================================================

    function mostrarErro(
        mensagem
    ) {

        console.error(
            "❌ Player:",
            mensagem
        );


        loading.style.display =
            "none";


        videoPlayer.style.display =
            "none";


        iframePlayer.style.display =
            "none";


        errorText.innerText =
            mensagem;


        errorBox.style.display =
            "flex";

    }



    // =========================================================
    // ESCONDER ERRO
    // =========================================================

    function esconderErro() {

        errorBox.style.display =
            "none";

    }



    // =========================================================
    // LOADING
    // =========================================================

    function mostrarLoading(
        texto = "Carregando vídeo..."
    ) {

        loadingText.innerText =
            texto;

        loading.style.display =
            "flex";

    }



    function esconderLoading() {

        loading.style.display =
            "none";

    }



    // =========================================================
    // EXTRAIR YOUTUBE
    // =========================================================

    function extrairYoutubeID(
        url
    ) {

        if (!url)
            return null;


        url =
            String(url).trim();


        /*
         * youtube.com/watch?v=ID
         */

        let match =
            url.match(
                /youtube\.com\/watch\?v=([^&]+)/i
            );


        if (match)
            return match[1];


        /*
         * youtu.be/ID
         */

        match =
            url.match(
                /youtu\.be\/([^?&/]+)/i
            );


        if (match)
            return match[1];


        /*
         * youtube.com/embed/ID
         */

        match =
            url.match(
                /youtube\.com\/embed\/([^?&/]+)/i
            );


        if (match)
            return match[1];


        /*
         * youtube.com/shorts/ID
         */

        match =
            url.match(
                /youtube\.com\/shorts\/([^?&/]+)/i
            );


        if (match)
            return match[1];


        /*
         * youtube-nocookie
         */

        match =
            url.match(
                /youtube-nocookie\.com\/embed\/([^?&/]+)/i
            );


        if (match)
            return match[1];


        return null;

    }



    // =========================================================
    // VERIFICAR YOUTUBE
    // =========================================================

    function ehYoutube(
        url
    ) {

        if (!url)
            return false;


        return /youtube\.com|youtu\.be|youtube-nocookie\.com/i
            .test(url);

    }



    // =========================================================
    // VERIFICAR VÍDEO
    // =========================================================

    function ehVideoDireto(
        url
    ) {

        if (!url)
            return false;


        return /\.(mp4|webm|ogg|m3u8)(\?.*)?$/i
            .test(url);

    }



    // =========================================================
    // CONSTRUIR URL YOUTUBE
    // =========================================================

    function montarYoutubeURL(
        id
    ) {

        return (
            "https://www.youtube.com/embed/" +
            encodeURIComponent(id) +
            "?autoplay=1&rel=0&modestbranding=1"
        );

    }



    // =========================================================
    // CARREGAR YOUTUBE
    // =========================================================

    function carregarYoutube(
        url
    ) {

        const id =
            extrairYoutubeID(url);


        if (!id) {

            mostrarErro(
                "O link do YouTube é inválido."
            );

            return;

        }


        console.log(
            "▶️ YouTube ID:",
            id
        );


        videoPlayer.pause();


        videoPlayer.removeAttribute(
            "src"
        );


        videoPlayer.style.display =
            "none";


        iframePlayer.style.display =
            "block";


        iframePlayer.src =
            montarYoutubeURL(id);


        iframePlayer.onload =
            () => {

                esconderLoading();

            };


        /*
         * Caso o navegador não dispare
         * onload corretamente.
         */

        setTimeout(
            () => {

                esconderLoading();

            },
            3000
        );

    }



    // =========================================================
    // CARREGAR VÍDEO DIRETO
    // =========================================================

    function carregarVideoDireto(
        url
    ) {

        console.log(
            "🎥 Vídeo direto:",
            url
        );


        iframePlayer.src =
            "";


        iframePlayer.style.display =
            "none";


        videoPlayer.style.display =
            "block";


        videoPlayer.src =
            url;


        videoPlayer.load();


        videoPlayer.onloadedmetadata =
            () => {

                console.log(
                    "✅ Metadata carregada"
                );


                esconderLoading();

            };


        videoPlayer.oncanplay =
            () => {

                console.log(
                    "▶️ Vídeo pronto"
                );


                esconderLoading();

            };


        videoPlayer.onerror =
            () => {

                mostrarErro(
                    "O arquivo de vídeo não pôde ser carregado. Verifique se o link é válido e permite reprodução no navegador."
                );

            };


        /*
         * Tentativa automática.
         *
         * Alguns navegadores bloqueiam autoplay
         * com som, por isso o erro é ignorado.
         */

        const promessa =
            videoPlayer.play();


        if (
            promessa &&
            typeof promessa.catch === "function"
        ) {

            promessa.catch(
                () => {

                    console.log(
                        "Autoplay bloqueado pelo navegador."
                    );

                }
            );

        }

    }



    // =========================================================
    // CARREGAR IFRAME GENÉRICO
    // =========================================================

    function carregarIframe(
        url
    ) {

        console.log(
            "🌐 Embed:",
            url
        );


        videoPlayer.pause();


        videoPlayer.removeAttribute(
            "src"
        );


        videoPlayer.style.display =
            "none";


        iframePlayer.style.display =
            "block";


        iframePlayer.src =
            url;


        iframePlayer.onload =
            () => {

                esconderLoading();

            };


        setTimeout(
            () => {

                esconderLoading();

            },
            3000
        );

    }



    // =========================================================
    // CARREGAR PLAYER
    // =========================================================

    function carregarPlayer(
        url
    ) {

        esconderErro();

        mostrarLoading();


        if (!url) {

            mostrarErro(
                "Nenhum vídeo foi informado para este conteúdo."
            );

            return;

        }


        url =
            String(url).trim();


        /*
         * YouTube
         */

        if (
            ehYoutube(url)
        ) {

            carregarYoutube(url);

            return;

        }


        /*
         * Arquivo de vídeo
         */

        if (
            ehVideoDireto(url)
        ) {

            carregarVideoDireto(url);

            return;

        }


        /*
         * Se for uma URL HTTP/HTTPS,
         * tratamos como embed.
         */

        if (
            /^https?:\/\//i.test(url)
        ) {

            carregarIframe(url);

            return;

        }


        mostrarErro(
            "Formato de vídeo não reconhecido."
        );

    }



    // =========================================================
    // CARREGAR DADOS DO FIRESTORE
    // =========================================================

    async function carregarDadosFirestore() {

        /*
         * Se não temos ID ou coleção,
         * usamos os parâmetros enviados
         * pelo index.
         */

        if (
            !itemId ||
            !colecao
        ) {

            console.warn(
                "⚠️ ID ou coleção ausentes."
            );

            if (tituloParametro) {

                playerTitle.innerText =
                    tituloParametro;

            }

            carregarPlayer(
                videoParametro
            );

            return;

        }


        try {

            console.log(
                `🔥 Buscando ${colecao}/${itemId}`
            );


            const referencia =
                doc(
                    db,
                    colecao,
                    itemId
                );


            const snap =
                await getDoc(
                    referencia
                );


            if (!snap.exists()) {

                console.warn(
                    "Documento não encontrado. Usando parâmetros da URL."
                );


                playerTitle.innerText =
                    tituloParametro ||
                    "V8 Play+";


                carregarPlayer(
                    videoParametro
                );


                return;

            }


            const item =
                snap.data();


            console.log(
                "🎬 Conteúdo encontrado:",
                item
            );


            /*
             * Título
             */

            playerTitle.innerText =
                item.titulo ||
                tituloParametro ||
                "V8 Play+";


            /*
             * Descrição
             */

            playerDescription.innerText =
                item.descricao ||
                "Sem descrição disponível.";


            /*
             * Ano
             */

            if (item.ano) {

                badgeAno.innerText =
                    item.ano;

            }


            /*
             * Categoria
             */

            badgeTipo.innerText =
                item.categoria ||
                item.tipo ||
                "V8 Play+";


            /*
             * Trailer
             */

            if (
                ehTrailer
            ) {

                trailerBadge.style.display =
                    "inline-flex";

            }


            /*
             * Escolher vídeo.
             *
             * Ordem de prioridade:
             *
             * trailer
             * video
             * video1
             * video2
             * video3
             * embed
             * URL recebida
             */

            let url = "";


            if (
                ehTrailer
            ) {

                url =
                    item.trailer ||
                    item.videoTrailer ||
                    videoParametro ||
                    "";

            }

            else {

                url =
                    item.video ||
                    item.video1 ||
                    item.video2 ||
                    item.video3 ||
                    item.embed ||
                    videoParametro ||
                    "";

            }


            console.log(
                "🎞️ URL final:",
                url
            );


            carregarPlayer(
                url
            );

        }

        catch (erro) {

            console.error(
                "❌ Erro ao buscar conteúdo:",
                erro
            );


            /*
             * Mesmo se o Firestore falhar,
             * tentamos o vídeo enviado pelo index.
             */

            playerTitle.innerText =
                tituloParametro ||
                "V8 Play+";


            carregarPlayer(
                videoParametro
            );

        }

    }



    // =========================================================
    // RECARREGAR
    // =========================================================

    document
        .getElementById(
            "btnRecarregar"
        )
        .onclick =
        () => {

            if (videoParametro) {

                carregarPlayer(
                    videoParametro
                );

            }

            else {

                carregarDadosFirestore();

            }

        };


    document
        .getElementById(
            "btnTentar"
        )
        .onclick =
        () => {

            carregarDadosFirestore();

        };



    // =========================================================
    // TECLADO
    // =========================================================

    document.addEventListener(
        "keydown",
        event => {

            /*
             * ESC = voltar
             */

            if (
                event.key === "Escape"
            ) {

                voltar();

<script type="module">

import {
    db,
    auth
} from "./js/firebase.js";

import {
    collection,
    getDocs,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

import {
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    sendPasswordResetEmail,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const COLECOES = [
    "filmes",
    "series",
    "animes",
    "doramas"
];

let catalogo = [];
let filmeAtual = null;
let modoCadastro = false;
let acaoAnuncioPendente = null;
let adTimer = null;

let titulosComprados =
    new Set();

let valoresPlanosAdmin = {
    prime: 9.90,
    premium: 19.90
};


/* =========================================================
   ELEMENTOS
========================================================= */

const $ = id =>
    document.getElementById(id);


/* =========================================================
   PREÇO
========================================================= */

function formatarPreco(valor) {

    const numero =
        Number(valor) || 0;

    return `R$ ${numero
        .toFixed(2)
        .replace(".", ",")}`;
}


/* =========================================================
   CARREGAR PREÇOS
========================================================= */

async function carregarPrecosAdmin() {

    try {

        const ref =
            doc(
                db,
                "configuracoes",
                "planos"
            );

        const snap =
            await getDoc(ref);

        if (!snap.exists())
            return;

        const dados =
            snap.data();

        if (dados.prime !== undefined) {

            valoresPlanosAdmin.prime =
                Number(dados.prime);

        }

        if (dados.premium !== undefined) {

            valoresPlanosAdmin.premium =
                Number(dados.premium);

        }

    }

    catch (erro) {

        console.warn(
            "Não foi possível carregar os preços:",
            erro
        );

    }

}


/* =========================================================
   TAG DO CONTEÚDO
========================================================= */

function obterTagItem(item) {

    const tag =
        item.tag ||
        item.plano ||
        "gratis";

    return String(tag)
        .toLowerCase()
        .trim();

}


/* =========================================================
   BUSCAR COLEÇÃO
========================================================= */

async function buscarColecao(nome) {

    try {

        const snap =
            await getDocs(
                collection(db, nome)
            );

        const itens = [];

        snap.forEach(
            documento => {

                const dados =
                    documento.data();

                if (
                    dados.ativo === false
                )
                    return;

                itens.push({

                    id:
                        documento.id,

                    colecao:
                        nome,

                    ...dados

                });

            }
        );

        itens.sort(
            (a, b) => {

                const dataA =
                    a.data?.toDate
                        ? a.data.toDate()
                        : new Date(
                            a.data || 0
                        );

                const dataB =
                    b.data?.toDate
                        ? b.data.toDate()
                        : new Date(
                            b.data || 0
                        );

                return dataB - dataA;

            }
        );

        return itens;

    }

    catch (erro) {

        console.error(
            `Erro na coleção ${nome}:`,
            erro
        );

        return [];

    }

}


/* =========================================================
   CARREGAR CATÁLOGO
========================================================= */

async function carregarCatalogo() {

    console.log(
        "🎬 Carregando catálogo..."
    );

    await carregarPrecosAdmin();

    const ids = [
        "emAlta",
        "filmes",
        "series",
        "animes",
        "doramas",
        "recomendados"
    ];

    ids.forEach(
        id => {

            const elemento =
                $(id);

            if (elemento)
                elemento.innerHTML = "";

        }
    );

    const resultados =
        await Promise.all(
            COLECOES.map(
                buscarColecao
            )
        );

    catalogo =
        resultados.flat();

    console.log(
        `🎥 ${catalogo.length} conteúdos encontrados`
    );

    if (!catalogo.length) {

        $("filmes").innerHTML = `
            <p class="vazio">
                Nenhum título disponível no momento.
            </p>
        `;

        return;

    }


    /* EM ALTA */

    catalogo
        .filter(
            item =>
                item.destaque === true
        )
        .forEach(
            item =>
                adicionarCard(
                    "emAlta",
                    item
                )
        );


    /* CATEGORIAS */

    catalogo.forEach(
        item => {

            const tipo =
                String(
                    item.tipo || ""
                ).toLowerCase();

            if (
                tipo === "serie" ||
                tipo === "series"
            ) {

                adicionarCard(
                    "series",
                    item
                );

            }

            else if (
                tipo === "anime" ||
                tipo === "animes"
            ) {

                adicionarCard(
                    "animes",
                    item
                );

            }

            else if (
                tipo === "dorama" ||
                tipo === "doramas"
            ) {

                adicionarCard(
                    "doramas",
                    item
                );

            }

            else {

                adicionarCard(
                    "filmes",
                    item
                );

            }

        }
    );


    /* RECOMENDADOS */

    catalogo
        .filter(
            item =>
                item.recomendado === true
        )
        .forEach(
            item =>
                adicionarCard(
                    "recomendados",
                    item
                )
        );


    carregarDestaque();

    montarFiltros();

    aplicarFiltrosEBusca();

}


/* =========================================================
   ADICIONAR CARD
========================================================= */

function adicionarCard(
    containerId,
    item
) {

    const container =
        $(containerId);

    if (!container)
        return;

    container.appendChild(
        criarCard(item)
    );

}


/* =========================================================
   CRIAR CARD
========================================================= */

function criarCard(item) {

    const card =
        document.createElement("div");

    card.className =
        "movie-card";

    card.dataset.titulo =
        String(
            item.titulo || ""
        ).toLowerCase();

    card.dataset.categoria =
        String(
            item.categoria || ""
        );

    const tag =
        obterTagItem(item);

    let rotulo =
        "GRÁTIS";

    if (tag === "prime") {

        rotulo =
            `PRIME ${formatarPreco(
                valoresPlanosAdmin.prime
            )}`;

    }

    if (tag === "premium") {

        rotulo =
            `PREMIUM ${formatarPreco(
                valoresPlanosAdmin.premium
            )}`;

    }


    const selo =
        document.createElement(
            "span"
        );

    selo.className =
        `selo-card ${tag}`;

    selo.innerText =
        rotulo;

    card.appendChild(
        selo
    );


    if (item.capa) {

        const imagem =
            document.createElement(
                "img"
            );

        imagem.src =
            item.capa;

        imagem.alt =
            item.titulo || "";

        imagem.loading =
            "lazy";

        imagem.onerror =
            () => {

                imagem.style.display =
                    "none";

                mostrarFallback();

            };

        card.appendChild(
            imagem
        );

    }


    const fallback =
        document.createElement(
            "div"
        );

    fallback.className =
        "titulo-fallback hidden";

    fallback.innerText =
        item.titulo ||
        "Sem título";

    card.appendChild(
        fallback
    );


    if (!item.capa) {

        fallback.classList
            .remove("hidden");

    }


    card.addEventListener(
        "click",
        () => {

            abrirDetalhes(
                item
            );

        }
    );


    function mostrarFallback() {

        fallback.classList
            .remove("hidden");

    }


    return card;

}


/* =========================================================
   FILTROS
========================================================= */

function montarFiltros() {

    const container =
        $("filtros");

    if (!container)
        return;

    container
        .querySelectorAll(
            '.chip:not([data-genero="Todos"])'
        )
        .forEach(
            chip =>
                chip.remove()
        );

    const generos =
        [
            ...new Set(
                catalogo
                    .map(
                        item =>
                            item.categoria
                    )
                    .filter(Boolean)
            )
        ]
        .sort();

    generos.forEach(
        genero => {

            const chip =
                document.createElement(
                    "button"
                );

            chip.className =
                "chip";

            chip.dataset.genero =
                genero;

            chip.innerText =
                genero;

            container.appendChild(
                chip
            );

        }
    );

}


function aplicarFiltrosEBusca() {

    const campo =
        $("busca");

    const texto =
        campo
            ? campo.value
                .toLowerCase()
                .trim()
            : "";

    const ativo =
        document.querySelector(
            "#filtros .chip.ativo"
        );

    const genero =
        ativo?.dataset.genero ||
        "Todos";


    document
        .querySelectorAll(
            ".movie-card"
        )
        .forEach(
            card => {

                const titulo =
                    card.dataset.titulo ||
                    "";

                const categoria =
                    card.dataset.categoria ||
                    "";

                const buscaOK =
                    !texto ||
                    titulo.includes(texto);

                const generoOK =
                    genero === "Todos" ||
                    categoria === genero;

                card.style.display =
                    buscaOK &&
                    generoOK
                        ? ""
                        : "none";

            }
        );

}


$("filtros")
    ?.addEventListener(
        "click",
        evento => {

            const chip =
                evento.target.closest(
                    ".chip"
                );

            if (!chip)
                return;

            document
                .querySelectorAll(
                    "#filtros .chip"
                )
                .forEach(
                    item =>
                        item.classList
                            .remove("ativo")
                );

            chip.classList
                .add("ativo");

            aplicarFiltrosEBusca();

        }
    );


$("busca")
    ?.addEventListener(
        "input",
        aplicarFiltrosEBusca
    );


/* =========================================================
   DESTAQUE
========================================================= */

function carregarDestaque() {

    const destaque =
        catalogo.find(
            item =>
                item.destaque === true
        ) ||
        catalogo[0];

    if (!destaque)
        return;

    filmeAtual =
        destaque;

    $("heroTitle").innerText =
        destaque.titulo ||
        "V8 Play+";

    $("heroDesc").innerText =
        destaque.descricao ||
        "Sua nova experiência em entretenimento.";


    const imagem =
        destaque.banner ||
        destaque.capa;

    if (imagem) {

        $("hero").style
            .backgroundImage =
            `url("${imagem}")`;

    }

}


/* =========================================================
   DETALHES
========================================================= */

function abrirDetalhes(item) {

    filmeAtual =
        item;

    $("detImg").src =
        item.banner ||
        item.capa ||
        "";

    $("detTitulo").innerText =

        obterTagItem(item);

    const comprado =

        );


    /* =====================================================
       GRATUITO
    ===================================================== */

    if (

        tag === "free"
    ) {

                );

        );


        if (item.arquivoDownload) {

                );

                    );

            container.appendChild(

            );

        }

    }


    /* =====================================================
       PAGO
    ===================================================== */

    else {

        const valor =
            tag === "prime"
                ? valoresPlanosAdmin.prime
                : valoresPlanosAdmin.premium;


        if (comprado) {

            const assistir =
                criarBotao(
                    "btn-login",
                    '<i class="fa-solid fa-play"></i> Assistir Agora'
                );

            assistir.onclick =
                () =>
                    irParaPlayer(item);

            container.appendChild(
                assistir
            );


            if (item.arquivoDownload) {

                const download =
                    criarBotao(
                        "btn-info",
                        '<i class="fa-solid fa-download"></i> Baixar Arquivo'
                    );

                download.onclick =
                    () =>
                        executarDownload(
                            item
                        );

                container.appendChild(
                    download
                );

            }

        }

        else {

            const classe =
                tag === "prime"

            const comprar =

                    `<i class="fa-solid fa-pix"></i>

                     — ${formatarPreco(valor)}`
                );

            comprar.onclick =
                () =>
                    solicitarPix(
                        item,
                        tag,
                        valor
                    );

            container.appendChild(
                comprar
            );

        }

    }


    /* =====================================================
       TRAILER
    ===================================================== */

        item.trailer ||
        item.videoTrailer;

    if (trailer) {

        const btnTrailer =
            criarBotao(
                "btn-info",

            );

        btnTrailer.onclick =

    $("detalheModal")

function criarBotao(
    classe,
    html
) {

    const botao =
        document.createElement(
            "button"
        );

    botao.className =
        classe;

    botao.innerHTML =
        html;

    return botao;

}


/* =========================================================
   PLAYER
========================================================= */

function irParaPlayer(item) {

    if (!item) {

        mostrarNotificacao(
            "Conteúdo não encontrado."
        );

        return;

    }

    if (!item.id) {

        mostrarNotificacao(
            "ID do conteúdo não encontrado."
        );

        return;

    }

    if (!item.colecao) {

        mostrarNotificacao(
            "Coleção do conteúdo não encontrada."
        );

        return;

    }


    console.log(
        "🎬 Abrindo player:",
        item.titulo
    );


    const params =
        new URLSearchParams();

    params.set(
        "id",
        item.id
    );

    params.set(
        "colecao",
        item.colecao
    );


    const video =
        item.video ||
        item.video1 ||
        item.video2 ||
        item.video3 ||
        item.embed ||
        "";

    if (video) {

        params.set(
            "video",
            video
        );

    }


    if (item.titulo) {

        params.set(
            "title",
            item.titulo
        );

    }


    const url =
        `player.html?${params.toString()}`;

    console.log(
        "🔗",
        url
    );


    /*
       IMPORTANTE:
       Não usamos window.open().
       AdBlock costuma bloquear window.open().
       Usamos navegação direta.
    */

    window.location.href =
        url;

}


/* =========================================================
   TRAILER
========================================================= */

function abrirTrailer(item) {

    const trailer =
        item.trailer ||
        item.videoTrailer;

    if (!trailer) {

        mostrarNotificacao(
            "Trailer não encontrado."
        );

        return;

    }

    const params =
        new URLSearchParams();

    params.set(
        "id",
        item.id
    );

    params.set(
        "colecao",
        item.colecao
    );

    params.set(
        "trailer",
        "true"
    );

    params.set(
        "video",
        trailer
    );

    if (item.titulo) {

        params.set(
            "title",
            item.titulo
        );

    }


    window.location.href =
        `player.html?${params.toString()}`;

}


/* =========================================================
   ANÚNCIO
========================================================= */

function iniciarFluxoAnuncio(
    tipo,
    item
) {

    filmeAtual =
        item;

    acaoAnuncioPendente =
        tipo;

    $("detalheModal")
        .classList
        .add("hidden");

    $("adModal")
        .classList
        .remove("hidden");


    let contador =
        5;

    const botao =
        $("btnConfirmarAd");

    botao.disabled =
        true;

    botao.style.opacity =
        "0.5";

    botao.innerText =
        `Aguarde ${contador}s...`;


    if (adTimer)
        clearInterval(adTimer);


    adTimer =
        setInterval(
            () => {

                contador--;

                if (contador > 0) {

                    botao.innerText =
                        `Aguarde ${contador}s...`;

                }
                else {

                    clearInterval(
                        adTimer
                    );

                    adTimer =
                        null;

                    botao.disabled =
                        false;

                    botao.style.opacity =
                        "1";

                    botao.innerText =
                        tipo === "assistir"
                            ? "Assistir agora"
                            : "Iniciar download";

                }

            },
            1000
        );

}


/* =========================================================
   CONFIRMAR ANÚNCIO
========================================================= */

$("btnConfirmarAd")
    ?.addEventListener(
        "click",
        () => {

            if (!filmeAtual)
                return;

            const item =
                filmeAtual;

            const acao =
                acaoAnuncioPendente;

            fecharModais();


            if (
                acao === "assistir"
            ) {

                irParaPlayer(
                    item
                );

            }

            else if (
                acao === "baixar"
            ) {

                executarDownload(
                    item
                );

            }

        }
    );


/* =========================================================
   DOWNLOAD
========================================================= */

function executarDownload(item) {

    const url =
        item?.arquivoDownload ||
        "";

    if (!url) {

        mostrarNotificacao(
            "Link de download não disponível."
        );

        return;

    }


    /*
       Navegação direta evita bloqueio
       de pop-up pelo navegador/adblock.
    */

    window.location.href =
        url;

}


/* =========================================================
   INFINITEPAY
========================================================= */

async function solicitarPix(
    item,
    tag,
    valor
) {

    if (!auth.currentUser) {

        fecharModais();

        $("loginModal")
            .classList
            .remove("hidden");

        $("erroAuth").innerText =
            `Faça login para comprar o acesso ${tag.toUpperCase()}.`;

        return;

    }


    if (
        !Number.isFinite(
            Number(valor)
        ) ||
        Number(valor) <= 0
    ) {

        mostrarNotificacao(
            "Valor inválido."
        );

        return;

    }


    try {

        mostrarNotificacao(
            "Gerando pagamento..."
        );


        const payload = {

            uid:
                auth.currentUser.uid,

            email:
                auth.currentUser.email || "",

            itemId:
                item.id,

            colecao:
                item.colecao,

            tag:
                tag,

            valor:
                Number(valor)

        };


        const resposta =
            await fetch(
                "/criar-compra-pix",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            payload
                        )

                }
            );


        const texto =
            await resposta.text();

        let dados;

        try {

            dados =
                JSON.parse(texto);

        }

        catch {

            dados = {
                success: false,
                error:
                    texto ||
                    "Resposta inválida."
            };

        }


        if (!resposta.ok) {

            mostrarNotificacao(
                dados.error ||
                `Erro HTTP ${resposta.status}`
            );

            return;

        }


        if (
            dados.success &&
            dados.checkout_url
        ) {

            window.location.href =
                dados.checkout_url;

            return;

        }


        mostrarNotificacao(
            dados.error ||
            "Não foi possível criar o checkout."
        );

    }

    catch (erro) {

        console.error(
            "Erro InfinitePay:",
            erro
        );

        mostrarNotificacao(
            "Falha na conexão com o pagamento."
        );

    }

}


/* =========================================================
   FECHAR MODAIS
========================================================= */

window.fecharModais =
    function () {

        document
            .querySelectorAll(
                ".modal"
            )
            .forEach(
                modal =>
                    modal.classList
                        .add("hidden")
            );

        if (adTimer) {

            clearInterval(
                adTimer
            );

            adTimer =
                null;

        }

    };


/* =========================================================
   HERO
========================================================= */

$("heroAssistir")
    ?.addEventListener(
        "click",
        () => {

            if (filmeAtual)
                abrirDetalhes(
                    filmeAtual
                );

        }
    );


$("heroInfo")
    ?.addEventListener(
        "click",
        () => {

            if (filmeAtual)
                abrirDetalhes(
                    filmeAtual
                );

        }
    );


/* =========================================================
   LOGIN / CADASTRO
========================================================= */

$("alternarCadastro")
    ?.addEventListener(
        "click",
        () => {

            modoCadastro =
                !modoCadastro;

            $("tituloAuth")
                .innerText =
                modoCadastro
                    ? "Criar nova conta"
                    : "Entrar no V8 Play+";

            $("doLogin")
                .innerText =
                modoCadastro
                    ? "Criar conta"
                    : "Entrar";

            $("alternarCadastro")
                .innerText =
                modoCadastro
                    ? "Já possui conta? Fazer login"
                    : "Ainda não tem conta? Criar conta";

            $("erroAuth")
                .innerText =
                "";

        }
    );


/* =========================================================
   ESQUECI SENHA
========================================================= */

$("btnEsqueciSenha")
    ?.addEventListener(
        "click",
        async () => {

            const email =
                $("email")
                    .value
                    .trim();

            if (!email) {

                $("erroAuth")
                    .innerText =
                    "Informe seu e-mail.";

                return;

            }


            try {

                await sendPasswordResetEmail(
                    auth,
                    email
                );

                mostrarNotificacao(
                    "E-mail de redefinição enviado."
                );

                $("erroAuth")
                    .innerText =
                    "";

            }

            catch (erro) {

                console.error(
                    erro
                );

                $("erroAuth")
                    .innerText =
                    "Não foi possível enviar o e-mail.";

            }

        }
    );


/* =========================================================
   LOGIN
========================================================= */

$("doLogin")
    ?.addEventListener(
        "click",
        async () => {

            const email =
                $("email")
                    .value
                    .trim();

            const senha =
                $("password")
                    .value;

            const erro =
                $("erroAuth");

            erro.innerText =
                "";


            if (!email || !senha) {

                erro.innerText =
                    "Preencha todos os campos.";

                return;

            }


            try {

                if (modoCadastro) {

                    const cred =
                        await createUserWithEmailAndPassword(
                            auth,
                            email,
                            senha
                        );


                    await setDoc(

                        doc(
                            db,
                            "usuarios",
                            cred.user.uid
                        ),

                        {

                            email:
                                email,

                            admin:
                                false,

                            criadoEm:
                                serverTimestamp()

                        }

                    );

                }

                else {

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        senha
                    );

                }


                fecharModais();

                mostrarNotificacao(
                    modoCadastro
                        ? "Conta criada com sucesso!"
                        : "Login realizado!"
                );

            }

            catch (erroFirebase) {

                console.error(
                    erroFirebase
                );

                switch (
                    erroFirebase.code
                ) {

                    case "auth/invalid-credential":
                    case "auth/wrong-password":
                    case "auth/user-not-found":

                        erro.innerText =
                            "E-mail ou senha incorretos.";

                        break;

                    case "auth/email-already-in-use":

                        erro.innerText =
                            "Este e-mail já está cadastrado.";

                        break;

                    case "auth/weak-password":

                        erro.innerText =
                            "A senha deve possuir pelo menos 6 caracteres.";

                        break;

                    case "auth/invalid-email":

                        erro.innerText =
                            "E-mail inválido.";

                        break;

                    default:

                        erro.innerText =
                            "Falha na autenticação.";

                    }

            }

        }
    );


/* =========================================================
   BOTÃO ENTRAR / SAIR
========================================================= */

$("authBtn")
    ?.addEventListener(
        "click",
        async () => {

            if (auth.currentUser) {

                await signOut(
                    auth
                );

                mostrarNotificacao(
                    "Sessão encerrada."
                );

                return;

            }


            $("loginModal")
                .classList
                .remove("hidden");

        }
    );


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
    auth,
    user => {

        const botao =
            $("authBtn");

        if (!botao)
            return;


        if (user) {

            const nome =
                user.email
                    ? user.email
                        .split("@")[0]
                    : "Usuário";

            botao.innerText =
                `Sair (${nome})`;

        }

        else {

            botao.innerText =
                "Entrar";

        }

    }
);


/* =========================================================
   NOTIFICAÇÃO
========================================================= */

function mostrarNotificacao(
    mensagem
) {

    const box =
        $("notification");

    const texto =
        $("notificationText");

    if (!box || !texto)
        return;

    texto.innerText =
        mensagem;

    box.classList
        .remove("hidden");


    setTimeout(
        () => {

            box.classList
                .add("hidden");

        },
        3500
    );

}


/* =========================================================
   FECHAR MODAL CLICANDO FORA
========================================================= */

document
    .querySelectorAll(
        ".modal"
    )
    .forEach(
        modal => {

            modal.addEventListener(
                "click",
                evento => {

                    if (
                        evento.target ===
                        modal
                    ) {

                        fecharModais();

                    }

                }
            );

        }
    );


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    evento => {

        if (
            evento.key === "Escape"
        ) {

            fecharModais();

        }

    }
);


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

console.log(
    "🚀 V8 Play+ iniciado"
);

console.log(
    "🛡️ Navegação direta do player ativada"
);


carregarCatalogo()
    .catch(
        erro => {

            console.error(
                "Erro ao iniciar V8 Play+:",
                erro
            );

        }
    );

</script>
