<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>V8 Play+</title>

    <!-- =====================================================
         FONTES
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >


    <style>

        /* =====================================================
           VARIÁVEIS
        ====================================================== */

        :root {

            --primary: #00d4ff;
            --primary-hover: #00a2c7;

            --bg-dark: #0a0a0b;
            --bg-card: #16161a;
            --bg-modal: #121214;

            --text: #ffffff;
            --text-secondary: #aaaaaa;

            --border: #2a2a30;

            --success: #20d489;
            --danger: #ff5c5c;

        }


        /* =====================================================
           RESET
        ====================================================== */

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }


        html {

            scroll-behavior: smooth;

        }


        body {

            background: var(--bg-dark);

            color: var(--text);

            font-family: "Poppins", sans-serif;

            overflow-x: hidden;

            min-height: 100vh;

        }


        button,
        input {

            font-family: inherit;

        }


        button {

            -webkit-tap-highlight-color: transparent;

        }


        /* =====================================================
           HEADER
        ====================================================== */

        header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            padding: 14px 5%;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            z-index: 1000;

            background:
                linear-gradient(
                    to bottom,
                    rgba(10,10,11,.98),
                    rgba(10,10,11,.85),
                    rgba(10,10,11,0)
                );

            backdrop-filter: blur(8px);

            -webkit-backdrop-filter: blur(8px);

        }


        /* =====================================================
           LOGO
        ====================================================== */

        .logo {

            display: flex;

            align-items: center;

            gap: 8px;

            text-decoration: none;

            font-size: 1.5rem;

            font-weight: 800;

            color: white;

            white-space: nowrap;

            min-width: max-content;

        }


        .logo span {

            color: var(--primary);

        }


        .logo-img {

            height: 42px;

            width: auto;

            max-width: 150px;

            object-fit: contain;

        }


        /* =====================================================
           BUSCA
        ====================================================== */

        .search-box {

            flex: 1;

            width: 100%;

            max-width: 360px;

            position: relative;

        }


        #busca {

            width: 100%;

            padding: 10px 16px 10px 40px;

            border-radius: 20px;

            border: 1px solid var(--border);

            background:
                rgba(255,255,255,.06);

            color: white;

            outline: none;

            transition: .3s;

            font-size: .9rem;

        }


        #busca::placeholder {

            color: #888;

        }


        #busca:focus {

            border-color:
                var(--primary);

            background:
                rgba(0,0,0,.45);

            box-shadow:
                0 0 12px
                rgba(0,212,255,.18);

        }


        .search-icon {

            position: absolute;

            left: 14px;

            top: 50%;

            transform:
                translateY(-50%);

            color:
                var(--text-secondary);

            font-size: .85rem;

            pointer-events: none;

        }


        /* =====================================================
           BOTÃO LOGIN
        ====================================================== */

        .btn-login {

            background:
                var(--primary);

            color: #000;

            border: none;

            padding: 9px 22px;

            border-radius: 20px;

            font-weight: 600;

            cursor: pointer;

            white-space: nowrap;

            transition: .2s;

            font-size: .9rem;

        }


        .btn-login:hover {

            background:
                var(--primary-hover);

            transform:
                translateY(-1px);

        }


        .btn-login:active {

            transform:
                scale(.98);

        }


        /* =====================================================
           ÁREA PROMOCIONAL
           
           IMPORTANTE:
           Não usamos "ad", "ads", "advertisement" ou nomes
           semelhantes nos IDs/classes principais para diminuir
           falsos positivos de bloqueadores.
        ====================================================== */

        .promo-space {

            width: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 10px 5%;

            margin-top: 72px;

        }


        .promo-placeholder {

            width: 100%;

            max-width: 970px;

            height: 90px;

            background:
                #151519;

            border:
                1px dashed #333;

            border-radius: 8px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            color: #666;

            font-size: .78rem;

        }


        .promo-placeholder small {

            margin-top: 4px;

            color: #4f4f54;

        }


        /* =====================================================
           HERO
        ====================================================== */

        #hero {

            height: 70vh;

            min-height: 500px;

            position: relative;

            display: flex;

            align-items: flex-end;

            padding:
                0 5% 50px;

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-color: #111;

            transition:
                background-image .5s ease-in-out;

        }


        #hero::before {

            content: "";

            position: absolute;

            inset: 0;

            background:

                linear-gradient(
                    to top,
                    var(--bg-dark) 4%,
                    transparent 62%
                ),

                linear-gradient(
                    to right,
                    rgba(10,10,11,.92),
                    rgba(10,10,11,.35),
                    transparent 75%
                );

        }


        #hero::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,.25),
                    transparent 35%
                );

            pointer-events: none;

        }


        .hero-content {

            position: relative;

            z-index: 2;

            max-width: 650px;

        }


        .hero-content h1 {

            font-size: 2.8rem;

            font-weight: 800;

            margin-bottom: 12px;

            line-height: 1.1;

        }


        .hero-content p {

            color: #ddd;

            margin-bottom: 22px;

            line-height: 1.6;

            font-size: .95rem;

            display: -webkit-box;

            -webkit-line-clamp: 3;

            -webkit-box-orient: vertical;

            overflow: hidden;

        }


        /* =====================================================
           BOTÕES HERO
        ====================================================== */

        .hero-btns {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

        }


        .hero-btns button {

            padding:
                12px 25px;

            border-radius: 6px;

            border: none;

            font-weight: 600;

            cursor: pointer;

            transition: .2s;

            font-size: .95rem;

        }


        .btn-assistir {

            background: #fff;

            color: #000;

        }


        .btn-assistir:hover {

            background: #e4e4e4;

            transform:
                translateY(-2px);

        }


        .btn-info {

            background:
                rgba(255,255,255,.15);

            color: white;

            backdrop-filter: blur(5px);

            border:
                1px solid
                rgba(255,255,255,.12);

            padding:
                10px 20px;

            border-radius: 6px;

            cursor: pointer;

            transition: .2s;

        }


        .btn-info:hover {

            background:
                rgba(255,255,255,.25);

            transform:
                translateY(-2px);

        }


        /* =====================================================
           CONTAINER
        ====================================================== */

        .container {

            padding:
                30px 5%;

            width: 100%;

        }


        /* =====================================================
           FILTROS
        ====================================================== */

        .filtros {

            display: flex;

            gap: 10px;

            overflow-x: auto;

            padding-bottom: 10px;

            margin-bottom: 15px;

            scrollbar-width: none;

        }


        .filtros::-webkit-scrollbar {

            display: none;

        }


        .chip {

            padding:
                8px 18px;

            border-radius: 20px;

            border:
                1px solid var(--border);

            background:
                rgba(255,255,255,.03);

            color:
                var(--text-secondary);

            cursor: pointer;

            font-size: .85rem;

            white-space: nowrap;

            transition: .2s;

        }


        .chip:hover {

            border-color:
                var(--primary);

            color: white;

        }


        .chip.ativo {

            background:
                var(--primary);

            color: #000;

            border-color:
                var(--primary);

            font-weight: 600;

        }


        /* =====================================================
           TÍTULO DAS SEÇÕES
        ====================================================== */

        .section-title {

            font-size: 1.3rem;

            margin:
                25px 0 12px;

            display: flex;

            align-items: center;

            gap: 8px;

            font-weight: 600;

        }


        /* =====================================================
           CARDS
        ====================================================== */

        .cards {

            display: flex;

            gap: 16px;

            overflow-x: auto;

            padding:
                10px 0 25px;

            scrollbar-width: thin;

            scrollbar-color:
                #333 transparent;

        }


        .cards::-webkit-scrollbar {

            height: 6px;

        }


        .cards::-webkit-scrollbar-track {

            background: transparent;

        }


        .cards::-webkit-scrollbar-thumb {

            background: #333;

            border-radius: 10px;

        }


        .movie-card {

            min-width: 165px;

            width: 165px;

            height: 245px;

            background:
                var(--bg-card);

            border-radius: 10px;

            cursor: pointer;

            transition:
                transform .25s,
                box-shadow .25s,
                border-color .25s;

            flex-shrink: 0;

            overflow: hidden;

            position: relative;

            border:
                1px solid
                rgba(255,255,255,.05);

        }


        .movie-card:hover {

            transform:
                translateY(-6px);

            box-shadow:
                0 8px 25px
                rgba(0,212,255,.22);

            border-color:
                var(--primary);

        }


        .movie-card img {

            width: 100%;

            height: 100%;

            display: block;

            object-fit: cover;

        }


        .movie-card .titulo-fallback {

            padding: 15px;

            font-size: .9rem;

            text-align: center;

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                #1a1a20;

        }


        /* =====================================================
           SELOS
        ====================================================== */

        .selo-card {

            position: absolute;

            top: 10px;

            right: 10px;

            padding:
                4px 8px;

            border-radius: 4px;

            font-size: .62rem;

            font-weight: 700;

            z-index: 2;

            box-shadow:
                0 2px 5px
                rgba(0,0,0,.5);

            text-transform: uppercase;

        }


        .selo-card.gratis,
        .selo-card.free {

            background:
                rgba(0,0,0,.75);

            color:
                var(--primary);

            border:
                1px solid
                var(--primary);

        }


        .selo-card.prime {

            background:
                linear-gradient(
                    135deg,
                    #ffaa00,
                    #ff5500
                );

            color: #000;

        }


        .selo-card.premium {

            background:
                linear-gradient(
                    135deg,
                    #00d4ff,
                    #0072ff
                );

            color: #000;

        }


        /* =====================================================
           ESTADO VAZIO
        ====================================================== */

        .vazio {

            color:
                var(--text-secondary);

            font-size: .9rem;

            padding:
                20px 0;

        }


        /* =====================================================
           ÁREA PROMOCIONAL NO MEIO
        ====================================================== */

        .promo-mid {

            width: 100%;

            display: flex;

            justify-content: center;

            padding:
                20px 0;

        }


        .promo-mid-box {

            width: 100%;

            max-width: 970px;

            height: 120px;

            background:
                #151519;

            border:
                1px dashed #333;

            border-radius: 8px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            color: #666;

            text-align: center;

            font-size: .8rem;

        }


        .promo-mid-box small {

            color: #4f4f54;

            margin-top: 4px;

        }


        /* =====================================================
           MODAL
        ====================================================== */

        .modal {

            position: fixed;

            inset: 0;

            width: 100%;

            height: 100%;

            z-index: 3000;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                rgba(0,0,0,.88);

            backdrop-filter:
                blur(7px);

            -webkit-backdrop-filter:
                blur(7px);

            padding: 20px;

            overflow-y: auto;

        }


        .hidden {

            display: none !important;

        }


        /* =====================================================
           LOGIN
        ====================================================== */

        .login-box {

            background:
                var(--bg-modal);

            padding: 35px;

            border-radius: 12px;

            width: 100%;

            max-width: 400px;

            text-align: center;

            border:
                1px solid #222;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.55);

        }


        .login-box h2 {

            margin-bottom: 15px;

            font-weight: 700;

        }


        .login-box p {

            color:
                var(--text-secondary);

        }


        .login-box input {

            width: 100%;

            padding: 12px;

            margin-bottom: 12px;

            background:
                #1c1c20;

            border:
                1px solid #333;

            color: white;

            border-radius: 6px;

            outline: none;

        }


        .login-box input:focus {

            border-color:
                var(--primary);

        }


        .login-box .btn-secundario {

            background: none;

            color:
                var(--text-secondary);

            border: none;

            margin-top: 10px;

            cursor: pointer;

            font-size: .85rem;

            display: block;

            width: 100%;

            text-align: center;

        }


        .login-box .btn-secundario:hover {

            color: white;

            text-decoration:
                underline;

        }


        .erro-msg {

            color:
                var(--danger) !important;

            font-size: .85rem;

            min-height: 20px;

            margin-bottom: 8px;

        }


        /* =====================================================
           DETALHES
        ====================================================== */

        .detalhe-box {

            background:
                var(--bg-modal);

            border-radius: 12px;

            max-width: 650px;

            width: 100%;

            overflow: hidden;

            border:
                1px solid #222;

            position: relative;

            box-shadow:
                0 20px 70px
                rgba(0,0,0,.65);

        }


        .detalhe-box img {

            width: 100%;

            max-height: 300px;

            display: block;

            object-fit: cover;

        }


        .detalhe-info {

            padding: 25px;

        }


        .detalhe-info h2 {

            margin-bottom: 6px;

            font-size: 1.6rem;

        }


        .detalhe-meta {

            color:
                var(--text-secondary);

            font-size: .85rem;

            margin-bottom: 14px;

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

        }


        .detalhe-info p {

            color: #ccc;

            line-height: 1.6;

            margin-bottom: 20px;

            font-size: .92rem;

        }


        .detalhe-btns {

            display: flex;

            gap: 10px;

            margin-bottom: 10px;

            flex-wrap: wrap;

        }


        .detalhe-btns button {

            padding:
                10px 20px;

            border-radius: 6px;

            border: none;

            font-weight: 600;

            cursor: pointer;

            transition: .2s;

            font-size: .9rem;

        }


        .detalhe-btns button:hover {

            transform:
                translateY(-1px);

        }


        /* =====================================================
           BOTÕES DE COMPRA
        ====================================================== */

        .btn-pix-prime {

            background:
                linear-gradient(
                    135deg,
                    #ffaa00,
                    #ff5500
                );

            color: #000;

        }


        .btn-pix-premium {

            background:
                linear-gradient(
                    135deg,
                    #00d4ff,
                    #0072ff
                );

            color: #fff;

        }


        .btn-gratis {

            background:
                linear-gradient(
                    135deg,
                    #00d4ff,
                    #0072ff
                );

            color: #000;

        }


        /* =====================================================
           NOTIFICAÇÃO
        ====================================================== */

        #notification {

            position: fixed;

            bottom: 25px;

            left: 50%;

            transform:
                translateX(-50%);

            background:
                #1f1f24;

            color: white;

            padding:
                12px 28px;

            border-radius: 30px;

            z-index: 5000;

            border:
                1px solid
                var(--primary);

            box-shadow:
                0 4px 15px
                rgba(0,0,0,.5);

            font-size: .9rem;

            text-align: center;

            max-width: 90%;

        }


        /* =====================================================
           CHECKOUT
        ====================================================== */

        .checkout-info {

            color: #aaa;

            font-size: .82rem;

            margin-top: 10px;

            line-height: 1.5;

        }


        /* =====================================================
           MODAL DE ESPERA
        ====================================================== */

        .waiting-box {

            background:
                var(--bg-modal);

            padding: 30px;

            border-radius: 12px;

            width: 100%;

            max-width: 450px;

            text-align: center;

            border:
                1px solid #222;

        }


        .waiting-icon {

            width: 55px;

            height: 55px;

            margin:
                0 auto 15px;

            border-radius: 50%;

            border:
                4px solid
                rgba(255,255,255,.1);

            border-top-color:
                var(--primary);

            animation:
                girar .8s linear infinite;

        }


        @keyframes girar {

            to {

                transform:
                    rotate(360deg);

            }

        }


        .waiting-box h2 {

            margin-bottom: 10px;

        }


        .waiting-box p {

            color: #aaa;

            font-size: .85rem;

            line-height: 1.5;

        }


        /* =====================================================
           RESPONSIVO
        ====================================================== */

        @media (max-width: 700px) {


            header {

                padding:
                    11px 4%;

                gap: 8px;

            }


            .logo {

                font-size:
                    1.05rem;

            }


            .logo-img {

                height: 34px;

                max-width: 100px;

            }


            .search-box {

                max-width: none;

            }


            #busca {

                padding:
                    9px 10px 9px 34px;

                font-size: .8rem;

            }


            .search-icon {

                left: 11px;

            }


            .btn-login {

                padding:
                    8px 13px;

                font-size: .78rem;

            }


            .promo-space {

                margin-top: 65px;

                padding:
                    8px 4%;

            }


            .promo-placeholder {

                height: 65px;

            }


            #hero {

                height: 65vh;

                min-height: 430px;

                padding:
                    0 5% 35px;

            }


            .hero-content h1 {

                font-size:
                    2rem;

            }


            .hero-content p {

                font-size:
                    .85rem;

            }


            .hero-btns button {

                padding:
                    10px 17px;

                font-size:
                    .85rem;

            }


            .container {

                padding:
                    20px 4%;

            }


            .section-title {

                font-size:
                    1.15rem;

            }


            .movie-card {

                min-width:
                    140px;

                width:
                    140px;

                height:
                    210px;

            }


            .login-box {

                padding:
                    25px;

            }


            .detalhe-info {

                padding:
                    20px;

            }


            .detalhe-info h2 {

                font-size:
                    1.35rem;

            }

        }


        @media (max-width: 430px) {


            .logo span {

                display: none;

            }


            .logo-img {

                max-width:
                    85px;

            }


            .btn-login {

                padding:
                    8px 11px;

            }


            .hero-content h1 {

                font-size:
                    1.75rem;

            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     CABEÇALHO
========================================================= -->

<header>


    <a
        href="#"
        class="logo"
        aria-label="V8 Play+"
    >

        <img
            src="assets/v8p.png"
            alt="V8 Play+"
            class="logo-img"
            onerror="this.style.display='none'"
        >

        <span>
            V8 Play+
        </span>

    </a>


    <div class="search-box">

        <i
            class="fa-solid fa-magnifying-glass search-icon"
        ></i>

        <input
            type="text"
            id="busca"
            placeholder="Buscar filmes, séries e doramas..."
            autocomplete="off"
            spellcheck="false"
        >

    </div>


    <button
        class="btn-login"
        id="authBtn"
        type="button"
    >

        Entrar

    </button>


</header>



<!-- =========================================================
     ESPAÇO SUPERIOR
     
     Este bloco é visual e independente do funcionamento
     do catálogo/player.
========================================================= -->

<div class="promo-space">

    <div class="promo-placeholder">

        <span>
            ESPAÇO PROMOCIONAL
        </span>

        <small>
            Conteúdo patrocinado
        </small>

    </div>

</div>



<!-- =========================================================
     HERO
========================================================= -->

<section id="hero">


    <div class="hero-content">


        <h1 id="heroTitle">
            Carregando...
        </h1>


        <p id="heroDesc">

            Sua nova experiência
            em entretenimento
            em alta definição.

        </p>


        <div class="hero-btns">


            <button
                class="btn-assistir"
                id="heroAssistir"
                type="button"
            >

                <i class="fa-solid fa-play"></i>

                Ver Opções

            </button>


            <button
                class="btn-info"
                id="heroInfo"
                type="button"
            >

                <i class="fa-solid fa-circle-info"></i>

                Mais detalhes

            </button>


        </div>


    </div>


</section>



<!-- =========================================================
     CATÁLOGO
========================================================= -->

<div class="container">


    <!-- FILTROS -->

    <div
        class="filtros"
        id="filtros"
    >


        <button
            class="chip ativo"
            data-genero="Todos"
            type="button"
        >

            Todos

        </button>


    </div>



    <!-- EM ALTA -->

    <h2 class="section-title">

        🔥 Em Alta

    </h2>


    <div
        class="cards"
        id="emAlta"
    ></div>



    <!-- FILMES -->

    <h2 class="section-title">

        🎬 Filmes

    </h2>


    <div
        class="cards"

    <script type="module">

import {
    db,
    auth
} from "./js/firebase.js";

import {
    collection,
    getDocs,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

import {
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    sendPasswordResetEmail,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const COLECOES = [
    "filmes",
    "series",
    "animes",
    "doramas"
];

let catalogo = [];
let filmeAtual = null;
let modoCadastro = false;
let acaoAnuncioPendente = null;
let adTimer = null;

let titulosComprados =
    new Set();

let valoresPlanosAdmin = {
    prime: 9.90,
    premium: 19.90
};


/* =========================================================
   ELEMENTOS
========================================================= */

const $ = id =>
    document.getElementById(id);


/* =========================================================
   PREÇO
========================================================= */

function formatarPreco(valor) {

    const numero =
        Number(valor) || 0;

    return `R$ ${numero
        .toFixed(2)
        .replace(".", ",")}`;
}


/* =========================================================
   CARREGAR PREÇOS
========================================================= */

async function carregarPrecosAdmin() {

    try {

        const ref =
            doc(
                db,
                "configuracoes",
                "planos"
            );

        const snap =
            await getDoc(ref);

        if (!snap.exists())
            return;

        const dados =
            snap.data();

        if (dados.prime !== undefined) {

            valoresPlanosAdmin.prime =
                Number(dados.prime);

        }

        if (dados.premium !== undefined) {

            valoresPlanosAdmin.premium =
                Number(dados.premium);

        }

    }

    catch (erro) {

        console.warn(
            "Não foi possível carregar os preços:",
            erro
        );

    }

}


/* =========================================================
   TAG DO CONTEÚDO
========================================================= */

function obterTagItem(item) {

    const tag =
        item.tag ||
        item.plano ||
        "gratis";

    return String(tag)
        .toLowerCase()
        .trim();

}


/* =========================================================
   BUSCAR COLEÇÃO
========================================================= */

async function buscarColecao(nome) {

    try {

        const snap =
            await getDocs(
                collection(db, nome)
            );

        const itens = [];

        snap.forEach(
            documento => {

                const dados =
                    documento.data();

                if (
                    dados.ativo === false
                )
                    return;

                itens.push({

                    id:
                        documento.id,

                    colecao:
                        nome,

                    ...dados

                });

            }
        );

        itens.sort(
            (a, b) => {

                const dataA =
                    a.data?.toDate
                        ? a.data.toDate()
                        : new Date(
                            a.data || 0
                        );

                const dataB =
                    b.data?.toDate
                        ? b.data.toDate()
                        : new Date(
                            b.data || 0
                        );

                return dataB - dataA;

            }
        );

        return itens;

    }

    catch (erro) {

        console.error(
            `Erro na coleção ${nome}:`,
            erro
        );

        return [];

    }

}


/* =========================================================
   CARREGAR CATÁLOGO
========================================================= */

async function carregarCatalogo() {

    console.log(
        "🎬 Carregando catálogo..."
    );

    await carregarPrecosAdmin();

    const ids = [
        "emAlta",
        "filmes",
        "series",
        "animes",
        "doramas",
        "recomendados"
    ];

    ids.forEach(
        id => {

            const elemento =
                $(id);

            if (elemento)
                elemento.innerHTML = "";

        }
    );

    const resultados =
        await Promise.all(
            COLECOES.map(
                buscarColecao
            )
        );

    catalogo =
        resultados.flat();

    console.log(
        `🎥 ${catalogo.length} conteúdos encontrados`
    );

    if (!catalogo.length) {

        $("filmes").innerHTML = `
            <p class="vazio">
                Nenhum título disponível no momento.
            </p>
        `;

        return;

    }


    /* EM ALTA */

    catalogo
        .filter(
            item =>
                item.destaque === true
        )
        .forEach(
            item =>
                adicionarCard(
                    "emAlta",
                    item
                )
        );


    /* CATEGORIAS */

    catalogo.forEach(
        item => {

            const tipo =
                String(
                    item.tipo || ""
                ).toLowerCase();

            if (
                tipo === "serie" ||
                tipo === "series"
            ) {

                adicionarCard(
                    "series",
                    item
                );

            }

            else if (
                tipo === "anime" ||
                tipo === "animes"
            ) {

                adicionarCard(
                    "animes",
                    item
                );

            }

            else if (
                tipo === "dorama" ||
                tipo === "doramas"
            ) {

                adicionarCard(
                    "doramas",
                    item
                );

            }

            else {

                adicionarCard(
                    "filmes",
                    item
                );

            }

        }
    );


    /* RECOMENDADOS */

    catalogo
        .filter(
            item =>
                item.recomendado === true
        )
        .forEach(
            item =>
                adicionarCard(
                    "recomendados",
                    item
                )
        );


    carregarDestaque();

    montarFiltros();

    aplicarFiltrosEBusca();

}


/* =========================================================
   ADICIONAR CARD
========================================================= */

function adicionarCard(
    containerId,
    item
) {

    const container =
        $(containerId);

    if (!container)
        return;

    container.appendChild(
        criarCard(item)
    );

}


/* =========================================================
   CRIAR CARD
========================================================= */

function criarCard(item) {

    const card =
        document.createElement("div");

    card.className =
        "movie-card";

    card.dataset.titulo =
        String(
            item.titulo || ""
        ).toLowerCase();

    card.dataset.categoria =
        String(
            item.categoria || ""
        );

    const tag =
        obterTagItem(item);

    let rotulo =
        "GRÁTIS";

    if (tag === "prime") {

        rotulo =
            `PRIME ${formatarPreco(
                valoresPlanosAdmin.prime
            )}`;

    }

    if (tag === "premium") {

        rotulo =
            `PREMIUM ${formatarPreco(
                valoresPlanosAdmin.premium
            )}`;

    }


    const selo =
        document.createElement(
            "span"
        );

    selo.className =
        `selo-card ${tag}`;

    selo.innerText =
        rotulo;

    card.appendChild(
        selo
    );


    if (item.capa) {

        const imagem =
            document.createElement(
                "img"
            );

        imagem.src =
            item.capa;

        imagem.alt =
            item.titulo || "";

        imagem.loading =
            "lazy";

        imagem.onerror =
            () => {

                imagem.style.display =
                    "none";

                mostrarFallback();

            };

        card.appendChild(
            imagem
        );

    }


    const fallback =
        document.createElement(
            "div"
        );

    fallback.className =
        "titulo-fallback hidden";

    fallback.innerText =
        item.titulo ||
        "Sem título";

    card.appendChild(
        fallback
    );


    if (!item.capa) {

        fallback.classList
            .remove("hidden");

    }


    card.addEventListener(
        "click",
        () => {

            abrirDetalhes(
                item
            );

        }
    );


    function mostrarFallback() {

        fallback.classList
            .remove("hidden");

    }


    return card;

}


/* =========================================================
   FILTROS
========================================================= */

function montarFiltros() {

    const container =
        $("filtros");

    if (!container)
        return;

    container
        .querySelectorAll(
            '.chip:not([data-genero="Todos"])'
        )
        .forEach(
            chip =>
                chip.remove()
        );

    const generos =
        [
            ...new Set(
                catalogo
                    .map(
                        item =>
                            item.categoria
                    )
                    .filter(Boolean)
            )
        ]
        .sort();

    generos.forEach(
        genero => {

            const chip =
                document.createElement(
                    "button"
                );

            chip.className =
                "chip";

            chip.dataset.genero =
                genero;

            chip.innerText =
                genero;

            container.appendChild(
                chip
            );

        }
    );

}


function aplicarFiltrosEBusca() {

    const campo =
        $("busca");

    const texto =
        campo
            ? campo.value
                .toLowerCase()
                .trim()
            : "";

    const ativo =
        document.querySelector(
            "#filtros .chip.ativo"
        );

    const genero =
        ativo?.dataset.genero ||
        "Todos";


    document
        .querySelectorAll(
            ".movie-card"
        )
        .forEach(
            card => {

                const titulo =
                    card.dataset.titulo ||
                    "";

                const categoria =
                    card.dataset.categoria ||
                    "";

                const buscaOK =
                    !texto ||
                    titulo.includes(texto);

                const generoOK =
                    genero === "Todos" ||
                    categoria === genero;

                card.style.display =
                    buscaOK &&
                    generoOK
                        ? ""
                        : "none";

            }
        );

}


$("filtros")
    ?.addEventListener(
        "click",
        evento => {

            const chip =
                evento.target.closest(
                    ".chip"
                );

            if (!chip)
                return;

            document
                .querySelectorAll(
                    "#filtros .chip"
                )
                .forEach(
                    item =>
                        item.classList
                            .remove("ativo")
                );

            chip.classList
                .add("ativo");

            aplicarFiltrosEBusca();

        }
    );


$("busca")
    ?.addEventListener(
        "input",
        aplicarFiltrosEBusca
    );


/* =========================================================
   DESTAQUE
========================================================= */

function carregarDestaque() {

    const destaque =
        catalogo.find(
            item =>
                item.destaque === true
        ) ||
        catalogo[0];

    if (!destaque)
        return;

    filmeAtual =
        destaque;

    $("heroTitle").innerText =
        destaque.titulo ||
        "V8 Play+";

    $("heroDesc").innerText =
        destaque.descricao ||
        "Sua nova experiência em entretenimento.";


    const imagem =
        destaque.banner ||
        destaque.capa;

    if (imagem) {

        $("hero").style
            .backgroundImage =
            `url("${imagem}")`;

    }

}


/* =========================================================
   DETALHES
========================================================= */

function abrirDetalhes(item) {

    filmeAtual =
        item;

    $("detImg").src =
        item.banner ||
        item.capa ||
        "";

    $("detTitulo").innerText =
        item.titulo ||
        "Sem título";

    $("detAno").innerText =
        item.ano ||
        "2026";

    $("detCategoria").innerText =
        item.categoria ||
        item.tipo ||
        "";

    $("detDescricao").innerText =
        item.descricao ||
        "Sem descrição disponível.";

    const container =
        $("detBtnsContainer");

    container.innerHTML = "";

    const tag =
        obterTagItem(item);

    const comprado =
        titulosComprados.has(
            item.id
        );


    /* =====================================================
       GRATUITO
    ===================================================== */

    if (
        tag === "gratis" ||
        tag === "free"
    ) {

        const assistir =
            criarBotao(
                "btn-ad-action",
                '<i class="fa-solid fa-play"></i> Assistir'
            );

        assistir.onclick =
            () =>
                iniciarFluxoAnuncio(
                    "assistir",
                    item
                );

        container.appendChild(
            assistir
        );


        if (item.arquivoDownload) {

            const download =
                criarBotao(
                    "btn-ad-action",
                    '<i class="fa-solid fa-download"></i> Baixar'
                );

            download.style.background =
                "linear-gradient(135deg,#00d4ff,#0072ff)";

            download.onclick =
                () =>
                    iniciarFluxoAnuncio(
                        "baixar",
                        item
                    );

            container.appendChild(
                download
            );

        }

    }


    /* =====================================================
       PAGO
    ===================================================== */

    else {

        const valor =
            tag === "prime"
                ? valoresPlanosAdmin.prime
                : valoresPlanosAdmin.premium;


        if (comprado) {

            const assistir =
                criarBotao(
                    "btn-login",
                    '<i class="fa-solid fa-play"></i> Assistir Agora'
                );

            assistir.onclick =
                () =>
                    irParaPlayer(item);

            container.appendChild(
                assistir
            );


            if (item.arquivoDownload) {

                const download =
                    criarBotao(
                        "btn-info",
                        '<i class="fa-solid fa-download"></i> Baixar Arquivo'
                    );

                download.onclick =
                    () =>
                        executarDownload(
                            item
                        );

                container.appendChild(
                    download
                );

            }

        }

        else {

            const classe =
                tag === "prime"
                    ? "btn-pix-prime"
                    : "btn-pix-premium";

            const comprar =
                criarBotao(
                    classe,
                    `<i class="fa-solid fa-pix"></i>
                     Comprar ${tag.toUpperCase()}
                     — ${formatarPreco(valor)}`
                );

            comprar.onclick =
                () =>
                    solicitarPix(
                        item,
                        tag,
                        valor
                    );

            container.appendChild(
                comprar
            );

        }

    }


    /* =====================================================
       TRAILER
    ===================================================== */

    const trailer =
        item.trailer ||
        item.videoTrailer;

    if (trailer) {

        const btnTrailer =
            criarBotao(
                "btn-info",
                '<i class="fa-solid fa-film"></i> Trailer'
            );

        btnTrailer.onclick =
            () =>
                abrirTrailer(item);

        container.appendChild(
            btnTrailer
        );

    }


    $("detalheModal")
        .classList
        .remove("hidden");

}


function criarBotao(
    classe,
    html
) {

    const botao =
        document.createElement(
            "button"
        );

    botao.className =
        classe;

    botao.innerHTML =
        html;

    return botao;

}


/* =========================================================
   PLAYER
========================================================= */

function irParaPlayer(item) {

    if (!item) {

        mostrarNotificacao(
            "Conteúdo não encontrado."
        );

        return;

    }

    if (!item.id) {

        mostrarNotificacao(
            "ID do conteúdo não encontrado."
        );

        return;

    }

    if (!item.colecao) {

        mostrarNotificacao(
            "Coleção do conteúdo não encontrada."
        );

        return;

    }


    console.log(
        "🎬 Abrindo player:",
        item.titulo
    );


    const params =
        new URLSearchParams();

    params.set(
        "id",
        item.id
    );

    params.set(
        "colecao",
        item.colecao
    );


    const video =
        item.video ||
        item.video1 ||
        item.video2 ||
        item.video3 ||
        item.embed ||
        "";

    if (video) {

        params.set(
            "video",
            video
        );

    }


    if (item.titulo) {

        params.set(
            "title",
            item.titulo
        );

    }


    const url =
        `player.html?${params.toString()}`;

    console.log(
        "🔗",
        url
    );


    /*
       IMPORTANTE:
       Não usamos window.open().
       AdBlock costuma bloquear window.open().
       Usamos navegação direta.
    */

    window.location.href =
        url;

}


/* =========================================================
   TRAILER
========================================================= */

function abrirTrailer(item) {

    const trailer =
        item.trailer ||
        item.videoTrailer;

    if (!trailer) {

        mostrarNotificacao(
            "Trailer não encontrado."
        );

        return;

    }

    const params =
        new URLSearchParams();

    params.set(
        "id",
        item.id
    );

    params.set(
        "colecao",
        item.colecao
    );

    params.set(
        "trailer",
        "true"
    );

    params.set(
        "video",
        trailer
    );

    if (item.titulo) {

        params.set(
            "title",
            item.titulo
        );

    }


    window.location.href =
        `player.html?${params.toString()}`;

}


/* =========================================================
   ANÚNCIO
========================================================= */

function iniciarFluxoAnuncio(
    tipo,
    item
) {

    filmeAtual =
        item;

    acaoAnuncioPendente =
        tipo;

    $("detalheModal")
        .classList
        .add("hidden");

    $("adModal")
        .classList
        .remove("hidden");


    let contador =
        5;

    const botao =
        $("btnConfirmarAd");

    botao.disabled =
        true;

    botao.style.opacity =
        "0.5";

    botao.innerText =
        `Aguarde ${contador}s...`;


    if (adTimer)
        clearInterval(adTimer);


    adTimer =
        setInterval(
            () => {

                contador--;

                if (contador > 0) {

                    botao.innerText =
                        `Aguarde ${contador}s...`;

                }
                else {

                    clearInterval(
                        adTimer
                    );

                    adTimer =
                        null;

                    botao.disabled =
                        false;

                    botao.style.opacity =
                        "1";

                    botao.innerText =
                        tipo === "assistir"
                            ? "Assistir agora"
                            : "Iniciar download";

                }

            },
            1000
        );

}


/* =========================================================
   CONFIRMAR ANÚNCIO
========================================================= */

$("btnConfirmarAd")
    ?.addEventListener(
        "click",
        () => {

            if (!filmeAtual)
                return;

            const item =
                filmeAtual;

            const acao =
                acaoAnuncioPendente;

            fecharModais();


            if (
                acao === "assistir"
            ) {

                irParaPlayer(
                    item
                );

            }

            else if (
                acao === "baixar"
            ) {

                executarDownload(
                    item
                );

            }

        }
    );


/* =========================================================
   DOWNLOAD
========================================================= */

function executarDownload(item) {

    const url =
        item?.arquivoDownload ||
        "";

    if (!url) {

        mostrarNotificacao(
            "Link de download não disponível."
        );

        return;

    }


    /*
       Navegação direta evita bloqueio
       de pop-up pelo navegador/adblock.
    */

    window.location.href =
        url;

}


/* =========================================================
   INFINITEPAY
========================================================= */

async function solicitarPix(
    item,
    tag,
    valor
) {

    if (!auth.currentUser) {

        fecharModais();

        $("loginModal")
            .classList
            .remove("hidden");

        $("erroAuth").innerText =
            `Faça login para comprar o acesso ${tag.toUpperCase()}.`;

        return;

    }


    if (
        !Number.isFinite(
            Number(valor)
        ) ||
        Number(valor) <= 0
    ) {

        mostrarNotificacao(
            "Valor inválido."
        );

        return;

    }


    try {

        mostrarNotificacao(
            "Gerando pagamento..."
        );


        const payload = {

            uid:
                auth.currentUser.uid,

            email:
                auth.currentUser.email || "",

            itemId:
                item.id,

            colecao:
                item.colecao,

            tag:
                tag,

            valor:
                Number(valor)

        };


        const resposta =
            await fetch(
                "/criar-compra-pix",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            payload
                        )

                }
            );


        const texto =
            await resposta.text();

        let dados;

        try {

            dados =
                JSON.parse(texto);

        }

        catch {

            dados = {
                success: false,
                error:
                    texto ||
                    "Resposta inválida."
            };

        }


        if (!resposta.ok) {

            mostrarNotificacao(
                dados.error ||
                `Erro HTTP ${resposta.status}`
            );

            return;

        }


        if (
            dados.success &&
            dados.checkout_url
        ) {

            window.location.href =
                dados.checkout_url;

            return;

        }


        mostrarNotificacao(
            dados.error ||
            "Não foi possível criar o checkout."
        );

    }

    catch (erro) {

        console.error(
            "Erro InfinitePay:",
            erro
        );

        mostrarNotificacao(
            "Falha na conexão com o pagamento."
        );

    }

}

========================================================= */

/* =========================================================

========================================================= */

$("alternarCadastro")

/* =========================================================
   ESQUECI SENHA
========================================================= */

$("btnEsqueciSenha")
    ?.addEventListener(
        "click",
        async () => {

            const email =
                $("email")
                    .value
                    .trim();

            if (!email) {

                $("erroAuth")
                    .innerText =
                    "Informe seu e-mail.";

                return;

            }


            try {

                await sendPasswordResetEmail(
                    auth,
                    email
                );

                mostrarNotificacao(
                    "E-mail de redefinição enviado."
                );

                $("erroAuth")
                    .innerText =
                    "";

            }

            catch (erro) {

                console.error(
                    erro
                );

                $("erroAuth")
                    .innerText =
                    "Não foi possível enviar o e-mail.";

            }

        }
    );


/* =========================================================
   LOGIN
========================================================= */

$("doLogin")
    ?.addEventListener(
        "click",
        async () => {

            const email =
                $("email")
                    .value
                    .trim();

            const senha =
                $("password")
                    .value;

            const erro =
                $("erroAuth");

            erro.innerText =
                "";


            if (!email || !senha) {

                erro.innerText =
                    "Preencha todos os campos.";

                return;

            }


            try {

                if (modoCadastro) {

                    const cred =
                        await createUserWithEmailAndPassword(
                            auth,
                            email,
                            senha
                        );


                    await setDoc(

                        doc(
                            db,
                            "usuarios",
                            cred.user.uid
                        ),

                        {

                            email:
                                email,

                            admin:
                                false,

                            criadoEm:
                                serverTimestamp()

                        }

                    );

                }

                else {

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        senha
                    );

                }


                fecharModais();

                mostrarNotificacao(
                    modoCadastro
                        ? "Conta criada com sucesso!"
                        : "Login realizado!"
                );

            }

            catch (erroFirebase) {

                console.error(
                    erroFirebase
                );

                switch (
                    erroFirebase.code
                ) {

                    case "auth/invalid-credential":
                    case "auth/wrong-password":
                    case "auth/user-not-found":

                        erro.innerText =
                            "E-mail ou senha incorretos.";

                        break;

                    case "auth/email-already-in-use":

                        erro.innerText =
                            "Este e-mail já está cadastrado.";

                        break;

                    case "auth/weak-password":

                        erro.innerText =
                            "A senha deve possuir pelo menos 6 caracteres.";

                        break;

                    case "auth/invalid-email":

                        erro.innerText =
                            "E-mail inválido.";

                        break;

                    default:

                        erro.innerText =
                            "Falha na autenticação.";

                    }

            }

        }
    );


/* =========================================================
   BOTÃO ENTRAR / SAIR
========================================================= */

$("authBtn")
    ?.addEventListener(
        "click",
        async () => {

            if (auth.currentUser) {

                await signOut(
                    auth
                );

                mostrarNotificacao(
                    "Sessão encerrada."
                );

                return;

            }


            $("loginModal")
                .classList
                .remove("hidden");

        }
    );


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
    auth,
    user => {

        const botao =
            $("authBtn");

        if (!botao)
            return;


        if (user) {

            const nome =
                user.email
                    ? user.email
                        .split("@")[0]
                    : "Usuário";

            botao.innerText =
                `Sair (${nome})`;

        }

        else {

            botao.innerText =
                "Entrar";

        }

    }
);


/* =========================================================
   NOTIFICAÇÃO
========================================================= */

function mostrarNotificacao(
    mensagem
) {

    const box =
        $("notification");

    const texto =
        $("notificationText");

    if (!box || !texto)
        return;

    texto.innerText =
        mensagem;

    box.classList
        .remove("hidden");


    setTimeout(
        () => {

            box.classList
                .add("hidden");

        },
        3500
    );

}


/* =========================================================
   FECHAR MODAL CLICANDO FORA
========================================================= */

document
    .querySelectorAll(
        ".modal"
    )
    .forEach(
        modal => {

            modal.addEventListener(
                "click",
                evento => {

                    if (
                        evento.target ===
                        modal
                    ) {

                        fecharModais();

                    }

                }
            );

        }
    );

   ESC
========================================================= */

document.addEventListener(
    "keydown",
    evento => {

        if (
            evento.key === "Escape"
        ) {

            fecharModais();

        }

    }
);
