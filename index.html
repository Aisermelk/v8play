```html
<!-- =========================================================
     CORREÇÃO DO BOTÃO "ASSISTIR VÍDEO AGORA"
     Substitua o bloco antigo do btnConfirmarAd por este.
========================================================= -->

<script type="module">

    // =========================================================
    // BOTÃO CONFIRMAR ANÚNCIO
    // =========================================================

    document
        .getElementById("btnConfirmarAd")
        .onclick = () => {

            console.log("=================================");
            console.log("🎬 BOTÃO DO ANÚNCIO CLICADO");
            console.log("=================================");

            // -------------------------------------------------
            // VERIFICAÇÃO DO ITEM
            // -------------------------------------------------

            if (!filmeAtual) {

                console.error(
                    "❌ filmeAtual está vazio."
                );

                mostrarNotificacao(
                    "Não foi possível identificar o conteúdo."
                );

                return;
            }


            // -------------------------------------------------
            // VERIFICAÇÃO DA AÇÃO
            // -------------------------------------------------

            const acao =
                acaoAnuncioPendente;


            console.log(
                "🎯 Ação:",
                acao
            );


            console.log(
                "🎬 Filme:",
                filmeAtual
            );


            console.log(
                "🆔 ID:",
                filmeAtual.id
            );


            console.log(
                "📁 Coleção:",
                filmeAtual.colecao
            );


            // =================================================
            // ASSISTIR
            // =================================================

            if (
                acao === "assistir"
            ) {

                // ---------------------------------------------
                // VERIFICAR ID
                // ---------------------------------------------

                if (
                    !filmeAtual.id
                ) {

                    console.error(
                        "❌ O conteúdo não possui ID."
                    );

                    mostrarNotificacao(
                        "ID do conteúdo não encontrado."
                    );

                    return;

                }


                // ---------------------------------------------
                // VERIFICAR COLEÇÃO
                // ---------------------------------------------

                if (
                    !filmeAtual.colecao
                ) {

                    console.error(
                        "❌ O conteúdo não possui coleção."
                    );

                    mostrarNotificacao(
                        "Coleção do conteúdo não encontrada."
                    );

                    return;

                }


                // ---------------------------------------------
                // CONSTRUIR URL
                // ---------------------------------------------

                const urlPlayer =
                    `player.html?id=${encodeURIComponent(filmeAtual.id)}&colecao=${encodeURIComponent(filmeAtual.colecao)}`;


                console.log(
                    "🚀 REDIRECIONANDO PARA:",
                    urlPlayer
                );


                // ---------------------------------------------
                // FECHAR POPUPS
                // ---------------------------------------------

                document
                    .querySelectorAll(".modal")
                    .forEach(
                        modal => {
                            modal.classList.add("hidden");
                        }
                    );


                // ---------------------------------------------
                // PEQUENO ATRASO
                // Garante que o popup seja fechado antes
                // da navegação.
                // ---------------------------------------------

                setTimeout(
                    () => {

                        console.log(
                            "▶️ Abrindo player..."
                        );

                        window.location.href =
                            urlPlayer;

                    },
                    100
                );


                return;

            }


            // =================================================
            // DOWNLOAD
            // =================================================

            if (
                acao === "baixar"
            ) {

                document
                    .querySelectorAll(".modal")
                    .forEach(
                        modal => {
                            modal.classList.add("hidden");
                        }
                    );


                executarDownload(
                    filmeAtual
                );


                return;

            }


            // =================================================
            // AÇÃO DESCONHECIDA
            // =================================================

            console.error(
                "❌ Ação desconhecida:",
                acao
            );

            mostrarNotificacao(
                "Não foi possível executar esta ação."
            );

        };

</script>
