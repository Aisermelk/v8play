<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V8 Play+ - Catálogo de Filmes e Séries</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        :root {
            --primary: #00d4ff;
            --primary-hover: #00a2c7;
            --bg-dark: #0a0a0b;
            --bg-card: #16161a;
            --bg-modal: #121214;
            --text: #ffffff;
            --text-secondary: #aaaaaa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-dark); color: var(--text); font-family: 'Poppins', sans-serif; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; }

        /* HEADER */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(10,10,11,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255,255,255,0.05); position: sticky; top: 0; z-index: 1000; }
        .logo { display: flex; align-items: center; text-decoration: none; font-size: 1.4rem; font-weight: 800; color: white; gap: 10px; }
        .logo span { color: var(--primary); }
        .logo-img { height: 38px; width: auto; object-fit: contain; }

        .user-area { display: flex; align-items: center; gap: 15px; }
        .btn-auth { background: var(--primary); color: #000; border: none; padding: 8px 18px; border-radius: 20px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        .btn-auth:hover { background: var(--primary-hover); transform: translateY(-1px); }

        /* HERO / SEARCH */
        .hero { padding: 40px 5% 20px; text-align: center; }
        .hero h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 10px; }
        .hero p { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 25px; }
        
        .search-box { max-width: 600px; margin: 0 auto; position: relative; }
        .search-box input { width: 100%; padding: 14px 20px 14px 50px; background: var(--bg-card); border: 1px solid rgba(255,255,255,0.08); border-radius: 30px; color: white; font-size: 0.95rem; outline: none; transition: 0.2s; }
        .search-box input:focus { border-color: var(--primary); }
        .search-box i { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }

        /* CATALOGO */
        .container { flex: 1; padding: 20px 5% 50px; max-width: 1400px; margin: 0 auto; width: 100%; }
        .section-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .section-title i { color: var(--primary); }

        .grid-catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: var(--bg-card); border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: transform 0.2s, border-color 0.2s; position: relative; }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .card img { width: 100%; height: 280px; object-fit: cover; }
        .card-info { padding: 12px; }
        .card-info h3 { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .card-info p { font-size: 0.8rem; color: var(--text-secondary); }

        /* MODAL */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .modal:not(.hidden) { opacity: 1; pointer-events: auto; }
        .modal-content { background: var(--bg-modal); width: 100%; max-width: 700px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.8); position: relative; max-height: 90vh; display: flex; flex-direction: column; }
        
        .modal-header { position: relative; height: 250px; width: 100%; }
        .modal-header img { width: 100%; height: 100%; object-fit: cover; }
        .modal-header::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 100px; background: linear-gradient(to top, var(--bg-modal), transparent); }
        .btn-fechar-modal { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); color: white; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; transition: 0.2s; }
        .btn-fechar-modal:hover { background: rgba(255,255,255,0.2); }

        .modal-body { padding: 20px; overflow-y: auto; }
        .modal-body h2 { font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; }
        .modal-meta { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 15px; display: flex; gap: 10px; }
        .modal-body p { color: #ccc; font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px; }

        .modal-actions { display: flex; gap: 12px; flex-wrap: wrap; }
        .btn-acao { padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; border: none; text-decoration: none; transition: 0.2s; }
        .btn-assistir { background: var(--primary); color: #000; }
        .btn-assistir:hover { background: var(--primary-hover); }
        .btn-trailer { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.1); }
        .btn-trailer:hover { background: rgba(255,255,255,0.2); }
        .btn-comprar { background: #ffaa00; color: #000; }
        .btn-comprar:hover { background: #e09600; }

        /* NOTIFICAÇÃO TOAST */
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #222; color: white; padding: 12px 24px; border-radius: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; z-index: 9999; transition: transform 0.3s ease; }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo"><img src="assets/v8p.png" alt="V8 Play+" class="logo-img" onerror="this.style.display='none'"> <span>V8 Play+</span></a>
        <div class="user-area" id="userArea">
            <button class="btn-auth" id="btnLogin">Entrar / Cadastrar</button>
        </div>
    </header>

    <div class="hero">
        <h1>Filmes, Séries e Conteúdos Exclusivos</h1>
        <p>Explore o melhor do entretenimento digital em alta qualidade.</p>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Pesquisar título...">
        </div>
    </div>

    <div class="container">
        <div class="section-title"><i class="fa-solid fa-fire"></i> Catálogo Recente</div>
        <div class="grid-catalogo" id="gridCatalogo">
            <p style="color: var(--text-secondary);">Carregando conteúdos...</p>
        </div>
    </div>

    <!-- MODAL DE DETALHES -->
    <div class="modal hidden" id="detalhesModal">
        <div class="modal-content">
            <button class="btn-fechar-modal" id="fecharDetalhes"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-header">
                <img id="modalCapa" src="" alt="Capa">
            </div>
            <div class="modal-body">
                <h2 id="modalTitulo">Título</h2>
                <div class="modal-meta">
                    <span id="modalAno">2026</span> • <span id="modalCategoria">Geral</span>
                </div>
                <p id="modalDescricao">Descrição do item...</p>
                <div class="modal-actions" id="modalAcoes">
                    <!-- Botões injetados via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE LOGIN (SIMPLES) -->
    <div class="modal hidden" id="loginModal">
        <div class="modal-content" style="max-width: 400px; padding: 25px;">
            <button class="btn-fechar-modal" id="fecharLogin"><i class="fa-solid fa-xmark"></i></button>
            <h2 style="margin-bottom: 15px; font-size: 1.3rem;">Identificação</h2>
            <p style="margin-bottom: 20px; font-size: 0.9rem;">Para continuar, por favor faça login na sua conta V8 Play+.</p>
            <button class="btn-acao btn-assistir" style="width: 100%; justify-content: center;" id="btnLoginGoogle">
                <i class="fa-brands fa-google"></i> Entrar com Google
            </button>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast">Notificação</div>

    <!-- SCRIPT PRINCIPAL -->
    <script type="module">
        import { db, auth } from "./js/firebase.js";
        import { collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        let listaMidias = [];
        let filmeAtual = null;
        const titulosComprados = new Set(); // Controle local de compras liberadas

        function mostrarNotificacao(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // AUTH GESTÃO
        const provider = new GoogleAuthProvider();
        document.getElementById('btnLogin').onclick = () => {
            if (auth.currentUser) {
                signOut(auth).then(() => mostrarNotificacao("Você saiu da conta."));
            } else {
                document.getElementById('loginModal').classList.remove('hidden');
            }
        };

        document.getElementById('btnLoginGoogle').onclick = async () => {
            try {
                await signInWithPopup(auth, provider);
                document.getElementById('loginModal').classList.add('hidden');
                mostrarNotificacao("Login realizado com sucesso!");
            } catch (e) {
                console.error(e);
                mostrarNotificacao("Erro ao fazer login com Google.");
            }
        };

        document.getElementById('fecharLogin').onclick = () => document.getElementById('loginModal').classList.add('hidden');

        onAuthStateChanged(auth, (user) => {
            const userArea = document.getElementById('userArea');
            if (user) {
                userArea.innerHTML = `
                    <span style="font-size: 0.85rem; color: var(--text-secondary); display: none; @media(min-width: 600px){display:inline;}">Olá, ${user.displayName?.split(' ')[0]}</span>
                    <button class="btn-auth" id="btnLogout" style="background: rgba(255,255,255,0.1); color: white;">Sair</button>
                `;
                document.getElementById('btnLogout').onclick = () => signOut(auth);
            } else {
                userArea.innerHTML = `<button class="btn-auth" id="btnLogin">Entrar / Cadastrar</button>`;
                document.getElementById('btnLogin').onclick = () => document.getElementById('loginModal').classList.remove('hidden');
            }
        });

        // CARREGAR CATÁLOGO DO FIRESTORE
        async function carregarCatalogo() {
            const grid = document.getElementById('gridCatalogo');
            try {
                listaMidias = [];
                // Buscando das coleções comuns 'filmes' e 'series'
                const cols = ['filmes', 'series', 'catalogo'];
                for (const colName of cols) {
                    try {
                        const snap = await getDocs(collection(db, colName));
                        snap.forEach(docSnap => {
                            listaMidias.push({ id: docSnap.id, colecao: colName, ...docSnap.data() });
                        });
                    } catch (err) {
                        // Coleção pode não existir, ignora
                    }
                }

                if (listaMidias.length === 0) {
                    grid.innerHTML = `<p style="color: var(--text-secondary);">Nenhum conteúdo cadastrado no momento.</p>`;
                    return;
                }

                renderizarGrid(listaMidias);
            } catch (e) {
                console.error("Erro ao carregar catálogo:", e);
                grid.innerHTML = `<p style="color: #ff6b6b;">Erro ao carregar os itens do catálogo.</p>`;
            }
        }

        function renderizarGrid(itens) {
            const grid = document.getElementById('gridCatalogo');
            grid.innerHTML = "";
            itens.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${item.capa || 'assets/placeholder.jpg'}" alt="${item.titulo}" onerror="this.src='https://via.placeholder.com/200x280/16161a/ffffff?text=V8+Play+'">
                    <div class="card-info">
                        <h3>${item.titulo || 'Sem Título'}</h3>
                        <p>${item.ano || '2026'} • ${item.tipo || item.categoria || 'Filme'}</p>
                    </div>
                `;
                card.onclick = () => abrirDetalhes(item);
                grid.appendChild(card);
            });
        }

        // PESQUISA
        document.getElementById('searchInput').oninput = (e) => {
            const termo = e.target.value.toLowerCase();
            const filtrados = listaMidias.filter(m => (m.titulo || '').toLowerCase().includes(termo));
            renderizarGrid(filtrados);
        };

        // MODAL DE DETALHES
        function abrirDetalhes(item) {
            filmeAtual = item;
            document.getElementById('modalCapa').src = item.capa || '';
            document.getElementById('modalTitulo').innerText = item.titulo || 'Título';
            document.getElementById('modalAno').innerText = item.ano || '2026';
            document.getElementById('modalCategoria').innerText = item.categoria || item.tipo || 'Geral';
            document.getElementById('modalDescricao').innerText = item.descricao || 'Sem descrição disponível para este item.';

            const acoes = document.getElementById('modalAcoes');
            acoes.innerHTML = "";

            const tag = (item.tag || item.tipoAcesso || 'gratuito').toLowerCase();
            const preco = item.preco || 1.00;

            // Botão de Trailer (Sempre disponível se houver link)
            if (item.trailer) {
                const btnTrailer = document.createElement('button');
                btnTrailer.className = 'btn-acao btn-trailer';
                btnTrailer.innerHTML = `<i class="fa-solid fa-film"></i> Trailer`;
                btnTrailer.onclick = () => window.location.href = `player.html?id=${item.id}&colecao=${item.colecao}&trailer=true`;
                acoes.appendChild(btnTrailer);
            }

            // Verificação de Acesso / Pagamento
            if (tag === 'gratuito' || titulosComprados.has(item.id)) {
                const btnAssistir = document.createElement('button');
                btnAssistir.className = 'btn-acao btn-assistir';
                btnAssistir.innerHTML = `<i class="fa-solid fa-play"></i> Assistir Agora`;
                btnAssistir.onclick = () => window.location.href = `player.html?id=${item.id}&colecao=${item.colecao}`;
                acoes.appendChild(btnAssistir);
            } else {
                const btnComprar = document.createElement('button');
                btnComprar.className = 'btn-acao btn-comprar';
                btnComprar.innerHTML = `<i class="fa-solid fa-lock"></i> Liberar Tag ${tag.toUpperCase()} (R$ ${Number(preco).toFixed(2)})`;
                btnComprar.onclick = () => solicitarPix(item, tag, preco);
                acoes.appendChild(btnComprar);
            }

            document.getElementById('detalhesModal').classList.remove('hidden');
        }

        // REDIRECIONAMENTO PARA O CHECKOUT DA INFINITEPAY
        function solicitarPix(item, tag, valor) {
            if (!auth.currentUser) {
                mostrarNotificacao(`Faça login para adquirir o acesso ${tag.toUpperCase()}.`);
                document.getElementById('detalhesModal').classList.add('hidden');
                document.getElementById('loginModal').classList.remove('hidden');
                return;
            }

            mostrarNotificacao("Redirecionando para o pagamento seguro...");
            
            // Redireciona para o seu checkout oficial da InfinitePay
            setTimeout(() => {
                window.location.href = "https://checkout.infinitepay.io/aisermelquisedec/41LiGTWFBb";
            }, 800);
        }

        document.getElementById('fecharDetalhes').onclick = () => document.getElementById('detalhesModal').classList.add('hidden');
        window.onclick = (e) => {
            if (e.target.classList.contains('modal')) {
                e.target.classList.add('hidden');
            }
        };

        // Inicializar
        carregarCatalogo();
    </script>
</body>
</html>
