<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V8 Play+</title>
    <!-- Tailwind CSS para estilização moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0f1016] text-white min-h-screen font-sans">

    <!-- Header / Barra Superior -->
    <header class="flex items-center justify-between px-6 py-4 bg-[#14151f] border-b border-gray-800 sticky top-0 z-50 shadow-md">
        <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-2">
                <span class="bg-gradient-to-r from-red-600 to-orange-500 text-white font-extrabold px-3 py-1 rounded-lg text-lg tracking-wider shadow-lg">V8+</span>
                <span class="text-xl font-bold tracking-wide">V8 Play+</span>
            </div>
        </div>
        
        <div class="flex-1 max-w-xl mx-8 hidden md:block">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="searchInput" placeholder="Buscar filmes, séries, animes e doramas..." class="w-full bg-[#1e2029] text-sm text-white pl-10 pr-4 py-2.5 rounded-full focus:outline-none focus:ring-2 focus:ring-red-600 border border-transparent">
            </div>
        </div>

        <div class="flex items-center gap-4">
            <!-- Botão do Painel Admin (aparece apenas se logado como admin) -->
            <a href="admin.html" id="adminLink" class="hidden bg-gray-800 hover:bg-gray-700 text-cyan-400 text-xs font-bold px-3 py-2 rounded-lg transition-all border border-cyan-500/30">
                <i class="fa-solid fa-user-shield"></i> Painel Admin
            </a>
            <button onclick="logout()" class="bg-cyan-500 hover:bg-cyan-600 text-black font-bold px-5 py-2 rounded-full text-sm transition-all shadow-md">
                Sair
            </button>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-6 py-8">
        
        <!-- Seção de Destaque / Hero -->
        <section class="mb-10">
            <h2 class="text-xl font-bold mb-4 text-gray-200 flex items-center gap-2">
                <i class="fa-solid fa-star text-amber-400"></i> Em Alta
            </h2>
            <div id="heroContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                <p class="text-gray-500 text-sm">Carregando destaques...</p>
            </div>
        </section>

        <!-- Seção de Catálogo Completo -->
        <section>
            <h2 class="text-xl font-bold mb-4 text-gray-200 flex items-center gap-2">
                <i class="fa-solid fa-film text-red-500"></i> Catálogo Completo
            </h2>
            
            <!-- Grid de Conteúdos -->
            <div id="moviesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                <p class="text-gray-500 text-sm col-span-full text-center py-10">Carregando catálogo...</p>
            </div>
        </section>

    </main>

    <!-- Firebase e Lógica da Página -->
    <script type="module">
        import { db, auth } from "./firebase.js";
        import { collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const COLECOES = ["filmes", "series", "animes", "doramas"];

        // Verificar permissão de admin para exibir o link do painel no header
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userDoc = await getDoc(doc(db, "usuarios", user.uid));
                    if (userDoc.exists() && userDoc.data().admin) {
                        document.getElementById('adminLink').classList.remove('hidden');
                    }
                } catch (e) {
                    console.error("Erro ao verificar status de admin:", e);
                }
            }
        });

        // Buscar e renderizar conteúdos do Firestore
        async function carregarCatalogo() {
            let todosItens = [];
            const heroContainer = document.getElementById('heroContainer');
            const moviesGrid = document.getElementById('moviesGrid');

            for (const col of COLECOES) {
                try {
                    const snap = await getDocs(collection(db, col));
                    snap.forEach(d => {
                        todosItens.push({ id: d.id, colecao: col, ...d.data() });
                    });
                } catch (e) {
                    console.error("Erro ao buscar coleção " + col + ":", e);
                }
            }

            if (todosItens.length === 0) {
                heroContainer.innerHTML = '<p class="text-gray-500 text-sm">Nenhum destaque disponível.</p>';
                moviesGrid.innerHTML = '<p class="text-gray-500 text-sm col-span-full text-center py-10">Nenhum conteúdo cadastrado no painel.</p>';
                return;
            }

            // Filtrar itens marcados como destaque para o Hero
            const destaques = todosItens.filter(item => item.destaque);
            if (destaques.length > 0) {
                heroContainer.innerHTML = "";
                destaques.forEach(item => {
                    const tag = (item.tag || item.plano || "gratis").toLowerCase();
                    heroContainer.innerHTML += criarCardHTML(item, tag);
                });
            } else {
                heroContainer.innerHTML = '<p class="text-gray-500 text-sm">Nenhum item marcado como destaque.</p>';
            }

            // Renderizar todos os itens no grid do catálogo
            moviesGrid.innerHTML = "";
            todosItens.forEach(item => {
                const tag = (item.tag || item.plano || "gratis").toLowerCase();
                moviesGrid.innerHTML += criarCardHTML(item, tag);
            });

            // Ativar busca interativa
            setupPesquisa(todosItens);
        }

        function criarCardHTML(item, tag) {
            const tagClass = tag === 'gratis' ? 'bg-cyan-500 text-black' : 'bg-amber-500 text-black';
            const tagTexto = tag === 'gratis' ? 'Grátis' : tag.toUpperCase();
            const capaImg = item.capa || 'https://via.placeholder.com/300x450?text=Sem+Capa';

            return `
                <a href="player.html?v=${item.id}" class="group block relative rounded-xl overflow-hidden shadow-lg transition-transform duration-300 hover:scale-105 bg-[#16161a] border border-gray-800">
                    <div class="relative aspect-[2/3] overflow-hidden bg-gray-800">
                        <img src="${capaImg}" alt="${item.titulo || 'Capa'}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.src='https://via.placeholder.com/300x450?text=Erro+Imagem'">
                        <span class="absolute top-3 right-3 ${tagClass} font-bold text-xs px-2.5 py-1 rounded-md shadow-md uppercase">${tagTexto}</span>
                    </div>
                    <div class="p-3">
                        <h3 class="font-semibold text-sm truncate text-white">${item.titulo || 'Sem Título'}</h3>
                        <p class="text-xs text-gray-400 mt-1 uppercase">${item.categoria || item.colecao} • ${item.ano || ''}</p>
                    </div>
                </a>
            `;
        }

        function setupPesquisa(todosItens) {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const termo = e.target.value.toLowerCase().trim();
                const moviesGrid = document.getElementById('moviesGrid');

                const filtrados = todosItens.filter(item => 
                    (item.titulo && item.titulo.toLowerCase().includes(termo)) ||
                    (item.categoria && item.categoria.toLowerCase().includes(termo)) ||
                    (item.colecao && item.colecao.toLowerCase().includes(termo))
                );

                if (filtrados.length === 0) {
                    moviesGrid.innerHTML = `<p class="text-gray-500 text-sm col-span-full text-center py-10">Nenhum resultado encontrado para "${termo}".</p>`;
                    return;
                }

                moviesGrid.innerHTML = "";
                filtrados.forEach(item => {
                    const tag = (item.tag || item.plano || "gratis").toLowerCase();
                    moviesGrid.innerHTML += criarCardHTML(item, tag);
                });
            });
        }

        window.logout = function() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        window.addEventListener('DOMContentLoaded', carregarCatalogo);
    </script>
</body>
</html>
