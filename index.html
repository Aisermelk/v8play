<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V8 Play+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
:root{--primary:#00d4ff;--primary-hover:#00a2c7;--bg-dark:#0a0a0b;--bg-card:#16161a;--bg-modal:#121214;--text:#fff;--text-secondary:#aaa;--border:#2a2a30;--danger:#ff5c5c}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{background:var(--bg-dark);color:var(--text);font-family:Poppins,sans-serif;overflow-x:hidden;min-height:100vh}button,input{font-family:inherit}button{-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px 5%;position:fixed;top:0;left:0;width:100%;z-index:1000;background:linear-gradient(to bottom,rgba(10,10,11,.98),rgba(10,10,11,.85),rgba(10,10,11,0));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-size:1.5rem;font-weight:800;color:#fff;white-space:nowrap;min-width:max-content}.logo span{color:var(--primary)}.logo-img{height:42px;width:auto;max-width:150px;object-fit:contain}
.search-box{flex:1;width:100%;max-width:360px;position:relative}#busca{width:100%;padding:10px 16px 10px 40px;border-radius:20px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:#fff;outline:none;transition:.3s;font-size:.9rem}#busca::placeholder{color:#888}#busca:focus{border-color:var(--primary);background:rgba(0,0,0,.45);box-shadow:0 0 12px rgba(0,212,255,.18)}.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-secondary);font-size:.85rem;pointer-events:none}
.btn-login{background:var(--primary);color:#000;border:none;padding:9px 22px;border-radius:20px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.2s;font-size:.9rem}.btn-login:hover{background:var(--primary-hover);transform:translateY(-1px)}
.promo-space{width:100%;display:flex;justify-content:center;align-items:center;padding:10px 5%;margin-top:72px}.promo-placeholder,.promo-mid-box{width:100%;max-width:970px;background:#151519;border:1px dashed #333;border-radius:8px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#666;font-size:.78rem}.promo-placeholder{height:90px}.promo-placeholder small,.promo-mid-box small{margin-top:4px;color:#4f4f54}.promo-mid{width:100%;display:flex;justify-content:center;padding:20px 0}.promo-mid-box{height:120px;font-size:.8rem}
#hero{height:70vh;min-height:500px;position:relative;display:flex;align-items:flex-end;padding:0 5% 50px;background-size:cover;background-position:center;background-repeat:no-repeat;background-color:#111;transition:background-image .5s ease-in-out}#hero:before{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg-dark) 4%,transparent 62%),linear-gradient(to right,rgba(10,10,11,.92),rgba(10,10,11,.35),transparent 75%)}#hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.25),transparent 35%);pointer-events:none}.hero-content{position:relative;z-index:2;max-width:650px}.hero-content h1{font-size:2.8rem;font-weight:800;margin-bottom:12px;line-height:1.1}.hero-content p{color:#ddd;margin-bottom:22px;line-height:1.6;font-size:.95rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.hero-btns{display:flex;gap:10px;flex-wrap:wrap}.hero-btns button{padding:12px 25px;border-radius:6px;border:none;font-weight:600;cursor:pointer;transition:.2s;font-size:.95rem}.btn-assistir{background:#fff;color:#000}.btn-assistir:hover{background:#e4e4e4;transform:translateY(-2px)}.btn-info{background:rgba(255,255,255,.15);color:#fff;backdrop-filter:blur(5px);border:1px solid rgba(255,255,255,.12);padding:10px 20px;border-radius:6px;cursor:pointer;transition:.2s}.btn-info:hover{background:rgba(255,255,255,.25);transform:translateY(-2px)}
.container{padding:30px 5%;width:100%}.filtros{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;margin-bottom:15px;scrollbar-width:none}.filtros::-webkit-scrollbar{display:none}.chip{padding:8px 18px;border-radius:20px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text-secondary);cursor:pointer;font-size:.85rem;white-space:nowrap;transition:.2s}.chip:hover{border-color:var(--primary);color:#fff}.chip.ativo{background:var(--primary);color:#000;border-color:var(--primary);font-weight:600}.section-title{font-size:1.3rem;margin:25px 0 12px;display:flex;align-items:center;gap:8px;font-weight:600}.cards{display:flex;gap:16px;overflow-x:auto;padding:10px 0 25px;scrollbar-width:thin;scrollbar-color:#333 transparent}.cards::-webkit-scrollbar{height:6px}.cards::-webkit-scrollbar-track{background:transparent}.cards::-webkit-scrollbar-thumb{background:#333;border-radius:10px}.movie-card{min-width:165px;width:165px;height:245px;background:var(--bg-card);border-radius:10px;cursor:pointer;transition:transform .25s,box-shadow .25s,border-color .25s;flex-shrink:0;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.05)}.movie-card:hover{transform:translateY(-6px);box-shadow:0 8px 25px rgba(0,212,255,.22);border-color:var(--primary)}.movie-card img{width:100%;height:100%;display:block;object-fit:cover}.titulo-fallback{padding:15px;font-size:.9rem;text-align:center;height:100%;display:flex;align-items:center;justify-content:center;background:#1a1a20}.selo-card{position:absolute;top:10px;right:10px;padding:4px 8px;border-radius:4px;font-size:.62rem;font-weight:700;z-index:2;box-shadow:0 2px 5px rgba(0,0,0,.5);text-transform:uppercase}.selo-card.gratis,.selo-card.free{background:rgba(0,0,0,.75);color:var(--primary);border:1px solid var(--primary)}.selo-card.prime{background:linear-gradient(135deg,#ffaa00,#ff5500);color:#000}.selo-card.premium{background:linear-gradient(135deg,#00d4ff,#0072ff);color:#000}.vazio{color:var(--text-secondary);font-size:.9rem;padding:20px 0}
.modal{position:fixed;inset:0;width:100%;height:100%;z-index:3000;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.88);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);padding:20px;overflow-y:auto}.hidden{display:none!important}.login-box,.waiting-box{background:var(--bg-modal);padding:35px;border-radius:12px;width:100%;max-width:400px;text-align:center;border:1px solid #222;box-shadow:0 20px 60px rgba(0,0,0,.55)}.waiting-box{max-width:450px}.login-box h2,.waiting-box h2{margin-bottom:15px}.login-box p,.waiting-box p{color:var(--text-secondary)}.login-box input{width:100%;padding:12px;margin-bottom:12px;background:#1c1c20;border:1px solid #333;color:#fff;border-radius:6px;outline:none}.login-box input:focus{border-color:var(--primary)}.btn-secundario{background:none;color:var(--text-secondary);border:none;margin-top:10px;cursor:pointer;font-size:.85rem;display:block;width:100%;text-align:center}.btn-secundario:hover{color:#fff;text-decoration:underline}.erro-msg{color:var(--danger)!important;font-size:.85rem;min-height:20px;margin-bottom:8px}.detalhe-box{background:var(--bg-modal);border-radius:12px;max-width:650px;width:100%;overflow:hidden;border:1px solid #222;position:relative;box-shadow:0 20px 70px rgba(0,0,0,.65)}.detalhe-box img{width:100%;max-height:300px;display:block;object-fit:cover}.detalhe-info{padding:25px}.detalhe-info h2{margin-bottom:6px;font-size:1.6rem}.detalhe-meta{color:var(--text-secondary);font-size:.85rem;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap}.detalhe-info p{color:#ccc;line-height:1.6;margin-bottom:20px;font-size:.92rem}.detalhe-btns{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}.detalhe-btns button{padding:10px 20px;border-radius:6px;border:none;font-weight:600;cursor:pointer;transition:.2s;font-size:.9rem}.detalhe-btns button:hover{transform:translateY(-1px)}.btn-pix-prime{background:linear-gradient(135deg,#ffaa00,#ff5500);color:#000}.btn-pix-premium{background:linear-gradient(135deg,#00d4ff,#0072ff);color:#fff}.btn-gratis{background:linear-gradient(135deg,#00d4ff,#0072ff);color:#000}.checkout-info{color:#aaa;font-size:.82rem;margin-top:10px;line-height:1.5}.waiting-icon{width:55px;height:55px;margin:0 auto 15px;border-radius:50%;border:4px solid rgba(255,255,255,.1);border-top-color:var(--primary);animation:girar .8s linear infinite}@keyframes girar{to{transform:rotate(360deg)}}#notification{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#1f1f24;color:#fff;padding:12px 28px;border-radius:30px;z-index:5000;border:1px solid var(--primary);box-shadow:0 4px 15px rgba(0,0,0,.5);font-size:.9rem;text-align:center;max-width:90%}
@media(max-width:700px){header{padding:11px 4%;gap:8px}.logo{font-size:1.05rem}.logo-img{height:34px;max-width:100px}.search-box{max-width:none}#busca{padding:9px 10px 9px 34px;font-size:.8rem}.search-icon{left:11px}.btn-login{padding:8px 13px;font-size:.78rem}.promo-space{margin-top:65px;padding:8px 4%}.promo-placeholder{height:65px}#hero{height:65vh;min-height:430px;padding:0 5% 35px}.hero-content h1{font-size:2rem}.hero-content p{font-size:.85rem}.hero-btns button{padding:10px 17px;font-size:.85rem}.container{padding:20px 4%}.section-title{font-size:1.15rem}.movie-card{min-width:140px;width:140px;height:210px}.login-box{padding:25px}.detalhe-info{padding:20px}.detalhe-info h2{font-size:1.35rem}}@media(max-width:430px){.logo span{display:none}.logo-img{max-width:85px}.btn-login{padding:8px 11px}.hero-content h1{font-size:1.75rem}}
</style>
</head>
<body>
<header>
<a href="#" class="logo" aria-label="V8 Play+"><img src="assets/v8p.png" alt="V8 Play+" class="logo-img" onerror="this.style.display='none'"><span>V8 Play+</span></a>
<div class="search-box"><i class="fa-solid fa-magnifying-glass search-icon"></i><input type="text" id="busca" placeholder="Buscar filmes, séries e doramas..." autocomplete="off" spellcheck="false"></div>
<button class="btn-login" id="authBtn" type="button">Entrar</button>
</header>
<div class="promo-space"><div class="promo-placeholder"><span>ESPAÇO PROMOCIONAL</span><small>Conteúdo patrocinado</small></div></div>
<section id="hero"><div class="hero-content"><h1 id="heroTitle">Carregando...</h1><p id="heroDesc">Sua nova experiência em entretenimento em alta definição.</p><div class="hero-btns"><button class="btn-assistir" id="heroAssistir" type="button"><i class="fa-solid fa-play"></i> Ver Opções</button><button class="btn-info" id="heroInfo" type="button"><i class="fa-solid fa-circle-info"></i> Mais detalhes</button></div></div></section>
<div class="container">
<div class="filtros" id="filtros"><button class="chip ativo" data-genero="Todos" type="button">Todos</button></div>
<h2 class="section-title">🔥 Em Alta</h2><div class="cards" id="emAlta"></div>
<h2 class="section-title">🎬 Filmes</h2><div class="cards" id="filmes"></div>
<div class="promo-mid"><div class="promo-mid-box"><span>ESPAÇO PROMOCIONAL</span><small>V8 Play+</small></div></div>
<h2 class="section-title">📺 Séries</h2><div class="cards" id="series"></div>
<h2 class="section-title">🎌 Animes</h2><div class="cards" id="animes"></div>
<h2 class="section-title">🎭 Doramas</h2><div class="cards" id="doramas"></div>
<h2 class="section-title">⭐ Recomendados</h2><div class="cards" id="recomendados"></div>
</div>
<div id="loginModal" class="modal hidden"><div class="login-box"><h2 id="tituloAuth">Entrar no V8 Play+</h2><p class="erro-msg" id="erroAuth"></p><input type="email" id="email" placeholder="E-mail" autocomplete="username"><input type="password" id="password" placeholder="Senha" autocomplete="current-password"><button class="btn-login" id="doLogin" type="button" style="width:100%;border-radius:6px;padding:12px;margin-top:5px">Entrar</button><button class="btn-secundario" id="btnEsqueciSenha" type="button">Esqueci minha senha</button><button class="btn-secundario" id="alternarCadastro" type="button">Ainda não tem conta? Criar conta</button><button class="btn-secundario" id="btnCancelarLogin" type="button" style="margin-top:15px;color:#666">Cancelar</button></div></div>
<div id="detalheModal" class="modal hidden"><div class="detalhe-box"><img id="detImg" src="" alt=""><div class="detalhe-info"><h2 id="detTitulo"></h2><div class="detalhe-meta"><span id="detAno"></span><span>•</span><span id="detCategoria"></span></div><p id="detDescricao"></p><div class="detalhe-btns" id="detBtnsContainer"></div><div class="detalhe-btns" style="margin-top:15px"><button class="btn-info" id="btnFecharDetalhes" type="button" style="background:transparent;border:1px solid #333">Fechar</button></div></div></div></div>
<div id="actionModal" class="modal hidden"><div class="waiting-box"><div class="waiting-icon"></div><h2>Aguarde um momento</h2><p id="actionMessage">Preparando sua solicitação...</p><button id="btnConfirmarAcao" class="btn-login" type="button" disabled style="width:100%;margin-top:20px;border-radius:6px">Aguarde <span id="actionTimer">5</span>s...</button></div></div>
<div id="notification" class="hidden" role="status" aria-live="polite"><span id="notificationText"></span></div>
<script type="module">
import {db,auth} from "./js/firebase.js";
import {collection,getDocs,doc,getDoc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import {signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const COLECOES=["filmes","series","animes","doramas"];
let catalogo=[],filmeAtual=null,modoCadastro=false,acaoAnuncioPendente=null,adTimer=null,notificacaoTimer=null;
const titulosComprados=new Set();
let valoresPlanosAdmin={prime:9.90,premium:19.90};
const $=id=>document.getElementById(id);
const normalizar=v=>String(v??"").toLowerCase().trim();
function formatarPreco(valor){return `R$ ${(Number(valor)||0).toFixed(2).replace(".",",")}`}
function obterTagItem(item){return normalizar(item.tag||item.plano||"gratis")||"gratis"}

async function carregarPrecosAdmin(){try{const snap=await getDoc(doc(db,"configuracoes","planos"));if(!snap.exists())return;const d=snap.data();if(d.prime!==undefined)valoresPlanosAdmin.prime=Number(d.prime);if(d.premium!==undefined)valoresPlanosAdmin.premium=Number(d.premium)}catch(e){console.warn("Preços não carregados:",e)}}
async function buscarColecao(nome){try{const snap=await getDocs(collection(db,nome));const itens=[];snap.forEach(d=>{const dados=d.data();if(dados.ativo===false)return;itens.push({id:d.id,colecao:nome,...dados})});itens.sort((a,b)=>{const da=a.data?.toDate?a.data.toDate():new Date(a.data||0);const dbb=b.data?.toDate?b.data.toDate():new Date(b.data||0);return dbb-da});return itens}catch(e){console.error(`Erro na coleção ${nome}:`,e);return []}}

async function carregarCatalogo(){console.log("🎬 Carregando catálogo...");await carregarPrecosAdmin();["emAlta","filmes","series","animes","doramas","recomendados"].forEach(id=>{if($(id))$(id).innerHTML=""});const resultados=await Promise.all(COLECOES.map(buscarColecao));catalogo=resultados.flat();console.log(`🎥 ${catalogo.length} conteúdos encontrados`);if(!catalogo.length){$("filmes").innerHTML='<p class="vazio">Nenhum título disponível no momento.</p>';carregarDestaque();return}catalogo.filter(i=>i.destaque===true).forEach(i=>adicionarCard("emAlta",i));catalogo.forEach(item=>{const tipo=normalizar(item.tipo);if(tipo==="serie"||tipo==="series")adicionarCard("series",item);else if(tipo==="anime"||tipo==="animes")adicionarCard("animes",item);else if(tipo==="dorama"||tipo==="doramas")adicionarCard("doramas",item);else adicionarCard("filmes",item)});catalogo.filter(i=>i.recomendado===true).forEach(i=>adicionarCard("recomendados",i));carregarDestaque();montarFiltros();aplicarFiltrosEBusca()}
function adicionarCard(containerId,item){const c=$(containerId);if(c)c.appendChild(criarCard(item))}
function criarCard(item){const card=document.createElement("div");card.className="movie-card";card.dataset.titulo=normalizar(item.titulo);card.dataset.categoria=String(item.categoria||"");const tag=obterTagItem(item);let rotulo="GRÁTIS";if(tag==="prime")rotulo=`PRIME ${formatarPreco(valoresPlanosAdmin.prime)}`;if(tag==="premium")rotulo=`PREMIUM ${formatarPreco(valoresPlanosAdmin.premium)}`;const selo=document.createElement("span");selo.className=`selo-card ${tag}`;selo.textContent=rotulo;card.appendChild(selo);const fallback=document.createElement("div");fallback.className="titulo-fallback hidden";fallback.textContent=item.titulo||"Sem título";if(item.capa){const img=document.createElement("img");img.src=item.capa;img.alt=item.titulo||"";img.loading="lazy";img.onerror=()=>{img.style.display="none";fallback.classList.remove("hidden")};card.appendChild(img)}else fallback.classList.remove("hidden");card.appendChild(fallback);card.addEventListener("click",()=>abrirDetalhes(item));return card}
function montarFiltros(){const c=$("filtros");if(!c)return;c.querySelectorAll('.chip:not([data-genero="Todos"])').forEach(x=>x.remove());[...new Set(catalogo.map(i=>i.categoria).filter(Boolean))].sort().forEach(g=>{const b=document.createElement("button");b.className="chip";b.dataset.genero=g;b.textContent=g;c.appendChild(b)})}
function aplicarFiltrosEBusca(){const texto=normalizar($("busca")?.value);const genero=document.querySelector("#filtros .chip.ativo")?.dataset.genero||"Todos";document.querySelectorAll(".movie-card").forEach(card=>{const okBusca=!texto||card.dataset.titulo.includes(texto);const okGenero=genero==="Todos"||card.dataset.categoria===genero;card.style.display=okBusca&&okGenero?"":"none"})}
$("filtros")?.addEventListener("click",e=>{const chip=e.target.closest(".chip");if(!chip)return;document.querySelectorAll("#filtros .chip").forEach(x=>x.classList.remove("ativo"));chip.classList.add("ativo");aplicarFiltrosEBusca()});$("busca")?.addEventListener("input",aplicarFiltrosEBusca);
function carregarDestaque(){const d=catalogo.find(i=>i.destaque===true)||catalogo[0];if(!d){$("heroTitle").textContent="V8 Play+";return}filmeAtual=d;$("heroTitle").textContent=d.titulo||"V8 Play+";$("heroDesc").textContent=d.descricao||"Sua nova experiência em entretenimento.";const imagem=d.banner||d.capa;if(imagem)$("hero").style.backgroundImage=`url("${String(imagem).replaceAll('"','\\"')}")`}

function criarBotao(classe,html){const b=document.createElement("button");b.className=classe;b.innerHTML=html;return b}
function abrirDetalhes(item){filmeAtual=item;$("detImg").src=item.banner||item.capa||"";$("detImg").alt=item.titulo||"";$("detTitulo").textContent=item.titulo||"Sem título";$("detAno").textContent=item.ano||"";$("detCategoria").textContent=item.categoria||item.tipo||"";$("detDescricao").textContent=item.descricao||"Sem descrição disponível.";const c=$("detBtnsContainer");c.innerHTML="";const tag=obterTagItem(item);const comprado=titulosComprados.has(item.id);
if(tag==="gratis"||tag==="free"){const assistir=criarBotao("btn-gratis",'<i class="fa-solid fa-play"></i> Assistir');assistir.onclick=()=>iniciarFluxoAnuncio("assistir",item);c.appendChild(assistir);if(item.arquivoDownload){const down=criarBotao("btn-info",'<i class="fa-solid fa-download"></i> Baixar');down.onclick=()=>iniciarFluxoAnuncio("baixar",item);c.appendChild(down)}}else{const valor=tag==="prime"?valoresPlanosAdmin.prime:valoresPlanosAdmin.premium;if(comprado){const assistir=criarBotao("btn-login",'<i class="fa-solid fa-play"></i> Assistir Agora');assistir.onclick=()=>irParaPlayer(item);c.appendChild(assistir);if(item.arquivoDownload){const down=criarBotao("btn-info",'<i class="fa-solid fa-download"></i> Baixar Arquivo');down.onclick=()=>executarDownload(item);c.appendChild(down)}}else{const classe=tag==="prime"?"btn-pix-prime":"btn-pix-premium";const comprar=criarBotao(classe,`<i class="fa-brands fa-pix"></i> Comprar ${tag.toUpperCase()} — ${formatarPreco(valor)}`);comprar.onclick=()=>solicitarPix(item,tag,valor);c.appendChild(comprar)}}
const trailer=item.trailer||item.videoTrailer;if(trailer){const b=criarBotao("btn-info",'<i class="fa-solid fa-film"></i> Trailer');b.onclick=()=>abrirTrailer(item);c.appendChild(b)}$("detalheModal").classList.remove("hidden")}

function irParaPlayer(item){if(!item?.id||!item?.colecao){mostrarNotificacao("Não foi possível abrir este conteúdo.");return}const p=new URLSearchParams();p.set("id",item.id);p.set("colecao",item.colecao);const video=item.video||item.video1||item.video2||item.video3||item.embed||"";if(video)p.set("video",video);if(item.titulo)p.set("title",item.titulo);window.location.href=`player.html?${p.toString()}`}
function abrirTrailer(item){const video=item.trailer||item.videoTrailer;if(!video){mostrarNotificacao("Trailer não encontrado.");return}const p=new URLSearchParams({id:item.id||"",colecao:item.colecao||"",trailer:"true",video});if(item.titulo)p.set("title",item.titulo);window.location.href=`player.html?${p.toString()}`}

function iniciarFluxoAnuncio(tipo,item){filmeAtual=item;acaoAnuncioPendente=tipo;$("detalheModal").classList.add("hidden");$("actionModal").classList.remove("hidden");$("actionMessage").textContent=tipo==="assistir"?"Preparando o conteúdo para assistir...":"Preparando seu download...";const botao=$("btnConfirmarAcao");let contador=5;botao.disabled=true;botao.textContent=`Aguarde ${contador}s...`;if(adTimer)clearInterval(adTimer);adTimer=setInterval(()=>{contador--;if(contador>0)botao.textContent=`Aguarde ${contador}s...`;else{clearInterval(adTimer);adTimer=null;botao.disabled=false;botao.textContent=tipo==="assistir"?"Assistir agora":"Iniciar download"}},1000)}
$("btnConfirmarAcao")?.addEventListener("click",()=>{if(!filmeAtual)return;const item=filmeAtual,acao=acaoAnuncioPendente;fecharModais();if(acao==="assistir")irParaPlayer(item);else if(acao==="baixar")executarDownload(item)});
function executarDownload(item){const url=item?.arquivoDownload;if(!url){mostrarNotificacao("Link de download não disponível.");return}window.location.href=url}

async function solicitarPix(item,tag,valor){if(!auth.currentUser){fecharModais();$("loginModal").classList.remove("hidden");$("erroAuth").textContent=`Faça login para comprar o acesso ${tag.toUpperCase()}.`;return}if(!Number.isFinite(Number(valor))||Number(valor)<=0){mostrarNotificacao("Valor inválido.");return}try{mostrarNotificacao("Gerando pagamento...");const payload={uid:auth.currentUser.uid,email:auth.currentUser.email||"",itemId:item.id,colecao:item.colecao,tag,valor:Number(valor)};const resposta=await fetch("/criar-compra-pix",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const texto=await resposta.text();let dados;try{dados=JSON.parse(texto)}catch{dados={success:false,error:texto||"Resposta inválida."}}if(!resposta.ok){mostrarNotificacao(dados.error||`Erro HTTP ${resposta.status}`);return}if(dados.success&&dados.checkout_url){window.location.href=dados.checkout_url;return}mostrarNotificacao(dados.error||"Não foi possível criar o checkout.")}catch(e){console.error("Erro InfinitePay:",e);mostrarNotificacao("Falha na conexão com o pagamento.")}}

function fecharModais(){document.querySelectorAll(".modal").forEach(m=>m.classList.add("hidden"));if(adTimer){clearInterval(adTimer);adTimer=null}acaoAnuncioPendente=null}
window.fecharModais=fecharModais;
$("btnFecharDetalhes")?.addEventListener("click",fecharModais);$("btnCancelarLogin")?.addEventListener("click",fecharModais);
$("heroAssistir")?.addEventListener("click",()=>filmeAtual&&abrirDetalhes(filmeAtual));$("heroInfo")?.addEventListener("click",()=>filmeAtual&&abrirDetalhes(filmeAtual));

$("alternarCadastro")?.addEventListener("click",()=>{modoCadastro=!modoCadastro;$("tituloAuth").textContent=modoCadastro?"Criar nova conta":"Entrar no V8 Play+";$("doLogin").textContent=modoCadastro?"Criar conta":"Entrar";$("alternarCadastro").textContent=modoCadastro?"Já possui conta? Fazer login":"Ainda não tem conta? Criar conta";$("erroAuth").textContent=""});
$("btnEsqueciSenha")?.addEventListener("click",async()=>{const email=$("email").value.trim();if(!email){$("erroAuth").textContent="Informe seu e-mail.";return}try{await sendPasswordResetEmail(auth,email);mostrarNotificacao("E-mail de redefinição enviado.");$("erroAuth").textContent=""}catch(e){console.error(e);$("erroAuth").textContent="Não foi possível enviar o e-mail."}});
$("doLogin")?.addEventListener("click",async()=>{const email=$("email").value.trim(),senha=$("password").value,erro=$("erroAuth");erro.textContent="";if(!email||!senha){erro.textContent="Preencha todos os campos.";return}try{if(modoCadastro){const cred=await createUserWithEmailAndPassword(auth,email,senha);await setDoc(doc(db,"usuarios",cred.user.uid),{email,admin:false,criadoEm:serverTimestamp()})}else await signInWithEmailAndPassword(auth,email,senha);fecharModais();mostrarNotificacao(modoCadastro?"Conta criada com sucesso!":"Login realizado!")}catch(e){console.error(e);const map={"auth/invalid-credential":"E-mail ou senha incorretos.","auth/wrong-password":"E-mail ou senha incorretos.","auth/user-not-found":"E-mail ou senha incorretos.","auth/email-already-in-use":"Este e-mail já está cadastrado.","auth/weak-password":"A senha deve possuir pelo menos 6 caracteres.","auth/invalid-email":"E-mail inválido."};erro.textContent=map[e.code]||"Falha na autenticação."}});
$("authBtn")?.addEventListener("click",async()=>{if(auth.currentUser){await signOut(auth);mostrarNotificacao("Sessão encerrada.")}else $("loginModal").classList.remove("hidden")});
onAuthStateChanged(auth,user=>{$("authBtn").textContent=user?`Sair (${user.email?.split("@")[0]||"Usuário"})`:"Entrar"});
function mostrarNotificacao(mensagem){const box=$("notification"),texto=$("notificationText");if(!box||!texto)return;texto.textContent=mensagem;box.classList.remove("hidden");clearTimeout(notificacaoTimer);notificacaoTimer=setTimeout(()=>box.classList.add("hidden"),3500)}
document.querySelectorAll(".modal").forEach(modal=>modal.addEventListener("click",e=>{if(e.target===modal)fecharModais()}));document.addEventListener("keydown",e=>{if(e.key==="Escape")fecharModais()});
console.log("🚀 V8 Play+ iniciado");console.log("🛡️ Navegação direta do player ativada");carregarCatalogo().catch(e=>console.error("Erro ao iniciar V8 Play+:",e));
</script>
</body>
</html>
