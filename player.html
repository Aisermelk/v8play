
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player - V8 Play+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0f1016] text-white min-h-screen font-sans">

    <!-- Header -->
    <header class="flex items-center justify-between px-6 py-4 bg-[#14151f] border-b border-gray-800 sticky top-0 z-50 shadow-md">
        <div class="flex items-center space-x-2">
            <a href="index.html" class="bg-gradient-to-r from-red-600 to-orange-500 text-white font-extrabold px-3 py-1 rounded-lg text-lg tracking-wider shadow-lg">V8+</a>
            <a href="index.html" class="text-xl font-bold tracking-wide hover:text-gray-300 transition-colors">V8 Play+</a>
        </div>
        <div>
            <a href="index.html" class="bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs font-bold px-4 py-2 rounded-lg transition-all">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao Início
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        <div id="loading" class="text-center py-20 text-gray-400">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-red-500 mb-3"></i>
            <p>Carregando conteúdo...</p>
        </div>

        <div id="contentArea" class="hidden">
            <!-- Video Player Container -->
            <div class="relative aspect-video bg-black rounded-xl overflow-hidden shadow-2xl border border-gray-800 mb-6">
                <div id="playerWrapper" class="w-full h-full flex items-center justify-center">
                    <!-- Player inserido via JS -->
                </div>
            </div>

            <!-- Opções de Players (se houver mais de uma URL) -->
            <div id="opcoesPlayer" class="flex flex-wrap gap-3 mb-6 hidden">
                <span class="text-sm text-gray-400 self-center font-medium"><i class="fa-solid fa-server"></i> Opções de Player:</span>
            </div>

            <!-- Informações do Conteúdo -->
            <div class="bg-[#16161a] border border-gray-800 rounded-xl p-6 shadow-lg">
                <div class="flex flex-wrap justify-between items-start gap-4 mb-4">
                    <div>
                        <div class="flex items-center gap-3 mb-2">
                            <span id="itemTag" class="bg-cyan-500 text-black font-bold text-xs px-2.5 py-1 rounded-md uppercase">Grátis</span>
                            <span id="itemCategoria" class="text-xs text-gray-400 uppercase tracking-wider">Categoria</span>
                            <span id="itemAno" class="text-xs text-gray-400">2026</span>
                        </div>
                        <h1 id="itemTitulo" class="text-2xl sm:text-3xl font-extrabold text-white">Título do Conteúdo</h1>
                    </div>
                    <div id="acoesExtra" class="flex gap-3">
                        <a id="btnDownload" href="#" target="_blank" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm px-4 py-2.5 rounded-lg transition-all shadow-md flex items-center gap-2">
                            <i class="fa-solid fa-download"></i> Baixar
                        </a>
                    </div>
                </div>
                <p id="itemDescricao" class="text-gray-300 text-sm leading-relaxed">Sinopse do conteúdo...</p>
            </div>
        </div>

        <!-- Bloco de Acesso Negado / Paywall -->
        <div id="paywallArea" class="hidden max-w-md mx-auto bg-[#16161a] border border-amber-500/30 rounded-xl p-8 text-center shadow-2xl mt-10">
            <div class="w-16 h-16 bg-amber-500/10 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-xl font-bold mb-2">Conteúdo Exclusivo</h2>
            <p id="paywallMsg" class="text-gray-400 text-sm mb-6">Este conteúdo exige uma assinatura ou compra para ser desbloqueado.</p>
            <div id="pixContainer" class="space-y-4">
                <button onclick="simularPagamentoPix()" class="w-full bg-amber-500 hover:bg-amber-600 text-black font-bold py-3 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-qrcode"></i> Desbloquear via Pix (Simulação)
                </button>
            </div>
        </div>
    </main>

    <!-- Firebase Scripts -->
    <script type="module">
        import { db, auth } from "./firebase.js";
        import { doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const COLECOES = ["filmes", "series", "animes", "doramas"];

        async function carregarConteudo() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('v');

            if (!id) {
                mostrarErro("Nenhum conteúdo especificado.");
                return;
            }

            let itemEncontrado = null;

            for (const col of COLECOES) {
                try {
                    const docRef = doc(db, col, id);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        itemEncontrado = { id: docSnap.id, colecao: col, ...docSnap.data() };
                        break;
                    }
                } catch (e) {
                    console.error(e);
                }
            }

            if (!itemEncontrado) {
                for (const col of COLECOES) {
                    try {
                        const snap = await getDocs(collection(db, col));
                        snap.forEach(d => {
                            if (d.id === id) {
                                itemEncontrado = { id: d.id, colecao: col, ...d.data() };
                            }
                        });
                        if (itemEncontrado) break;
                    } catch (e) {
                        console.error(e);
                    }
                }
            }

            if (!itemEncontrado) {
                mostrarErro("Conteúdo não encontrado ou removido.");
                return;
            }

            renderizarPagina(itemEncontrado);
        }

        function renderizarPagina(item) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('contentArea').classList.remove('hidden');

            document.getElementById('itemTitulo').innerText = item.titulo || "Sem Título";
            document.getElementById('itemCategoria').innerText = item.categoria || item.colecao;
            document.getElementById('itemAno').innerText = item.ano || "";
            document.getElementById('itemDescricao').innerText = item.descricao || "Sem sinopse cadastrada.";

            const tag = (item.tag || item.plano || "gratis").toLowerCase();
            const tagEl = document.getElementById('itemTag');
            tagEl.innerText = tag.toUpperCase();
            if(tag === 'gratis') {
                tagEl.className = "bg-cyan-500 text-black font-bold text-xs px-2.5 py-1 rounded-md uppercase";
            } else {
                tagEl.className = "bg-amber-500 text-black font-bold text-xs px-2.5 py-1 rounded-md uppercase";
            }

            onAuthStateChanged(auth, async (user) => {
                let temAcesso = (tag === 'gratis');
                if (user) {
                    try {
                        const userDoc = await getDoc(doc(db, "usuarios", user.uid));
                        if (userDoc.exists() && userDoc.data().admin) {
                            temAcesso = true;
                        }
                    } catch(e) {}
                }

                if (!temAcesso && localStorage.getItem(`desbloqueado_${item.id}`) !== 'true') {
                    document.getElementById('contentArea').classList.add('hidden');
                    document.getElementById('paywallArea').classList.remove('hidden');
                    document.getElementById('paywallMsg').innerText = `Este conteúdo exige o plano ${tag.toUpperCase()} ou compra individual de R$ ${Number(item.preco || 0).toFixed(2)}.`;
                    return;
                }

                configurarPlayer(item);
            });

            if (item.arquivoDownload || item.video1) {
                const btnDown = document.getElementById('btnDownload');
                btnDown.href = item.arquivoDownload || item.video1;
                btnDown.classList.remove('hidden');
            }
        }

        function configurarPlayer(item) {
            const playerWrapper = document.getElementById('playerWrapper');
            const opcoesContainer = document.getElementById('opcoesPlayer');

            const videos = [
                { nome: 'Player Principal', url: item.video1 || item.video },
                { nome: 'Opção 2', url: item.video2 },
                { nome: 'Opção 3', url: item.video3 }
            ].filter(v => v.url && v.url.trim() !== "");

            if (videos.length === 0) {
                playerWrapper.innerHTML = `<p class="text-gray-500">Nenhum link de vídeo cadastrado para este item.</p>`;
                return;
            }

            carregarMidiaNoPlayer(videos[0].url);

            if (videos.length > 1) {
                opcoesContainer.classList.remove('hidden');
                videos.forEach((v, index) => {
                    const btn = document.createElement('button');
                    btn.className = `px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${index === 0 ? 'bg-red-600 text-white' : 'bg-gray-800 hover:bg-gray-700 text-gray-300'}`;
                    btn.innerHTML = `<i class="fa-solid fa-play"></i> ${v.nome}`;
                    btn.onclick = () => {
                        document.querySelectorAll('#opcoesPlayer button').forEach(b => b.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-gray-800 hover:bg-gray-700 text-gray-300');
                        btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-red-600 text-white';
                        carregarMidiaNoPlayer(v.url);
                    };
                    opcoesContainer.appendChild(btn);
                });
            }
        }

        function carregarMidiaNoPlayer(url) {
            const playerWrapper = document.getElementById('playerWrapper');
            if (url.includes('youtube.com') || url.includes('youtu.be') || url.includes('embed')) {
                let embedUrl = url;
                if (url.includes('watch?v=')) {
                    embedUrl = url.replace('watch?v=', 'embed/');
                }
                playerWrapper.innerHTML = `<iframe src="${embedUrl}" class="w-full h-full" frameborder="0" allowfullscreen></iframe>`;
            } else if (url.endsWith('.mp4') || url.includes('.m3u8') || url.includes('storage.googleapis.com')) {
                playerWrapper.innerHTML = `<video src="${url}" controls autoplay class="w-full h-full object-contain"></video>`;
            } else {
                playerWrapper.innerHTML = `<iframe src="${url}" class="w-full h-full" frameborder="0" allowfullscreen></iframe>`;
            }
        }

        window.simularPagamentoPix = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('v');
            localStorage.setItem(`desbloqueado_${id}`, 'true');
            alert("Pagamento simulado com sucesso! Conteúdo desbloqueado.");
            window.location.reload();
        };

        function mostrarErro(msg) {
            document.getElementById('loading').innerHTML = `<p class="text-red-500 font-semibold">${msg}</p><a href="index.html" class="inline-block mt-4 text-xs bg-gray-800 px-4 py-2 rounded-lg text-white">Voltar ao Início</a>`;
        }

        window.addEventListener('DOMContentLoaded', carregarConteudo);
    </script>
</body>
</html>
