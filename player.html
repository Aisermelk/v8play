<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>V8 Play+ — Assistir</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        :root {
            --primary: #00d4ff;
            --primary-hover: #00a2c7;
            --bg-dark: #0a0a0b;
            --bg-card: #16161a;
            --text: #ffffff;
            --text-secondary: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-dark);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }

        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            z-index: 1000;

            display: flex;
            align-items: center;
            gap: 20px;

            padding: 0 5%;

            background: rgba(10, 10, 11, 0.95);
            backdrop-filter: blur(10px);

            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .btn-voltar {
            border: none;
            background: rgba(255,255,255,0.08);
            color: white;

            padding: 10px 16px;
            border-radius: 8px;

            cursor: pointer;
            font-weight: 600;

            transition: 0.2s;
        }

        .btn-voltar:hover {
            background: var(--primary);
            color: #000;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
        }

        .logo span {
            color: var(--primary);
        }

        main {
            padding: 100px 5% 40px;
        }

        .player-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .player-box {
            width: 100%;
            aspect-ratio: 16 / 9;

            background: #000;
            border-radius: 12px;

            overflow: hidden;
            position: relative;

            border: 1px solid #222;

            box-shadow:
                0 10px 40px rgba(0,0,0,0.5);
        }

        video,
        iframe {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
        }

        video {
            background: #000;
        }

        .loading {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            background: #000;

            z-index: 5;
        }

        .loading i {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .loading p {
            color: #aaa;
        }

        .erro {
            position: absolute;
            inset: 0;

            display: none;

            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            background: #000;

            padding: 30px;

            z-index: 10;
        }

        .erro i {
            font-size: 3rem;
            color: #ff5b5b;
            margin-bottom: 15px;
        }

        .erro h2 {
            margin-bottom: 10px;
        }

        .erro p {
            color: #aaa;
            max-width: 600px;
            line-height: 1.6;
        }

        .info {
            margin-top: 25px;
        }

        .info h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .meta {
            display: flex;
            gap: 10px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .descricao {
            color: #ccc;
            line-height: 1.7;
            max-width: 900px;
        }

        .badge {
            display: inline-block;

            padding: 4px 9px;

            border-radius: 5px;

            background: rgba(0,212,255,0.12);
            color: var(--primary);

            font-size: 0.75rem;
            font-weight: 700;
        }

        @media (max-width: 700px) {

            .topbar {
                height: 60px;
                padding: 0 4%;
            }

            main {
                padding: 80px 3% 30px;
            }

            .player-box {
                border-radius: 8px;
            }

            .info h1 {
                font-size: 1.5rem;
            }

            .btn-voltar {
                padding: 8px 12px;
            }

            .logo {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

<header class="topbar">

    <button
        class="btn-voltar"
        id="btnVoltar"
    >
        <i class="fa-solid fa-arrow-left"></i>
        Voltar
    </button>

    <div class="logo">
        V8 <span>Play+</span>
    </div>

</header>


<main>

    <div class="player-container">

        <div class="player-box">

            <div
                class="loading"
                id="loading"
            >

                <i class="fa-solid fa-spinner fa-spin"></i>

                <p>
                    Carregando vídeo...
                </p>

            </div>


            <video
                id="videoPlayer"
                controls
                playsinline
                preload="metadata"
                style="display:none;"
            ></video>


            <iframe
                id="youtubePlayer"
                style="display:none;"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen
            ></iframe>


            <div
                class="erro"
                id="erroPlayer"
            >

                <i class="fa-solid fa-circle-exclamation"></i>

                <h2>
                    Não foi possível abrir o vídeo
                </h2>

                <p id="erroTexto">
                    O vídeo não está disponível.
                </p>

            </div>

        </div>


        <div class="info">

            <h1 id="titulo">
                Carregando...
            </h1>

            <div class="meta">

                <span id="ano"></span>

                <span>•</span>

                <span id="categoria"></span>

                <span
                    class="badge"
                    id="tipoVideo"
                ></span>

            </div>

            <p
                class="descricao"
                id="descricao"
            ></p>

        </div>

    </div>

</main>


<script type="module">

    import {
        db,
        auth
    } from "./js/firebase.js";


    import {
        doc,
        getDoc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


    // =====================================================
    // ELEMENTOS
    // =====================================================

    const loading =
        document.getElementById("loading");


    const videoPlayer =
        document.getElementById("videoPlayer");


    const youtubePlayer =
        document.getElementById("youtubePlayer");


    const erroPlayer =
        document.getElementById("erroPlayer");


    const erroTexto =
        document.getElementById("erroTexto");


    const titulo =
        document.getElementById("titulo");


    const ano =
        document.getElementById("ano");


    const categoria =
        document.getElementById("categoria");


    const descricao =
        document.getElementById("descricao");


    const tipoVideo =
        document.getElementById("tipoVideo");


    // =====================================================
    // PARÂMETROS DA URL
    // =====================================================

    const params =
        new URLSearchParams(
            window.location.search
        );


    const itemId =
        params.get("id");


    const colecao =
        params.get("colecao");


    const trailer =
        params.get("trailer") === "true";


    console.log(
        "🎬 Player iniciado"
    );


    console.log(
        "ID:",
        itemId
    );


    console.log(
        "Coleção:",
        colecao
    );


    console.log(
        "Trailer:",
        trailer
    );


    // =====================================================
    // VOLTAR
    // =====================================================

    document
        .getElementById("btnVoltar")
        .onclick =
        () => {

            window.location.href =
                "index.html";

        };


    // =====================================================
    // ERRO
    // =====================================================

    function mostrarErro(mensagem) {

        console.error(
            "❌",
            mensagem
        );


        loading.style.display =
            "none";


        videoPlayer.style.display =
            "none";


        youtubePlayer.style.display =
            "none";


        erroTexto.innerText =
            mensagem;


        erroPlayer.style.display =
            "flex";

    }


    // =====================================================
    // YOUTUBE
    // =====================================================

    function extrairYoutubeId(url) {

        if (!url)
            return null;


        url =
            String(url).trim();


        // ID puro do YouTube
        if (
            /^[a-zA-Z0-9_-]{11}$/.test(url)
        ) {

            return url;

        }


        const padroes = [

            /youtube\.com\/watch\?v=([^&]+)/i,

            /youtube\.com\/embed\/([^?&]+)/i,

            /youtube\.com\/shorts\/([^?&]+)/i,

            /youtu\.be\/([^?&]+)/i

        ];


        for (
            const regex of padroes
        ) {

            const match =
                url.match(regex);


            if (match) {

                return match[1];

            }

        }


        return null;

    }


    // =====================================================
    // VERIFICAR URL
    // =====================================================

    function ehYoutube(url) {

        if (!url)
            return false;


        const texto =
            String(url)
                .toLowerCase();


        return (
            texto.includes("youtube.com") ||
            texto.includes("youtu.be")
        );

    }


    function ehVideoArquivo(url) {

        if (!url)
            return false;


        const texto =
            String(url)
                .toLowerCase();


        return (
            texto.includes(".mp4") ||
            texto.includes(".webm") ||
            texto.includes(".ogg") ||
            texto.includes(".m3u8")
        );

    }


    // =====================================================
    // REPRODUZIR YOUTUBE
    // =====================================================

    function reproduzirYoutube(url) {

        const youtubeId =
            extrairYoutubeId(url);


        if (!youtubeId) {

            mostrarErro(
                "O link do YouTube é inválido."
            );

            return;

        }


        console.log(
            "▶️ YouTube ID:",
            youtubeId
        );


        const embedUrl =
            `https://www.youtube.com/embed/${youtubeId}?autoplay=1&rel=0&modestbranding=1`;


        youtubePlayer.src =
            embedUrl;


        youtubePlayer.style.display =
            "block";


        videoPlayer.style.display =
            "none";


        tipoVideo.innerText =
            "YOUTUBE";


        loading.style.display =
            "none";


        console.log(
            "✅ YouTube carregado:",
            embedUrl
        );

    }


    // =====================================================
    // REPRODUZIR ARQUIVO
    // =====================================================

    function reproduzirArquivo(url) {

        console.log(
            "▶️ Arquivo:",
            url
        );


        videoPlayer.src =
            url;


        videoPlayer.style.display =
            "block";


        youtubePlayer.style.display =
            "none";


        tipoVideo.innerText =
            "VÍDEO";


        loading.style.display =
            "none";


        videoPlayer.play()
            .catch(
                erro => {

                    console.warn(
                        "Autoplay bloqueado:",
                        erro
                    );

                }
            );


        videoPlayer.onerror =
            () => {

                mostrarErro(
                    "O arquivo de vídeo não pôde ser reproduzido. Verifique o link do vídeo."
                );

            };

    }


    // =====================================================
    // CARREGAR FILME
    // =====================================================

    async function carregarFilme() {

        if (!itemId) {

            mostrarErro(
                "ID do filme não foi informado na URL."
            );

            return;

        }


        if (!colecao) {

            mostrarErro(
                "A coleção do filme não foi informada."
            );

            return;

        }


        try {

            console.log(
                "🔥 Buscando:",
                `${colecao}/${itemId}`
            );


            const referencia =
                doc(
                    db,
                    colecao,
                    itemId
                );


            const snapshot =
                await getDoc(
                    referencia
                );


            if (!snapshot.exists()) {

                mostrarErro(
                    "O filme não foi encontrado no catálogo."
                );

                return;

            }


            const item =
                snapshot.data();


            console.log(
                "🎬 Filme encontrado:",
                item
            );


            // =================================================
            // INFORMAÇÕES
            // =================================================

            titulo.innerText =
                item.titulo ||
                "V8 Play+";


            ano.innerText =
                item.ano ||
                "";


            categoria.innerText =
                item.categoria ||
                item.tipo ||
                "";


            descricao.innerText =
                item.descricao ||
                "";


            // =================================================
            // ESCOLHER VÍDEO
            // =================================================

            let urlVideo;


            if (trailer) {

                urlVideo =
                    item.trailer ||
                    item.videoTrailer ||
                    item.video;

            }

            else {

                urlVideo =
                    item.video ||
                    item.video1 ||
                    item.urlVideo ||
                    item.arquivoDownload;

            }


            console.log(
                "🎥 URL selecionada:",
                urlVideo
            );


            if (!urlVideo) {

                mostrarErro(
                    "Este título ainda não possui um vídeo cadastrado."
                );

                return;

            }


            // =================================================
            // YOUTUBE
            // =================================================

            if (
                ehYoutube(urlVideo)
            ) {

                reproduzirYoutube(
                    urlVideo
                );

                return;

            }


            // =================================================
            // ARQUIVO DE VÍDEO
            // =================================================

            if (
                ehVideoArquivo(urlVideo)
            ) {

                reproduzirArquivo(
                    urlVideo
                );

                return;

            }


            // =================================================
            // TENTAR COMO VÍDEO
            // =================================================

            console.log(
                "⚠️ Formato não identificado. Tentando como vídeo."
            );


            reproduzirArquivo(
                urlVideo
            );

        }

        catch (erro) {

            console.error(
                "❌ Erro ao carregar filme:",
                erro
            );


            mostrarErro(
                "Não foi possível carregar o filme. Verifique sua conexão e tente novamente."
            );

        }

    }


    // =====================================================
    // INICIAR
    // =====================================================

    carregarFilme();

</script>

</body>
</html>
