<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>V8 Play+ | Player</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <style>

        :root {
            --primary: #00d4ff;
            --primary-hover: #00a2c7;

            --bg: #080809;
            --surface: #121216;
            --surface2: #18181d;

            --text: #ffffff;
            --text2: #aaaaaa;

            --danger: #ff4d4d;

            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: var(--bg);
        }

        body {
            min-height: 100vh;
            color: var(--text);
            font-family: "Poppins", sans-serif;
            overflow-x: hidden;
        }

        button {
            font-family: inherit;
        }

        .hidden {
            display: none !important;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        header {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 70px;

            display: flex;
            align-items: center;

            gap: 15px;

            padding: 10px 5%;

            z-index: 1000;

            background:
                linear-gradient(
                    to bottom,
                    rgba(8,8,9,.98),
                    rgba(8,8,9,.82)
                );

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border-bottom:
                1px solid
                rgba(255,255,255,.05);
        }

        .btn-voltar {
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                rgba(255,255,255,.08);

            color: #fff;

            cursor: pointer;

            transition: .2s;

            flex-shrink: 0;
        }

        .btn-voltar:hover {
            background: var(--primary);
            color: #000;

            transform:
                translateX(-2px);
        }

        .logo {
            display: flex;
            align-items: center;

            text-decoration: none;

            color: #fff;

            font-size: 1.35rem;
            font-weight: 800;
        }

        .logo span {
            color: var(--primary);
        }

        .logo-img {
            height: 40px;
            width: auto;

            object-fit: contain;

            margin-right: 8px;
        }

        /* =====================================================
           MAIN
        ===================================================== */

        main {
            width: 100%;
            min-height: 100vh;

            padding-top: 70px;
        }

        .player-wrapper {
            width: 100%;
            max-width: 1400px;

            margin: 0 auto;

            padding:
                20px 4% 50px;
        }

        /* =====================================================
           PLAYER
        ===================================================== */

        .player-container {
            position: relative;

            width: 100%;

            aspect-ratio: 16 / 9;

            background: #000;

            border-radius: var(--radius);

            overflow: hidden;

            border:
                1px solid
                rgba(255,255,255,.07);

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.6);
        }

        #videoPlayer,
        #youtubePlayer,
        #iframePlayer {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            display: block;

            border: 0;

            background: #000;
        }

        #videoPlayer {
            object-fit: contain;
        }

        /* =====================================================
           LOADING
        ===================================================== */

        #loading {
            position: absolute;

            inset: 0;

            z-index: 50;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 15px;

            background:
                rgba(0,0,0,.92);
        }

        .spinner {
            width: 50px;
            height: 50px;

            border-radius: 50%;

            border:
                4px solid
                rgba(255,255,255,.12);

            border-top-color:
                var(--primary);

            animation:
                girar .8s linear infinite;
        }

        @keyframes girar {

            to {
                transform:
                    rotate(360deg);
            }

        }

        #loadingText {
            color: #aaa;

            font-size: .9rem;

            text-align: center;

            padding: 0 20px;
        }

        /* =====================================================
           ERRO
        ===================================================== */

        #erroPlayer {
            position: absolute;

            inset: 0;

            z-index: 60;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 25px;

            text-align: center;

            background:
                rgba(0,0,0,.97);
        }

        .erro-box {
            width: 100%;
            max-width: 520px;
        }

        .erro-box i {
            display: block;

            font-size: 48px;

            color: var(--danger);

            margin-bottom: 15px;
        }

        .erro-box h2 {
            font-size: 1.35rem;

            margin-bottom: 10px;
        }

        .erro-box p {
            color: #aaa;

            font-size: .9rem;

            line-height: 1.6;

            margin-bottom: 20px;
        }

        .btn-retry {
            border: none;

            background: var(--primary);

            color: #000;

            padding:
                11px 22px;

            border-radius: 7px;

            font-weight: 700;

            cursor: pointer;

            transition: .2s;
        }

        .btn-retry:hover {
            background:
                var(--primary-hover);

            transform:
                translateY(-1px);
        }

        /* =====================================================
           INFORMAÇÕES
        ===================================================== */

        .info {
            padding:
                25px 0 0;
        }

        .info h1 {
            font-size: 1.8rem;

            font-weight: 700;

            margin-bottom: 8px;

            line-height: 1.2;
        }

        .meta {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            color: var(--text2);

            font-size: .85rem;

            margin-bottom: 15px;
        }

        .descricao {
            max-width: 900px;

            color: #ccc;

            font-size: .92rem;

            line-height: 1.7;
        }

        /* =====================================================
           TRAILER
        ===================================================== */

        .trailer-badge {
            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding:
                5px 10px;

            margin-bottom: 12px;

            border-radius: 5px;

            background:
                rgba(0,212,255,.1);

            border:
                1px solid
                rgba(0,212,255,.3);

            color:
                var(--primary);

            font-size: .72rem;

            font-weight: 700;

            text-transform: uppercase;
        }

        /* =====================================================
           NOTIFICAÇÃO
        ===================================================== */

        #notification {
            position: fixed;

            left: 50%;
            bottom: 25px;

            transform:
                translateX(-50%);

            z-index: 5000;

            max-width: 90%;

            padding:
                12px 25px;

            border-radius: 30px;

            background: #1d1d22;

            border:
                1px solid
                var(--primary);

            color: #fff;

            font-size: .85rem;

            text-align: center;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,.5);
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width:700px) {

            header {
                height: 60px;

                padding:
                    8px 4%;
            }

            main {
                padding-top: 60px;
            }

            .btn-voltar {
                width: 38px;
                height: 38px;
            }

            .logo {
                font-size: 1.05rem;
            }

            .logo-img {
                height: 34px;
            }

            .player-wrapper {
                padding:
                    10px 0 35px;
            }

            .player-container {
                border-radius: 0;

                border-left: none;
                border-right: none;
            }

            .info {
                padding:
                    20px 4% 40px;
            }

            .info h1 {
                font-size: 1.4rem;
            }

            .descricao {
                font-size: .85rem;
            }

        }

        @media (max-width:430px) {

            .logo span {
                display: none;
            }

            .logo-img {
                margin-right: 0;
            }

        }

    </style>

</head>

<body>

<header>

    <button
        class="btn-voltar"
        id="btnVoltar"
        type="button"
        aria-label="Voltar"
        title="Voltar"
    >
        <i class="fa-solid fa-arrow-left"></i>
    </button>

    <a
        href="index.html"
        class="logo"
    >

        <img
            src="assets/v8p.png"
            class="logo-img"
            alt="V8 Play+"
            onerror="this.style.display='none'"
        >

        <span>V8 Play+</span>

    </a>

</header>


<main>

    <div class="player-wrapper">

        <div class="player-container">

            <!-- LOADING -->

            <div id="loading">

                <div class="spinner"></div>

                <div id="loadingText">
                    Carregando conteúdo...
                </div>

            </div>


            <!-- VIDEO HTML5 -->

            <video
                id="videoPlayer"
                class="hidden"
                controls
                playsinline
                preload="metadata"
                crossorigin="anonymous"
            ></video>


            <!-- YOUTUBE -->

            <iframe
                id="youtubePlayer"
                class="hidden"
                allow="
                    autoplay;
                    encrypted-media;
                    picture-in-picture;
                    fullscreen
                "
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"
            ></iframe>


            <!-- IFRAME GENÉRICO -->

            <iframe
                id="iframePlayer"
                class="hidden"
                allow="
                    autoplay;
                    encrypted-media;
                    picture-in-picture;
                    fullscreen
                "
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"
            ></iframe>


            <!-- ERRO -->

            <div
                id="erroPlayer"
                class="hidden"
            >

                <div class="erro-box">

                    <i
                        class="fa-solid fa-circle-exclamation"
                    ></i>

                    <h2>
                        Não foi possível carregar o vídeo
                    </h2>

                    <p id="erroTexto">
                        Verifique o endereço do vídeo
                        ou tente novamente.
                    </p>

                    <button
                        class="btn-retry"
                        id="btnRetry"
                        type="button"
                    >

                        <i
                            class="fa-solid fa-rotate"
                        ></i>

                        Tentar novamente

                    </button>

                </div>

            </div>

        </div>


        <!-- INFORMAÇÕES -->

        <div class="info">

            <div
                id="trailerBadge"
                class="trailer-badge hidden"
            >

                <i class="fa-solid fa-film"></i>

                Trailer

            </div>

            <h1 id="titulo">
                Carregando...
            </h1>

            <div class="meta">

                <span id="ano"></span>

                <span id="separadorAno">
                    •
                </span>

                <span id="categoria"></span>

            </div>

            <p
                class="descricao"
                id="descricao"
            >
                Carregando informações...
            </p>

        </div>

    </div>

</main>


<div
    id="notification"
    class="hidden"
    role="status"
    aria-live="polite"
>

    <span id="notificationText"></span>

</div>


<script type="module">

    import { db } from "./js/firebase.js";

    import {
        doc,
        getDoc
    } from
    "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


    /* =====================================================
       ELEMENTOS
    ===================================================== */

    const videoPlayer =
        document.getElementById(
            "videoPlayer"
        );

    const youtubePlayer =
        document.getElementById(
            "youtubePlayer"
        );

    const iframePlayer =
        document.getElementById(
            "iframePlayer"
        );

    const loading =
        document.getElementById(
            "loading"
        );

    const loadingText =
        document.getElementById(
            "loadingText"
        );

    const erroPlayer =
        document.getElementById(
            "erroPlayer"
        );

    const erroTexto =
        document.getElementById(
            "erroTexto"
        );

    const titulo =
        document.getElementById(
            "titulo"
        );

    const ano =
        document.getElementById(
            "ano"
        );

    const categoria =
        document.getElementById(
            "categoria"
        );

    const descricao =
        document.getElementById(
            "descricao"
        );

    const trailerBadge =
        document.getElementById(
            "trailerBadge"
        );


    /* =====================================================
       URL
    ===================================================== */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const itemId =
        params.get("id") || "";

    const colecao =
        params.get("colecao") || "";

    const videoURL =
        params.get("video") || "";

    const tituloURL =
        params.get("title") || "";

    const isTrailer =
        params.get("trailer") === "true";


    /* =====================================================
       ESTADO
    ===================================================== */

    let itemAtual = null;


    /* =====================================================
       UTILITÁRIOS
    ===================================================== */

    function limparUrl(url) {

        if (!url)
            return "";

        return String(url).trim();

    }


    function escaparTexto(valor) {

        return String(
            valor ?? ""
        );

    }


    /* =====================================================
       YOUTUBE
    ===================================================== */

    function extrairYoutubeID(url) {

        url =
            limparUrl(url);

        if (!url)
            return null;


        /*
         * ID direto
         */

        if (
            /^[a-zA-Z0-9_-]{11}$/
                .test(url)
        ) {

            return url;

        }


        try {

            const parsed =
                new URL(url);

            const host =
                parsed.hostname
                    .toLowerCase();


            /*
             * youtu.be
             */

            if (
                host === "youtu.be"
            ) {

                const partes =
                    parsed.pathname
                        .split("/")
                        .filter(Boolean);

                if (
                    partes[0]
                ) {

                    return partes[0]
                        .substring(0,11);

                }

            }


            /*
             * youtube.com
             */

            if (
                host === "youtube.com" ||
                host === "www.youtube.com" ||
                host.endsWith(
                    ".youtube.com"
                )
            ) {

                /*
                 * watch?v=
                 */

                const v =
                    parsed.searchParams
                        .get("v");

                if (v) {

                    return v
                        .substring(0,11);

                }


                /*
                 * embed
                 * shorts
                 * live
                 */

                const partes =
                    parsed.pathname
                        .split("/")
                        .filter(Boolean);

                const tipos = [
                    "embed",
                    "shorts",
                    "live",
                    "v"
                ];


                for (
                    const tipo of tipos
                ) {

                    const index =
                        partes.indexOf(
                            tipo
                        );

                    if (
                        index >= 0 &&
                        partes[index + 1]
                    ) {

                        return partes[
                            index + 1
                        ].substring(0,11);

                    }

                }

            }

        }

        catch (erro) {

            console.warn(
                "URL inválida:",
                url
            );

        }


        /*
         * Última tentativa
         */

        const match =
            url.match(
                /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/
            );


        return match
            ? match[1]
            : null;

    }


    /* =====================================================
       DETECTAR TIPO
    ===================================================== */

    function detectarTipo(url) {

        url =
            limparUrl(url);

        if (!url)
            return "nenhum";


        if (
            extrairYoutubeID(url)
        ) {

            return "youtube";

        }


        const lower =
            url.toLowerCase();


        /*
         * Iframe
         */

        if (
            lower.includes("<iframe") ||
            lower.includes("iframe")
        ) {

            return "iframe";

        }


        /*
         * Arquivos de vídeo
         */

        if (
            /\.(mp4|webm|ogg)(\?|#|$)/i
                .test(url)
        ) {

            return "video";

        }


        /*
         * HLS
         */

        if (
            /\.m3u8(\?|#|$)/i
                .test(url)
        ) {

            return "video";

        }


        /*
         * Links desconhecidos:
         * tentamos HTML5.
         */

        return "video";

    }


    /* =====================================================
       LOADING
    ===================================================== */

    function mostrarLoading(
        mensagem
    ) {

        loadingText.textContent =
            mensagem ||
            "Carregando...";

        loading.classList.remove(
            "hidden"
        );

        erroPlayer.classList.add(
            "hidden"
        );

    }


    function esconderLoading() {

        loading.classList.add(
            "hidden"
        );

    }


    /* =====================================================
       ERRO
    ===================================================== */

    function mostrarErro(
        mensagem
    ) {

        esconderLoading();

        erroTexto.textContent =
            mensagem ||
            "Erro ao carregar vídeo.";

        erroPlayer.classList.remove(
            "hidden"
        );

    }


    /* =====================================================
       ESCONDER PLAYERS
    ===================================================== */

    function esconderPlayers() {

        /*
         * HTML5
         */

        try {

            videoPlayer.pause();

        }

        catch {}

        videoPlayer.removeAttribute(
            "src"
        );

        videoPlayer.load();

        videoPlayer.classList.add(
            "hidden"
        );


        /*
         * YouTube
         */

        youtubePlayer.src = "";

        youtubePlayer.classList.add(
            "hidden"
        );


        /*
         * Iframe
         */

        iframePlayer.src = "";

        iframePlayer.classList.add(
            "hidden"
        );

    }


    /* =====================================================
       YOUTUBE PLAYER
    ===================================================== */

    function carregarYoutube(
        url
    ) {

        const id =
            extrairYoutubeID(url);


        if (!id) {

            mostrarErro(
                "O link do YouTube não é válido."
            );

            return;

        }


        esconderPlayers();

        mostrarLoading(
            "Carregando YouTube..."
        );


        youtubePlayer.classList.remove(
            "hidden"
        );


        const query =
            new URLSearchParams({

                autoplay: "1",

                rel: "0",

                playsinline: "1",

                modestbranding: "1"

            });


        youtubePlayer.src =
            `https://www.youtube.com/embed/${id}?${query.toString()}`;


        youtubePlayer.onload =
            () => {

                esconderLoading();

            };


        /*
         * Fallback para navegadores
         * que não disparam corretamente
         * o evento do iframe.
         */

        setTimeout(
            () => {

                if (
                    !youtubePlayer.classList
                        .contains("hidden")
                ) {

                    esconderLoading();

                }

            },
            3500
        );

    }


    /* =====================================================
       IFRAME
    ===================================================== */

    function carregarIframe(
        url
    ) {

        if (!url) {

            mostrarErro(
                "URL do player não encontrada."
            );

            return;

        }


        /*
         * Caso o Firebase tenha
         * armazenado literalmente
         * um iframe HTML.
         */

        if (
            url.includes("<iframe")
        ) {

            const match =
                url.match(
                    /src=["']([^"']+)["']/i
                );


            if (match) {

                url =
                    match[1];

            }

            else {

                mostrarErro(
                    "Código iframe inválido."
                );

                return;

            }

        }


        esconderPlayers();

        mostrarLoading(
            "Carregando player..."
        );


        iframePlayer.classList.remove(
            "hidden"
        );


        iframePlayer.src =
            url;


        iframePlayer.onload =
            () => {

                esconderLoading();

            };


        setTimeout(
            () => {

                esconderLoading();

            },
            3500
        );

    }


    /* =====================================================
       HTML5 VIDEO
    ===================================================== */

    function carregarVideo(
        url
    ) {

        if (!url) {

            mostrarErro(
                "Nenhum vídeo foi informado."
            );

            return;

        }


        esconderPlayers();

        mostrarLoading(
            "Carregando vídeo..."
        );


        videoPlayer.classList.remove(
            "hidden"
        );


        /*
         * Eventos
         */

        videoPlayer.onloadedmetadata =
            () => {

                console.log(
                    "✅ Metadata carregada"
                );

                esconderLoading();

            };


        videoPlayer.onloadeddata =
            () => {

                console.log(
                    "✅ Dados carregados"
                );

                esconderLoading();

            };


        videoPlayer.oncanplay =
            () => {

                console.log(
                    "▶️ Vídeo pronto"
                );

                esconderLoading();

            };


        videoPlayer.onerror =
            () => {

                console.error(
                    "❌ Erro HTML5:",
                    videoPlayer.error
                );

                mostrarErro(
                    "O vídeo não pôde ser reproduzido. Verifique se o endereço está correto e se o servidor permite reprodução no navegador."
                );

            };


        /*
         * Definir fonte
         */

        videoPlayer.src =
            url;

        videoPlayer.load();

    }


    /* =====================================================
       ABRIR VÍDEO
    ===================================================== */

    function abrirVideo(
        url
    ) {

        url =
            limparUrl(url);


        if (!url) {

            mostrarErro(
                isTrailer
                    ? "Este título não possui trailer disponível."
                    : "Este título não possui vídeo disponível."
            );

            return;

        }


        console.log(
            "🎬 URL:",
            url
        );


        const tipo =
            detectarTipo(url);


        console.log(
            "🎥 Tipo:",
            tipo
        );


        switch (tipo) {

            case "youtube":

                carregarYoutube(
                    url
                );

                break;


            case "iframe":

                carregarIframe(
                    url
                );

                break;


            case "video":

                carregarVideo(
                    url
                );

                break;


            default:

                mostrarErro(
                    "Formato de vídeo não reconhecido."
                );

        }

    }


    /* =====================================================
       FIRESTORE
    ===================================================== */

    async function carregarFirestore() {

        if (
            !itemId ||
            !colecao
        ) {

            console.warn(
                "ID ou coleção não informados."
            );

            return null;

        }


        try {

            console.log(
                "🔥 Firestore:",
                colecao,
                itemId
            );


            const referencia =
                doc(
                    db,
                    colecao,
                    itemId
                );


            const snap =
                await getDoc(
                    referencia
                );


            if (!snap.exists()) {

                console.warn(
                    "Documento não encontrado."
                );

                return null;

            }


            return {

                id:
                    snap.id,

                colecao:
                    colecao,

                ...snap.data()

            };

        }

        catch (erro) {

            console.error(
                "❌ Erro Firestore:",
                erro
            );

            return null;

        }

    }


    /* =====================================================
       VÍDEO DO ITEM
    ===================================================== */

    function obterVideo(
        item
    ) {

        if (!item)
            return "";


        /*
         * TRAILER
         */

        if (isTrailer) {

            return limparUrl(

                item.trailer ||

                item.videoTrailer ||

                item.trailerUrl ||

                item.urlTrailer ||

                item.video_trailer ||

                videoURL

            );

        }


        /*
         * VÍDEO PRINCIPAL
         */

        return limparUrl(

            item.video ||

            item.video1 ||

            item.video2 ||

            item.video3 ||

            item.embed ||

            item.urlVideo ||

            item.videoUrl ||

            item.url ||

            videoURL

        );

    }


    /* =====================================================
       INFORMAÇÕES
    ===================================================== */

    function preencherInformacoes(
        item
    ) {

        if (!item)
            return;


        itemAtual =
            item;


        titulo.textContent =
            escaparTexto(
                item.titulo ||
                tituloURL ||
                "V8 Play+"
            );


        ano.textContent =
            escaparTexto(
                item.ano || ""
            );


        categoria.textContent =
            escaparTexto(
                item.categoria ||
                item.tipo ||
                ""
            );


        const separador =
            document.getElementById(
                "separadorAno"
            );


        if (
            !ano.textContent ||
            !categoria.textContent
        ) {

            separador.style.display =
                "none";

        }

        else {

            separador.style.display =
                "";

        }


        descricao.textContent =
            escaparTexto(
                item.descricao ||
                "Sem descrição disponível."
            );


        if (isTrailer) {

            trailerBadge.classList.remove(
                "hidden"
            );

        }

    }


    /* =====================================================
       VOLTAR
    ===================================================== */

    document
        .getElementById("btnVoltar")
        .addEventListener(
            "click",
            () => {

                if (
                    window.history.length > 1
                ) {

                    window.history.back();

                }

                else {

                    window.location.href =
                        "index.html";

                }

            }
        );


    /* =====================================================
       RETRY
    ===================================================== */

    document
        .getElementById("btnRetry")
        .addEventListener(
            "click",
            () => {

                erroPlayer.classList.add(
                    "hidden"
                );


                const url =
                    obterVideo(
                        itemAtual
                    );


                if (url) {

                    abrirVideo(
                        url
                    );

                }

                else {

                    mostrarErro(
                        "Não foi possível localizar o vídeo."
                    );

                }

            }
        );


    /* =====================================================
       INICIAR
    ===================================================== */

    async function iniciar() {

        console.log(
            "======================================"
        );

        console.log(
            "🚀 V8 PLAY+ PLAYER"
        );

        console.log(
            "ID:",
            itemId
        );

        console.log(
            "Coleção:",
            colecao
        );

        console.log(
            "Trailer:",
            isTrailer
        );

        console.log(
            "======================================"
        );


        mostrarLoading(
            "Buscando conteúdo..."
        );


        /*
         * 1.
         * Tenta Firebase
         */

        const item =
            await carregarFirestore();


        if (item) {

            preencherInformacoes(
                item
            );


            const url =
                obterVideo(
                    item
                );


            if (!url) {

                mostrarErro(
                    isTrailer
                        ? "Este conteúdo não possui trailer."
                        : "Este conteúdo não possui vídeo."
                );

                return;

            }


            abrirVideo(
                url
            );

            return;

        }


        /*
         * 2.
         * Fallback pela URL
         */

        if (videoURL) {

            titulo.textContent =
                tituloURL ||
                "V8 Play+";


            abrirVideo(
                videoURL
            );

            return;

        }


        /*
         * 3.
         * Nada encontrado
         */

        mostrarErro(
            "Não foi possível localizar o conteúdo solicitado."
        );

    }


    iniciar()
        .catch(
            erro => {

                console.error(
                    "❌ Erro fatal:",
                    erro
                );

                mostrarErro(
                    "Ocorreu um erro ao iniciar o player."
                );

            }
        );

</script>

</body>

</html>
