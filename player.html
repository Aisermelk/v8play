<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V8 Play+ - Assistir</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root {
            --primary: #00d4ff;
            --bg-dark: #0a0a0b;
            --bg-card: #16161a;
            --text: #ffffff;
            --text-secondary: #aaaaaa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-dark); color: var(--text); font-family: 'Poppins', sans-serif; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: #121216; border-bottom: 1px solid #222; }
        .logo { font-size: 1.4rem; font-weight: 800; color: white; text-decoration: none; }
        .logo span { color: var(--primary); }
        .user-area { display: flex; align-items: center; gap: 15px; }
        .btn-admin { background: var(--primary); color: #000; padding: 8px 15px; border-radius: 6px; font-weight: 600; text-decoration: none; font-size: 0.85rem; display: none; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .video-container { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
        .video-container iframe, .video-container video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .info-box { background: var(--bg-card); padding: 20px; border-radius: 10px; border: 1px solid #222; }
        .info-box h1 { font-size: 1.5rem; margin-bottom: 10px; }
        .info-box p { color: var(--text-secondary); font-size: 0.95rem; line-height: 1.5; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">V8 <span>Play+</span></a>
        <div class="user-area">
            <!-- Botão de Admin exibido apenas se o usuário logado for administrador -->
            <a href="admin.html" id="linkAdmin" class="btn-admin"><i class="fa-solid fa-user-shield"></i> Painel Admin</a>
            <span id="userEmail" style="font-size: 0.9rem; color: var(--text-secondary);">Carregando...</span>
        </div>
    </header>

    <div class="container">
        <!-- PLAYER DE VÍDEO -->
        <div class="video-container" id="playerWrapper">
            <iframe id="videoPlayer" src="" allowfullscreen></iframe>
        </div>

        <!-- INFORMAÇÕES DO CONTEÚDO -->
        <div class="info-box">
            <h1 id="tituloConteúdo">Carregando título...</h1>
            <p id="descricaoConteúdo">Aguarde enquanto carregamos as informações do vídeo...</p>
        </div>
    </div>

    <!-- FIREBASE MODULES -->
    <script type="module">
        import { db, auth } from "./js/firebase.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // 1. GERENCIAMENTO DE AUTENTICAÇÃO E PERMISSÕES (SEM REDIRECIONAR O USUÁRIO COMUM)
        onAuthStateChanged(auth, async (user) => {
            const emailSpan = document.getElementById('userEmail');
            const linkAdmin = document.getElementById('linkAdmin');

            if (!user) {
                emailSpan.innerText = "Visitante";
                // Opcional: Se quiser exigir login para assistir, redirecione para o login/index, NUNCA para o admin.
                // window.location.href = "index.html";
                return;
            }

            emailSpan.innerText = user.email;

            try {
                // Verifica no Firestore se o usuário é administrador apenas para mostrar o atalho do painel
                const userDoc = await getDoc(doc(db, "usuarios", user.uid));
                if (userDoc.exists() && userDoc.data().admin === true) {
                    linkAdmin.classList.remove('hidden'); // Exibe o botão do painel admin apenas para admins
                }
            } catch (e) {
                console.error("Erro ao verificar privilégios de admin:", e);
            }
        });

        // 2. Lógica para carregar o vídeo com base nos parâmetros da URL (ex: player.html?id=XYZ&col=filmes)
        async function carregarConteudoPlayer() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const colecao = params.get('col') || 'filmes';

            if (!id) {
                document.getElementById('tituloConteúdo').innerText = "Conteúdo não especificado.";
                document.getElementById('descricaoConteúdo').innerText = "Volte à página inicial e selecione um título válido.";
                return;
            }

            try {
                const docRef = doc(db, colecao, id);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('tituloConteúdo').innerText = data.titulo || "Sem Título";
                    document.getElementById('descricaoConteúdo').innerText = data.descricao || "Sem descrição disponível.";
                    
                    const urlVideo = data.video1 || data.video || "";
                    if (urlVideo) {
                        document.getElementById('videoPlayer').src = urlVideo;
                    } else {
                        document.getElementById('videoPlayer').style.display = 'none';
                        alert("Link de vídeo indisponível.");
                    }
                } else {
                    document.getElementById('tituloConteúdo').innerText = "Conteúdo não encontrado.";
                }
            } catch (error) {
                console.error("Erro ao carregar o vídeo:", error);
                document.getElementById('tituloConteúdo').innerText = "Erro ao carregar o conteúdo.";
            }
        }

        carregarConteudoPlayer();
    </script>
</body>
</html>
