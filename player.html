<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Player - V8 Play+</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>

        :root {
            --primary: #00d4ff;
            --bg-dark: #0a0a0b;
            --text: #ffffff;
            --text-secondary: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-dark);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: #121214;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .btn-voltar {
            color: #fff;
            text-decoration: none;
            background: #222;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn-voltar:hover {
            background: #333;
        }

        .player-container {
            padding: 30px 5%;
            max-width: 1100px;
            margin: 0 auto;
        }

        .player-title {
            margin-bottom: 20px;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        .video-wrapper iframe,
        .video-wrapper video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            background: #000;
            color: #aaa;
            z-index: 5;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 4px solid #333;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: girar 0.8s linear infinite;
        }

        @keyframes girar {
            to {
                transform: rotate(360deg);
            }
        }

        .erro-player {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            padding: 30px;
            text-align: center;
            background: #050505;
            color: #ff6b6b;
        }

        .erro-player strong {
            font-size: 1.1rem;
        }

        .erro-player small {
            color: #888;
            max-width: 700px;
            word-break: break-word;
        }

        .player-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-secondary {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-secondary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .info-player {
            margin-top: 15px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        @media (max-width: 700px) {

            .navbar {
                padding: 12px 4%;
            }

            .logo {
                font-size: 1.15rem;
            }

            .player-container {
                padding: 20px 4%;
            }

            .player-title {
                font-size: 1.35rem;
            }

        }

    </style>

</head>

<body>

<header class="navbar">

    <div class="logo">
        V8 Play+
    </div>

    <a
        href="index.html"
        class="btn-voltar"
    >
        Voltar ao Catálogo
    </a>

</header>


<main class="player-container">

    <h1
        id="player-title"
        class="player-title"
    >
        Carregando título...
    </h1>


    <div
        class="video-wrapper"
        id="video-container"
    >

        <div
            class="loading"
            id="loading"
        >

            <div class="spinner"></div>

            <span>
                Carregando vídeo...
            </span>

        </div>

    </div>


    <div class="player-actions">

        <button
            id="btn-download-file"
            class="btn-secondary"
            disabled
        >
            Baixar Conteúdo
        </button>

    </div>


    <div
        class="info-player"
        id="player-info"
    >
        V8 Play+
    </div>

</main>


<script type="module">

    // =====================================================
    // FIREBASE
    // =====================================================

    import { db } from "./js/firebase.js";

    import {
        doc,
        getDoc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


    // =====================================================
    // ELEMENTOS
    // =====================================================

    const container =
        document.getElementById(
            "video-container"
        );

    const titleEl =
        document.getElementById(
            "player-title"
        );

    const loading =
        document.getElementById(
            "loading"
        );

    const btnDownload =
        document.getElementById(
            "btn-download-file"
        );

    const playerInfo =
        document.getElementById(
            "player-info"
        );


    // =====================================================
    // URL
    // =====================================================

    const params =
        new URLSearchParams(
            window.location.search
        );


    const itemId =
        params.get("id");


    const colecao =
        params.get("colecao");


    const modoTrailer =
        params.get("trailer") === "true";


    console.log(
        "================================="
    );

    console.log(
        "🎬 V8 PLAY+ PLAYER"
    );

    console.log(
        "ID:",
        itemId
    );

    console.log(
        "COLEÇÃO:",
        colecao
    );

    console.log(
        "TRAILER:",
        modoTrailer
    );

    console.log(
        "================================="
    );


    // =====================================================
    // VARIÁVEIS
    // =====================================================

    let downloadUrl =
        "";

    let tituloAtual =
        "Vídeo V8 Play+";


    // =====================================================
    // LIMPAR LINK
    // =====================================================

    function limparUrl(url) {

        if (!url) {
            return "";
        }

        return String(url)
            .trim()
            .replace(/^["']|["']$/g, "");

    }


    // =====================================================
    // YOUTUBE
    // =====================================================

    function extrairYoutubeId(url) {

        if (!url) {
            return null;
        }

        let valor =
            limparUrl(url);


        // ID direto
        if (
            /^[A-Za-z0-9_-]{11}$/.test(valor)
        ) {

            return valor;

        }


        try {

            const urlObj =
                new URL(valor);


            const host =
                urlObj.hostname
                    .toLowerCase()
                    .replace(/^www\./, "")
                    .replace(/^m\./, "");


            // ---------------------------------------------
            // youtube.com
            // ---------------------------------------------

            if (
                host === "youtube.com" ||
                host === "youtube-nocookie.com"
            ) {

                // watch?v=
                const watchId =
                    urlObj.searchParams.get(
                        "v"
                    );


                if (watchId) {

                    return watchId;

                }


                // /embed/ID
                const embed =
                    urlObj.pathname.match(
                        /\/embed\/([^/?]+)/i
                    );


                if (embed) {

                    return embed[1];

                }


                // /shorts/ID
                const shorts =
                    urlObj.pathname.match(
                        /\/shorts\/([^/?]+)/i
                    );


                if (shorts) {

                    return shorts[1];

                }


                // /live/ID
                const live =
                    urlObj.pathname.match(
                        /\/live\/([^/?]+)/i
                    );


                if (live) {

                    return live[1];

                }

            }


            // ---------------------------------------------
            // youtu.be
            // ---------------------------------------------

            if (
                host === "youtu.be"
            ) {

                const partes =
                    urlObj.pathname
                        .split("/")
                        .filter(Boolean);


                if (partes[0]) {

                    return partes[0];

                }

            }

        }

        catch (erro) {

            console.warn(
                "⚠️ URL não pôde ser analisada:",
                erro
            );

        }


        return null;

    }


    // =====================================================
    // É YOUTUBE?
    // =====================================================

    function ehYoutube(url) {

        if (!url) {
            return false;
        }

        const texto =
            limparUrl(url)
                .toLowerCase();


        return (
            texto.includes(
                "youtube.com"
            ) ||
            texto.includes(
                "youtu.be"
            )
        );

    }


    // =====================================================
    // ARQUIVO DE VÍDEO
    // =====================================================

    function ehArquivoVideo(url) {

        if (!url) {
            return false;
        }


        const texto =
            limparUrl(url)
                .toLowerCase();


        const semHash =
            texto.split("#")[0];


        const semQuery =
            semHash.split("?")[0];


        return (
            semQuery.endsWith(".mp4") ||
            semQuery.endsWith(".webm") ||
            semQuery.endsWith(".ogg") ||
            semQuery.endsWith(".mov") ||
            semQuery.endsWith(".m4v") ||
            semQuery.endsWith(".m3u8")
        );

    }


    // =====================================================
    // ERRO
    // =====================================================

    function mostrarErro(
        mensagem,
        detalhe = ""
    ) {

        console.error(
            "❌",
            mensagem,
            detalhe
        );


        if (loading) {

            loading.remove();

        }


        container.innerHTML = "";


        const erro =
            document.createElement(
                "div"
            );


        erro.className =
            "erro-player";


        erro.innerHTML = `

            <strong>
                ⚠️ ${mensagem}
            </strong>

            ${
                detalhe
                    ? `
                        <small>
                            ${detalhe}
                        </small>
                    `
                    : ""
            }

        `;


        container.appendChild(
            erro
        );

    }


    // =====================================================
    // ABRIR YOUTUBE
    // =====================================================

    function abrirYoutube(
        youtubeId
    ) {

        console.log(
            "▶️ ID YouTube:",
            youtubeId
        );


        const iframe =
            document.createElement(
                "iframe"
            );


        iframe.src =
            `https://www.youtube.com/embed/${encodeURIComponent(youtubeId)}?autoplay=1&rel=0&modestbranding=1`;


        iframe.title =
            tituloAtual;


        iframe.allow =
            "autoplay; encrypted-media; picture-in-picture; fullscreen";


        iframe.allowFullscreen =
            true;


        iframe.referrerPolicy =
            "strict-origin-when-cross-origin";


        loading?.remove();


        container.innerHTML =
            "";


        container.appendChild(
            iframe
        );


        playerInfo.innerText =
            "Player YouTube";


        console.log(
            "✅ YouTube carregado."
        );

    }


    // =====================================================
    // ABRIR MP4
    // =====================================================

    function abrirVideo(
        url
    ) {

        console.log(
            "🎥 Abrindo vídeo:",
            url
        );


        const video =
            document.createElement(
                "video"
            );


        video.controls =
            true;

        video.autoplay =
            true;

        video.playsInline =
            true;

        video.preload =
            "metadata";

        video.src =
            url;


        video.addEventListener(
            "loadedmetadata",
            () => {

                console.log(
                    "✅ Vídeo carregado."
                );

                loading?.remove();

            }
        );


        video.addEventListener(
            "canplay",
            () => {

                loading?.remove();

            }
        );


        video.addEventListener(
            "error",
            () => {

                console.error(
                    "❌ Erro no vídeo:",
                    video.error
                );


                mostrarErro(
                    "Não foi possível reproduzir o vídeo.",
                    "O endereço do arquivo pode estar inválido ou o servidor pode bloquear a reprodução."
                );

            }
        );


        loading?.remove();


        container.innerHTML =
            "";


        container.appendChild(
            video
        );


        playerInfo.innerText =
            "Vídeo direto";


        video.play()
            .catch(
                erro => {

                    console.warn(
                        "Autoplay bloqueado pelo navegador:",
                        erro
                    );

                }
            );

    }


    // =====================================================
    // PLAYER EXTERNO
    // =====================================================

    function abrirPlayerExterno(
        url
    ) {

        console.log(
            "🌐 Player externo:",
            url
        );


        const iframe =
            document.createElement(
                "iframe"
            );


        iframe.src =
            url;


        iframe.title =
            tituloAtual;


        iframe.allow =
            "autoplay; fullscreen; encrypted-media; picture-in-picture";


        iframe.allowFullscreen =
            true;


        iframe.referrerPolicy =
            "strict-origin-when-cross-origin";


        loading?.remove();


        container.innerHTML =
            "";


        container.appendChild(
            iframe
        );


        playerInfo.innerText =
            "Player externo";

    }


    // =====================================================
    // ABRIR MÍDIA
    // =====================================================

    function abrirMidia(
        url
    ) {

        const link =
            limparUrl(url);


        console.log(
            "🔗 Link final:",
            link
        );


        if (!link) {

            mostrarErro(
                modoTrailer
                    ? "Este título não possui trailer cadastrado."
                    : "Este título não possui vídeo cadastrado."
            );

            return;

        }


        // -------------------------------------------------
        // YOUTUBE
        // -------------------------------------------------

        if (
            ehYoutube(link)
        ) {

            const youtubeId =
                extrairYoutubeId(
                    link
                );


            if (!youtubeId) {

                mostrarErro(
                    "Link do YouTube inválido.",
                    link
                );

                return;

            }


            abrirYoutube(
                youtubeId
            );

            return;

        }


        // -------------------------------------------------
        // MP4 / WEBM / ETC
        // -------------------------------------------------

        if (
            ehArquivoVideo(link)
        ) {

            abrirVideo(
                link
            );

            return;

        }


        // -------------------------------------------------
        // OUTRO PLAYER
        // -------------------------------------------------

        abrirPlayerExterno(
            link
        );

    }


    // =====================================================
    // DOWNLOAD
    // =====================================================

    function configurarDownload() {

        if (
            modoTrailer ||
            !downloadUrl
        ) {

            btnDownload.disabled =
                true;

            return;

        }


        btnDownload.disabled =
            false;


        btnDownload.onclick =
            () => {

                const url =
                    limparUrl(
                        downloadUrl
                    );


                if (!url) {
                    return;
                }


                window.open(
                    url,
                    "_blank",
                    "noopener,noreferrer"
                );

            };

    }


    // =====================================================
    // CARREGAR FILME
    // =====================================================

    async function carregarFilme() {

        if (!itemId) {

            mostrarErro(
                "ID do filme não informado.",
                "A URL do player não possui o parâmetro id."
            );

            return;

        }


        if (!colecao) {

            mostrarErro(
                "Coleção não informada.",
                "A URL do player não possui o parâmetro colecao."
            );

            return;

        }


        try {

            console.log(
                "🔥 Buscando Firestore:"
            );

            console.log(
                `Coleção: ${colecao}`
            );

            console.log(
                `Documento: ${itemId}`
            );


            const referencia =
                doc(
                    db,
                    colecao,
                    itemId
                );


            const snapshot =
                await getDoc(
                    referencia
                );


            if (
                !snapshot.exists()
            ) {

                mostrarErro(
                    "Filme não encontrado.",
                    `${colecao}/${itemId}`
                );

                return;

            }


            const item =
                snapshot.data();


            console.log(
                "🎬 Filme encontrado:",
                item
            );


            // =================================================
            // TÍTULO
            // =================================================

            tituloAtual =
                item.titulo ||
                "V8 Play+";


            titleEl.innerText =
                tituloAtual;


            document.title =
                `${tituloAtual} - V8 Play+`;


            // =================================================
            // LINK DO VÍDEO
            // =================================================

            let videoUrl =
                "";


            if (
                modoTrailer
            ) {

                videoUrl =
                    item.trailer ||
                    item.videoTrailer ||
                    "";


            }

            else {

                /*
                 * ORDEM DE PRIORIDADE
                 *
                 * video
                 * video1
                 * video2
                 * video3
                 * embed
                 */

                videoUrl =
                    item.video ||
                    item.video1 ||
                    item.video2 ||
                    item.video3 ||
                    item.embed ||
                    "";

            }


            // =================================================
            // DOWNLOAD
            // =================================================

            downloadUrl =
                item.arquivoDownload ||
                "";


            console.log(
                "🎥 URL DO VÍDEO:",
                videoUrl
            );


            console.log(
                "⬇️ DOWNLOAD:",
                downloadUrl
            );


            if (!videoUrl) {

                mostrarErro(
                    modoTrailer
                        ? "Trailer não cadastrado."
                        : "Vídeo não cadastrado neste título.",
                    `Documento: ${itemId}`
                );

                return;

            }


            // =================================================
            // ABRIR
            // =================================================

            abrirMidia(
                videoUrl
            );


            configurarDownload();

        }

        catch (erro) {

            console.error(
                "❌ Erro ao carregar filme:",
                erro
            );


            mostrarErro(
                "Erro ao carregar o filme.",
                erro.message ||
                String(erro)
            );

        }

    }


    // =====================================================
    // INICIAR
    // =====================================================

    carregarFilme();

</script>

</body>

</html>
