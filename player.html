<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>V8 Play+ | Player</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <style>

        :root {

            --primary: #9C4DFF;
            --primary-hover: #B97CFF;

            --background: #08070C;
            --surface: #121216;
            --surface2: #1A1721;

            --text: #FFFFFF;
            --text2: #AAAAAA;

            --danger: #ff4757;
            --success: #2ed573;

            --radius: 14px;

        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {

            width: 100%;
            min-height: 100%;

            background: var(--background);

        }

        body {

            min-height: 100vh;

            color: var(--text);

            font-family:
                "Poppins",
                sans-serif;

            overflow-x: hidden;

        }

        button {
            font-family: inherit;
        }

        .hidden {
            display: none !important;
        }


        /* =========================================
           HEADER
        ========================================= */

        header {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 70px;

            display: flex;

            align-items: center;

            gap: 15px;

            padding: 10px 5%;

            z-index: 1000;

            background:
                linear-gradient(
                    to bottom,
                    rgba(8,7,12,.98),
                    rgba(8,7,12,.86)
                );

            backdrop-filter: blur(10px);

            -webkit-backdrop-filter: blur(10px);

            border-bottom:
                1px solid
                rgba(255,255,255,.06);

        }


        .btn-voltar {

            width: 42px;
            height: 42px;

            border: none;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                rgba(255,255,255,.08);

            color: white;

            cursor: pointer;

            transition: .2s;

            flex-shrink: 0;

        }

        .btn-voltar:hover {

            background: var(--primary);

            color: #000;

            transform:
                translateX(-2px);

        }


        .logo {

            display: flex;

            align-items: center;

            text-decoration: none;

            color: white;

            font-size: 1.3rem;

            font-weight: 800;

        }

        .logo span {

            color: var(--primary);

        }


        .logo-img {

            height: 40px;

            width: auto;

            object-fit: contain;

            margin-right: 8px;

        }


        /* =========================================
           MAIN
        ========================================= */

        main {

            width: 100%;

            min-height: 100vh;

            padding-top: 70px;

        }


        .player-wrapper {

            width: 100%;

            max-width: 1400px;

            margin: 0 auto;

            padding:
                20px
                4%
                50px;

        }


        /* =========================================
           PLAYER
        ========================================= */

        .player-container {

            position: relative;

            width: 100%;

            aspect-ratio: 16 / 9;

            background: #000;

            border-radius: var(--radius);

            overflow: hidden;

            border:
                1px solid
                rgba(255,255,255,.07);

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.6);

        }


        #videoPlayer,
        #youtubePlayer,
        #iframePlayer {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            border: 0;

            background: #000;

        }


        #videoPlayer {

            object-fit: contain;

        }


        /* =========================================
           LOADING
        ========================================= */

        #loading {

            position: absolute;

            inset: 0;

            z-index: 50;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 15px;

            background:
                rgba(0,0,0,.92);

        }


        .spinner {

            width: 48px;
            height: 48px;

            border-radius: 50%;

            border:
                4px solid
                rgba(255,255,255,.12);

            border-top-color:
                var(--primary);

            animation:
                girar .8s linear infinite;

        }


        @keyframes girar {

            to {
                transform: rotate(360deg);
            }

        }


        #loadingText {

            color: #aaa;

            font-size: .9rem;

            text-align: center;

            padding: 0 20px;

        }


        /* =========================================
           ERRO
        ========================================= */

        #erroPlayer {

            position: absolute;

            inset: 0;

            z-index: 60;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

            text-align: center;

            background:
                rgba(0,0,0,.97);

        }


        .erro-box {

            width: 100%;

            max-width: 520px;

        }


        .erro-box i {

            display: block;

            font-size: 48px;

            color: var(--danger);

            margin-bottom: 15px;

        }


        .erro-box h2 {

            font-size: 1.3rem;

            margin-bottom: 10px;

        }


        .erro-box p {

            color: #aaa;

            font-size: .9rem;

            line-height: 1.6;

            margin-bottom: 20px;

        }


        .btn-retry {

            border: none;

            background: var(--primary);

            color: white;

            padding:
                11px
                22px;

            border-radius: 7px;

            font-weight: 700;

            cursor: pointer;

            transition: .2s;

        }


        .btn-retry:hover {

            background:
                var(--primary-hover);

            transform:
                translateY(-1px);

        }


        /* =========================================
           INFO
        ========================================= */

        .info {

            padding:
                25px
                0
                0;

        }


        .info h1 {

            font-size: 1.8rem;

            font-weight: 700;

            line-height: 1.2;

            margin-bottom: 8px;

        }


        .meta {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            color: var(--text2);

            font-size: .85rem;

            margin-bottom: 15px;

        }


        .descricao {

            max-width: 900px;

            color: #ccc;

            font-size: .92rem;

            line-height: 1.7;

        }


        .trailer-badge {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding:
                5px
                10px;

            margin-bottom: 12px;

            border-radius: 5px;

            background:
                rgba(156,77,255,.1);

            border:
                1px solid
                rgba(156,77,255,.3);

            color:
                var(--primary-hover);

            font-size: .72rem;

            font-weight: 700;

            text-transform: uppercase;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            header {

                height: 60px;

                padding:
                    8px 4%;

            }

            main {

                padding-top: 60px;

            }

            .btn-voltar {

                width: 38px;
                height: 38px;

            }

            .logo {

                font-size: 1.05rem;

            }

            .logo-img {

                height: 34px;

            }

            .player-wrapper {

                padding:
                    10px
                    0
                    35px;

            }

            .player-container {

                border-radius: 0;

                border-left: none;
                border-right: none;

            }

            .info {

                padding:
                    20px
                    4%
                    40px;

            }

            .info h1 {

                font-size: 1.4rem;

            }

            .descricao {

                font-size: .85rem;

            }

        }


        @media (max-width: 430px) {

            .logo span {
                display: none;
            }

            .logo-img {
                margin-right: 0;
            }

        }

    </style>

</head>


<body>


<header>

    <button
        class="btn-voltar"
        id="btnVoltar"
        type="button"
        aria-label="Voltar"
        title="Voltar"
    >

        <i class="fa-solid fa-arrow-left"></i>

    </button>


    <a
        href="index.html"
        class="logo"
    >

        <img
            src="assets/v8p.png"
            class="logo-img"
            alt="V8 Play+"
            onerror="this.style.display='none'"
        >

        <span>
            V8 Play+
        </span>

    </a>

</header>


<main>

    <div class="player-wrapper">


        <!-- =====================================
             PLAYER
        ====================================== -->

        <div class="player-container">


            <!-- LOADING -->

            <div
                id="loading"
            >

                <div
                    class="spinner"
                ></div>

                <div
                    id="loadingText"
                >
                    Carregando conteúdo...
                </div>

            </div>


            <!-- HTML5 -->

            <video
                id="videoPlayer"
                class="hidden"
                controls
                playsinline
                preload="metadata"
            ></video>


            <!-- YOUTUBE -->

            <iframe
                id="youtubePlayer"
                class="hidden"
                title="YouTube Player"
                allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"
            ></iframe>


            <!-- PLAYER EXTERNO / ABYSS -->

            <iframe
                id="iframePlayer"
                class="hidden"
                title="Player externo"
                allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"
            ></iframe>


            <!-- ERRO -->

            <div
                id="erroPlayer"
                class="hidden"
            >

                <div
                    class="erro-box"
                >

                    <i
                        class="fa-solid fa-circle-exclamation"
                    ></i>


                    <h2>
                        Não foi possível carregar o vídeo
                    </h2>


                    <p
                        id="erroTexto"
                    >
                        Verifique o endereço do vídeo ou tente novamente.
                    </p>


                    <button
                        class="btn-retry"
                        id="btnRetry"
                        type="button"
                    >

                        <i
                            class="fa-solid fa-rotate"
                        ></i>

                        Tentar novamente

                    </button>

                </div>

            </div>

        </div>


        <!-- =====================================
             INFORMAÇÕES
        ====================================== -->

        <div class="info">


            <div
                id="trailerBadge"
                class="trailer-badge hidden"
            >

                <i
                    class="fa-solid fa-film"
                ></i>

                Trailer

            </div>


            <h1
                id="titulo"
            >
                Carregando...
            </h1>


            <div
                class="meta"
            >

                <span
                    id="ano"
                ></span>

                <span
                    id="separadorAno"
                >
                    •
                </span>

                <span
                    id="categoria"
                ></span>

            </div>


            <p
                class="descricao"
                id="descricao"
            >
                Carregando informações...
            </p>

        </div>

    </div>

</main>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import { db } from "./js/firebase.js";

import {
    doc,
    getDoc
}
from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =====================================================
   CONFIGURAÇÃO
===================================================== */

/*
   Servidor Abyss.

   Se futuramente trocar de servidor,
   altere somente esta URL.
*/

const ABYSS_PLAYER =
    "https://player.abyssplayer.com";


/* =====================================================
   ELEMENTOS
===================================================== */

const videoPlayer =
    document.getElementById(
        "videoPlayer"
    );

const youtubePlayer =
    document.getElementById(
        "youtubePlayer"
    );

const iframePlayer =
    document.getElementById(
        "iframePlayer"
    );

const loading =
    document.getElementById(
        "loading"
    );

const loadingText =
    document.getElementById(
        "loadingText"
    );

const erroPlayer =
    document.getElementById(
        "erroPlayer"
    );

const erroTexto =
    document.getElementById(
        "erroTexto"
    );

const titulo =
    document.getElementById(
        "titulo"
    );

const ano =
    document.getElementById(
        "ano"
    );

const categoria =
    document.getElementById(
        "categoria"
    );

const descricao =
    document.getElementById(
        "descricao"
    );

const trailerBadge =
    document.getElementById(
        "trailerBadge"
    );

const btnVoltar =
    document.getElementById(
        "btnVoltar"
    );

const btnRetry =
    document.getElementById(
        "btnRetry"
    );

const separadorAno =
    document.getElementById(
        "separadorAno"
    );


/* =====================================================
   PARÂMETROS DA URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const itemId =
    params.get("id") || "";


const colecao =
    params.get("colecao") || "";


const videoURL =
    params.get("video") || "";


const tituloURL =
    params.get("title") || "";


const isTrailer =
    params.get("trailer") === "true";


/* =====================================================
   ESTADO
===================================================== */

let itemAtual = null;


/* =====================================================
   LIMPAR URL
===================================================== */

function limpar(valor) {

    if (!valor)
        return "";

    return String(valor).trim();

}


/* =====================================================
   LOADING
===================================================== */

function mostrarLoading(
    texto = "Carregando..."
) {

    loadingText.textContent =
        texto;

    loading.classList.remove(
        "hidden"
    );

    erroPlayer.classList.add(
        "hidden"
    );

}


function esconderLoading() {

    loading.classList.add(
        "hidden"
    );

}


/* =====================================================
   ERRO
===================================================== */

function mostrarErro(
    mensagem
) {

    esconderLoading();

    erroTexto.textContent =
        mensagem ||
        "Não foi possível carregar o conteúdo.";

    erroPlayer.classList.remove(
        "hidden"
    );

}


/* =====================================================
   ESCONDER TODOS OS PLAYERS
===================================================== */

function esconderPlayers() {

    try {

        videoPlayer.pause();

    } catch (e) {}


    videoPlayer.removeAttribute(
        "src"
    );

    videoPlayer.load();

    videoPlayer.classList.add(
        "hidden"
    );


    youtubePlayer.src =
        "about:blank";

    youtubePlayer.classList.add(
        "hidden"
    );


    iframePlayer.src =
        "about:blank";

    iframePlayer.classList.add(
        "hidden"
    );

}


/* =====================================================
   YOUTUBE ID
===================================================== */

function extrairYoutubeID(
    valor
) {

    valor =
        limpar(valor);

    if (!valor)
        return null;


    /*
       ID direto
    */

    if (
        /^[a-zA-Z0-9_-]{11}$/
            .test(valor)
    ) {

        return valor;

    }


    try {

        const url =
            new URL(valor);

        const host =
            url.hostname.toLowerCase();


        /*
           youtu.be
        */

        if (
            host === "youtu.be"
        ) {

            const partes =
                url.pathname
                    .split("/")
                    .filter(Boolean);

            return partes[0] || null;

        }


        /*
           youtube.com
        */

        if (
            host === "youtube.com" ||
            host === "www.youtube.com" ||
            host.endsWith(".youtube.com")
        ) {

            const v =
                url.searchParams.get("v");

            if (v)
                return v;


            const partes =
                url.pathname
                    .split("/")
                    .filter(Boolean);


            const tipos = [
                "embed",
                "shorts",
                "live"
            ];


            for (
                const tipo of tipos
            ) {

                const index =
                    partes.indexOf(
                        tipo
                    );


                if (
                    index !== -1 &&
                    partes[index + 1]
                ) {

                    return partes[
                        index + 1
                    ];

                }

            }

        }

    }

    catch (e) {}

    return null;

}


/* =====================================================
   EXTRAIR SRC DO IFRAME
===================================================== */

function extrairIframeSrc(
    valor
) {

    if (!valor)
        return "";


    const texto =
        String(valor).trim();


    /*
       Se o administrador colou:

       <iframe src="https://...">
    */

    const match =
        texto.match(
            /<iframe[^>]*src\s*=\s*["']([^"']+)["']/i
        );


    if (match) {

        return match[1].trim();

    }


    return "";

}


/* =====================================================
   SLUG ABYSS
===================================================== */

function pareceSlug(
    valor
) {

    valor =
        limpar(valor);


    if (!valor)
        return false;


    /*
       Exemplo:

       P8Gb3PlIes
    */

    return /^[a-zA-Z0-9_-]{6,100}$/
        .test(valor);

}


/* =====================================================
   CONSTRUIR ABYSS
===================================================== */

function construirAbyss(
    slug
) {

    slug =
        limpar(slug);


    if (!slug)
        return "";


    return (
        ABYSS_PLAYER.replace(
            /\/+$/,
            ""
        )
        +
        "/"
        +
        encodeURIComponent(slug)
    );

}


/* =====================================================
   IDENTIFICAR TIPO
===================================================== */

function detectarTipo(
    valor
) {

    valor =
        limpar(valor);


    if (!valor)
        return "nenhum";


    /*
       IFRAME HTML
    */

    if (
        /<iframe/i.test(valor)
    ) {

        return "iframe";

    }


    /*
       YOUTUBE
    */

    if (
        extrairYoutubeID(valor)
    ) {

        return "youtube";

    }


    /*
       URL
    */

    if (
        /^https?:\/\//i
            .test(valor)
    ) {

        const lower =
            valor.toLowerCase();


        /*
           Vídeo direto
        */

        if (
            /\.(mp4|webm|ogg)(\?|#|$)/
                .test(lower)
        ) {

            return "video";

        }


        /*
           HLS
        */

        if (
            /\.m3u8(\?|#|$)/
                .test(lower)
        ) {

            return "video";

        }


        /*
           Todo outro endereço
           será tratado como iframe.

           Isso inclui:

           Abyss
           Hydrax
           outros players
        */

        return "iframe";

    }


    /*
       Slug
    */

    if (
        pareceSlug(valor)
    ) {

        return "abyss";

    }


    return "nenhum";

}


/* =====================================================
   YOUTUBE
===================================================== */

function carregarYoutube(
    valor
) {

    const id =
        extrairYoutubeID(valor);


    if (!id) {

        mostrarErro(
            "O endereço do YouTube não é válido."
        );

        return;

    }


    esconderPlayers();

    mostrarLoading(
        "Carregando YouTube..."
    );


    youtubePlayer.classList.remove(
        "hidden"
    );


    const parametros =
        new URLSearchParams({

            autoplay: "1",

            rel: "0",

            playsinline: "1",

            modestbranding: "1"

        });


    youtubePlayer.src =
        "https://www.youtube.com/embed/"
        +
        encodeURIComponent(id)
        +
        "?"
        +
        parametros.toString();


    youtubePlayer.onload =
        () => {

            esconderLoading();

        };


    setTimeout(
        esconderLoading,
        4000
    );

}


/* =====================================================
   PLAYER EXTERNO
===================================================== */

function carregarIframe(
    valor
) {

    let url =
        limpar(valor);


    /*
       Se veio código iframe,
       extrair apenas o src.
    */

    const iframeSrc =
        extrairIframeSrc(url);


    if (iframeSrc) {

        url =
            iframeSrc;

    }


    /*
       Se for somente slug Abyss,
       construir URL.
    */

    if (
        pareceSlug(url)
    ) {

        url =
            construirAbyss(url);

    }


    if (!url) {

        mostrarErro(
            "Endereço do player não encontrado."
        );

        return;

    }


    console.log(
        "🎬 Player externo:",
        url
    );


    esconderPlayers();

    mostrarLoading(
        "Carregando player..."
    );


    iframePlayer.classList.remove(
        "hidden"
    );


    /*
       NÃO usamos sandbox.

       Isso evita o problema:

       allow-scripts + allow-same-origin
    */

    iframePlayer.removeAttribute(
        "sandbox"
    );


    iframePlayer.src =
        url;


    iframePlayer.onload =
        () => {

            console.log(
                "✅ Iframe carregado"
            );

            esconderLoading();

        };


    /*
       Alguns players externos
       não enviam corretamente o evento
       de carregamento.

       Então liberamos a tela após alguns segundos.
    */

    setTimeout(
        () => {

            esconderLoading();

        },
        5000
    );

}


/* =====================================================
   HTML5
===================================================== */

function carregarVideo(
    url
) {

    url =
        limpar(url);


    if (!url) {

        mostrarErro(
            "URL do vídeo não encontrada."
        );

        return;

    }


    esconderPlayers();

    mostrarLoading(
        "Carregando vídeo..."
    );


    videoPlayer.classList.remove(
        "hidden"
    );


    videoPlayer.onloadedmetadata =
        () => {

            esconderLoading();

        };


    videoPlayer.oncanplay =
        () => {

            esconderLoading();

        };


    videoPlayer.onerror =
        () => {

            console.error(
                "Erro HTML5:",
                videoPlayer.error
            );


            mostrarErro(
                "O vídeo direto não pôde ser reproduzido. Verifique se o endereço é um arquivo de vídeo válido."
            );

        };


    videoPlayer.src =
        url;


    videoPlayer.load();

}


/* =====================================================
   ABRIR PLAYER
===================================================== */

function abrirVideo(
    valor
) {

    valor =
        limpar(valor);


    if (!valor) {

        mostrarErro(
            isTrailer
                ? "Este conteúdo não possui trailer."
                : "Este conteúdo não possui vídeo."
        );

        return;

    }


    console.log(
        "🎬 Valor:",
        valor
    );


    const tipo =
        detectarTipo(valor);


    console.log(
        "🎥 Tipo:",
        tipo
    );


    switch (tipo) {


        case "youtube":

            carregarYoutube(
                valor
            );

            break;


        case "iframe":

            carregarIframe(
                valor
            );

            break;


        case "abyss":

            carregarIframe(
                construirAbyss(valor)
            );

            break;


        case "video":

            carregarVideo(
                valor
            );

            break;


        default:

            mostrarErro(
                "Formato de vídeo não reconhecido."
            );

    }

}


/* =====================================================
   FIRESTORE
===================================================== */

async function carregarFirestore() {

    if (
        !itemId ||
        !colecao
    ) {

        return null;

    }


    try {

        console.log(
            "🔥 Firestore:",
            colecao,
            itemId
        );


        const referencia =
            doc(
                db,
                colecao,
                itemId
            );


        const snap =
            await getDoc(
                referencia
            );


        if (!snap.exists()) {

            console.warn(
                "Documento não encontrado."
            );

            return null;

        }


        const dados =
            snap.data();


        console.log(
            "✅ Conteúdo:",
            dados
        );


        return {

            id: snap.id,

            colecao,

            ...dados

        };

    }

    catch (erro) {

        console.error(
            "❌ Firestore:",
            erro
        );

        return null;

    }

}


/* =====================================================
   OBTER VÍDEO DO FIRESTORE
===================================================== */

function obterVideo(
    item
) {

    if (!item)
        return "";


    /*
       TRAILER
    */

    if (isTrailer) {

        return limpar(

            item.trailer ||

            item.videoTrailer ||

            item.trailerUrl ||

            item.urlTrailer ||

            item.video_trailer ||

            ""

        );

    }


    /*
       PRIORIDADE:

       video
       video1
       video2
       video3
       embed
       urlVideo
       videoUrl
       url
    */

    return limpar(

        item.video ||

        item.video1 ||

        item.video2 ||

        item.video3 ||

        item.embed ||

        item.urlVideo ||

        item.videoUrl ||

        item.url ||

        videoURL

    );

}


/* =====================================================
   INFORMAÇÕES DO FILME
===================================================== */

function preencherInformacoes(
    item
) {

    if (!item)
        return;


    itemAtual =
        item;


    titulo.textContent =
        item.titulo ||
        tituloURL ||
        "V8 Play+";


    ano.textContent =
        item.ano ||
        "";


    categoria.textContent =
        item.categoria ||
        item.tipo ||
        "";


    if (
        !ano.textContent ||
        !categoria.textContent
    ) {

        separadorAno.style.display =
            "none";

    }

    else {

        separadorAno.style.display =
            "";

    }


    descricao.textContent =
        item.descricao ||
        "Sem descrição disponível.";


    if (isTrailer) {

        trailerBadge.classList.remove(
            "hidden"
        );

    }

}


/* =====================================================
   BOTÃO VOLTAR
===================================================== */

if (btnVoltar) {

    btnVoltar.addEventListener(
        "click",
        () => {

            if (
                window.history.length > 1
            ) {

                window.history.back();

            }

            else {

                window.location.href =
                    "index.html";

            }

        }
    );

}


/* =====================================================
   RETRY
===================================================== */

if (btnRetry) {

    btnRetry.addEventListener(
        "click",
        () => {

            erroPlayer.classList.add(
                "hidden"
            );


            const url =
                obterVideo(
                    itemAtual
                );


            if (url) {

                abrirVideo(
                    url
                );

            }

            else {

                mostrarErro(
                    "Não foi possível localizar o vídeo."
                );

            }

        }
    );

}


/* =====================================================
   INICIAR
===================================================== */

async function iniciar() {

    console.log(
        "================================"
    );

    console.log(
        "🚀 V8 PLAY+ PLAYER"
    );

    console.log(
        "ID:",
        itemId
    );

    console.log(
        "Coleção:",
        colecao
    );

    console.log(
        "================================"
    );


    mostrarLoading(
        "Buscando conteúdo..."
    );


    /*
       1.
       Buscar Firestore
    */

    const item =
        await carregarFirestore();


    if (item) {

        preencherInformacoes(
            item
        );


        const video =
            obterVideo(
                item
            );


        if (!video) {

            mostrarErro(
                isTrailer
                    ? "Este conteúdo não possui trailer."
                    : "Este conteúdo não possui vídeo."
            );

            return;

        }


        abrirVideo(
            video
        );


        return;

    }


    /*
       2.
       URL direta
    */

    if (videoURL) {

        titulo.textContent =
            tituloURL ||
            "V8 Play+";


        abrirVideo(
            videoURL
        );


        return;

    }


    /*
       3.
       Nada encontrado
    */

    mostrarErro(
        "Não foi possível localizar o conteúdo solicitado."
    );

}


/* =====================================================
   EXECUTAR COM SEGURANÇA
===================================================== */

iniciar()
    .catch(
        erro => {

            console.error(
                "❌ Erro fatal:",
                erro
            );


            mostrarErro(
                "Ocorreu um erro ao iniciar o player."
            );

        }
    );


</script>
