<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player - V8 Play+</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        .video-wrapper iframe,
        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="bg-dark text-white">

    <!-- CABEÇALHO DO PLAYER -->
    <header class="navbar" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: #121214;">
        <div class="logo" style="font-weight: 800; font-size: 1.5rem; color: #00d4ff;">V8 Play+</div>
        <a href="index.html" class="btn-voltar" style="color: #fff; text-decoration: none; background: #222; padding: 8px 16px; border-radius: 6px;">Voltar ao Catálogo</a>
    </header>

    <!-- CONTAINER PRINCIPAL DO VÍDEO -->
    <main class="player-container" style="padding: 30px 5%; max-width: 1000px; margin: 0 auto;">
        <h1 id="player-title" class="player-title" style="margin-bottom: 20px; font-size: 1.8rem;">Carregando título...</h1>
        
        <div class="video-wrapper" id="video-container">
            <!-- O player será inserido aqui dinamicamente -->
        </div>

        <!-- AÇÕES DO PLAYER -->
        <div class="player-actions" style="margin-top: 20px;">
            <button id="btn-download-file" class="btn-secondary" style="background: #00d4ff; color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer;">Baixar Conteúdo</button>
        </div>
    </main>

    <!-- SCRIPT DE MANIPULAÇÃO DO PLAYER -->
    <script type="module">
        import { db } from "./js/firebase.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const urlParams = new URLSearchParams(window.location.search);
        const itemId = urlParams.get('id');
        const colecao = urlParams.get('colecao');
        const directVideoUrl = urlParams.get('video');
        const directTitle = urlParams.get('title');

        const container = document.getElementById('video-container');
        const titleEl = document.getElementById('player-title');
        const btnDownload = document.getElementById('btn-download-file');

        let downloadUrl = "";

        async function inicializarPlayer() {
            let tituloFinal = "Vídeo V8 Play+";
            let linkMidia = "";

            if (itemId && colecao) {
                try {
                    const docRef = doc(db, colecao, itemId);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        tituloFinal = data.titulo || tituloFinal;
                        // Pega o link do embed, video1, video ou arquivo de download
                        linkMidia = data.embed || data.video1 || data.video || data.arquivoDownload;
                        downloadUrl = data.arquivoDownload || data.video1 || data.video;
                    }
                } catch (e) {
                    console.error("Erro ao buscar dados do vídeo:", e);
                }
            } else if (directVideoUrl) {
                linkMidia = decodeURIComponent(directVideoUrl);
                downloadUrl = linkMidia;
                if (directTitle) tituloFinal = decodeURIComponent(directTitle);
            }

            titleEl.innerText = tituloFinal;
            document.title = `${tituloFinal} - V8 Play+`;

            if (!linkMidia) {
                container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#ff6b6b;">Endereço do vídeo não encontrado.</div>`;
                return;
            }

            // LÓGICA INTELIGENTE: Verifica se é um arquivo de vídeo direto ou um link web/iframe
            const linkLimpo = linkMidia.trim();
            const ehArquivoDireto = linkLimpo.endsWith('.mp4') || linkLimpo.endsWith('.mkv') || linkLimpo.endsWith('.webm') || linkLimpo.endsWith('.mov');

            if (linkLimpo.includes('<iframe')) {
                container.innerHTML = linkLimpo;
            } else if (!ehArquivoDireto) {
                // Se NÃO for arquivo de vídeo direto (ex: Abyss, embeds, URLs web), renderiza como iframe perfeitamente!
                container.innerHTML = `<iframe src="${linkLimpo}" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>`;
            } else {
                // Apenas se for link direto de arquivo .mp4/.mkv
                container.innerHTML = `<video id="main-video" controls autoplay class="video-element" src="${linkLimpo}"></video>`;
            }

            // Configurar botão de download
            btnDownload.onclick = () => {
                if (downloadUrl && !downloadUrl.includes('abyss')) {
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = `${tituloFinal}.mp4`;
                    a.target = '_blank';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                } else {
                    alert("O download direto não está disponível para players externos do Abyss.");
                }
            };
        }

        inicializarPlayer();
    </script>
</body>
</html>
