<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>V8 Play+ | Player</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <style>

        :root {
            --primary: #00d4ff;
            --primary-hover: #00a2c7;

            --bg-dark: #080809;
            --bg-card: #121216;
            --bg-modal: #17171c;

            --text: #ffffff;
            --text-secondary: #aaa;

            --danger: #ff4d4d;

            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: var(--bg-dark);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        header {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            height: 70px;

            display: flex;

            align-items: center;

            gap: 15px;

            padding: 10px 5%;

            z-index: 1000;

            background:
                linear-gradient(
                    to bottom,
                    rgba(8,8,9,.97),
                    rgba(8,8,9,.75)
                );

            backdrop-filter: blur(10px);

            border-bottom:
                1px solid
                rgba(255,255,255,.05);
        }

        .btn-voltar {

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: none;

            border-radius: 50%;

            background:
                rgba(255,255,255,.08);

            color: white;

            cursor: pointer;

            font-size: 17px;

            transition: .2s;
        }

        .btn-voltar:hover {

            background: var(--primary);

            color: #000;

            transform: translateX(-2px);
        }

        .logo {

            display: flex;

            align-items: center;

            text-decoration: none;

            color: white;

            font-weight: 800;

            font-size: 1.35rem;
        }

        .logo span {

            color: var(--primary);
        }

        .logo-img {

            height: 40px;

            width: auto;

            object-fit: contain;

            margin-right: 8px;
        }

        /* =====================================================
           PLAYER
        ===================================================== */

        main {

            width: 100%;

            padding-top: 70px;

            min-height: 100vh;
        }

        .player-wrapper {

            width: 100%;

            max-width: 1400px;

            margin: 0 auto;

            padding: 20px 4% 0;
        }

        .player-container {

            width: 100%;

            aspect-ratio: 16 / 9;

            background: #000;

            border-radius: var(--radius);

            overflow: hidden;

            position: relative;

            box-shadow:
                0 15px 50px
                rgba(0,0,0,.55);

            border:
                1px solid
                rgba(255,255,255,.06);
        }

        video {

            width: 100%;
            height: 100%;

            display: block;

            background: #000;

            object-fit: contain;
        }

        iframe {

            width: 100%;
            height: 100%;

            border: none;

            display: block;

            background: #000;
        }

        /* =====================================================
           LOADING
        ===================================================== */

        #loading {

            position: absolute;

            inset: 0;

            z-index: 20;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            gap: 15px;

            background: #000;
        }

        #loading.hidden {

            display: none;
        }

        .spinner {

            width: 48px;
            height: 48px;

            border-radius: 50%;

            border:
                4px solid
                rgba(255,255,255,.15);

            border-top-color:
                var(--primary);

            animation:
                girar .8s linear infinite;
        }

        @keyframes girar {

            to {
                transform: rotate(360deg);
            }

        }

        #loadingText {

            color: #aaa;

            font-size: .9rem;

            text-align: center;
        }

        /* =====================================================
           ERRO
        ===================================================== */

        #erroPlayer {

            position: absolute;

            inset: 0;

            z-index: 30;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 25px;

            background:
                rgba(0,0,0,.94);
        }

        #erroPlayer.hidden {

            display: none;
        }

        .erro-box {

            max-width: 500px;
        }

        .erro-box i {

            font-size: 48px;

            color: var(--danger);

            margin-bottom: 15px;
        }

        .erro-box h2 {

            font-size: 1.35rem;

            margin-bottom: 10px;
        }

        .erro-box p {

            color: #aaa;

            font-size: .9rem;

            line-height: 1.6;

            margin-bottom: 20px;
        }

        .btn-retry {

            border: none;

            background: var(--primary);

            color: #000;

            padding: 10px 20px;

            border-radius: 6px;

            font-weight: 700;

            cursor: pointer;
        }

        /* =====================================================
           INFORMAÇÕES
        ===================================================== */

        .info {

            padding: 25px 0 50px;
        }

        .info h1 {

            font-size: 1.8rem;

            margin-bottom: 8px;

            font-weight: 700;
        }

        .meta {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            color: var(--text-secondary);

            font-size: .85rem;

            margin-bottom: 15px;
        }

        .meta span {

            display: inline-flex;

            align-items: center;

            gap: 5px;
        }

        .descricao {

            max-width: 850px;

            color: #ccc;

            line-height: 1.7;

            font-size: .92rem;
        }

        /* =====================================================
           AVISO TRAILER
        ===================================================== */

        .trailer-badge {

            display: inline-flex;

            align-items: center;

            gap: 6px;

            margin-bottom: 12px;

            padding: 5px 10px;

            border-radius: 5px;

            background:
                rgba(0,212,255,.12);

            border:
                1px solid
                rgba(0,212,255,.3);

            color:
                var(--primary);

            font-size: .72rem;

            font-weight: 700;

            text-transform: uppercase;
        }

        /* =====================================================
           NOTIFICAÇÃO
        ===================================================== */

        #notification {

            position: fixed;

            bottom: 25px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 5000;

            background: #1d1d22;

            border:
                1px solid
                var(--primary);

            color: white;

            padding: 12px 25px;

            border-radius: 30px;

            font-size: .85rem;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,.5);

            max-width: 90%;

            text-align: center;
        }

        .hidden {

            display: none !important;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            header {

                height: 60px;

                padding: 8px 4%;
            }

            main {

                padding-top: 60px;
            }

            .btn-voltar {

                width: 38px;
                height: 38px;
            }

            .logo {

                font-size: 1.05rem;
            }

            .logo-img {

                height: 34px;
            }

            .player-wrapper {

                padding:
                    10px 0 0;
            }

            .player-container {

                border-radius: 0;

                border-left: none;
                border-right: none;
            }

            .info {

                padding:
                    20px 4% 40px;
            }

            .info h1 {

                font-size: 1.4rem;
            }

            .descricao {

                font-size: .85rem;
            }

        }

    </style>
</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <button
        class="btn-voltar"
        id="btnVoltar"
        title="Voltar"
    >

        <i class="fa-solid fa-arrow-left"></i>

    </button>


    <a
        href="index.html"
        class="logo"
    >

        <img
            src="assets/v8p.png"
            class="logo-img"
            alt="V8 Play+"
            onerror="this.style.display='none'"
        >

        <span>
            V8 Play+
        </span>

    </a>

</header>


<!-- =========================================================
     CONTEÚDO
========================================================= -->

<main>

    <div class="player-wrapper">


        <!-- PLAYER -->

        <div class="player-container">


            <!-- LOADING -->

            <div id="loading">

                <div class="spinner"></div>

                <div id="loadingText">
                    Carregando vídeo...
                </div>

            </div>


            <!-- VIDEO MP4 -->

            <video
                id="videoPlayer"
                controls
                playsinline
                preload="metadata"
                class="hidden"
            ></video>


            <!-- YOUTUBE / EMBED -->

            <iframe
                id="youtubePlayer"
                class="hidden"
                allow="
                    autoplay;
                    encrypted-media;
                    picture-in-picture;
                    fullscreen
                "
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"
            ></iframe>


            <!-- ERRO -->

            <div
                id="erroPlayer"
                class="hidden"
            >

                <div class="erro-box">

                    <i
                        class="fa-solid fa-circle-exclamation"
                    ></i>

                    <h2>
                        Não foi possível carregar o vídeo
                    </h2>

                    <p id="erroTexto">
                        Verifique o endereço do vídeo
                        ou tente novamente.
                    </p>

                    <button
                        class="btn-retry"
                        id="btnRetry"
                    >
                        <i class="fa-solid fa-rotate"></i>
                        Tentar novamente
                    </button>

                </div>

            </div>

        </div>


        <!-- =================================================
             INFORMAÇÕES
        ================================================= -->

        <div class="info">

            <div
                id="trailerBadge"
                class="trailer-badge hidden"
            >

                <i class="fa-solid fa-film"></i>

                Trailer

            </div>


            <h1 id="titulo">
                Carregando...
            </h1>


            <div class="meta">

                <span id="ano"></span>

                <span id="separadorAno">
                    •
                </span>

                <span id="categoria"></span>

            </div>


            <p
                class="descricao"
                id="descricao"
            >
                Carregando informações...
            </p>

        </div>

    </div>

</main>


<!-- =========================================================
     NOTIFICAÇÃO
========================================================= -->

<div
    id="notification"
    class="hidden"
>

    <span id="notificationText"></span>

</div>


<!-- =========================================================
     FIREBASE + PLAYER
========================================================= -->

<script type="module">

    import {
        db
    } from "./js/firebase.js";

    import {
        doc,
        getDoc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


    // =====================================================
    // ELEMENTOS
    // =====================================================

    const videoPlayer =
        document.getElementById(
            "videoPlayer"
        );

    const youtubePlayer =
        document.getElementById(
            "youtubePlayer"
        );

    const loading =
        document.getElementById(
            "loading"
        );

    const loadingText =
        document.getElementById(
            "loadingText"
        );

    const erroPlayer =
        document.getElementById(
            "erroPlayer"
        );

    const erroTexto =
        document.getElementById(
            "erroTexto"
        );

    const titulo =
        document.getElementById(
            "titulo"
        );

    const ano =
        document.getElementById(
            "ano"
        );

    const categoria =
        document.getElementById(
            "categoria"
        );

    const descricao =
        document.getElementById(
            "descricao"
        );

    const trailerBadge =
        document.getElementById(
            "trailerBadge"
        );


    // =====================================================
    // URL
    // =====================================================

    const params =
        new URLSearchParams(
            window.location.search
        );


    const itemId =
        params.get("id") || "";


    const colecao =
        params.get("colecao") || "";


    const videoURL =
        params.get("video") || "";


    const tituloURL =
        params.get("title") || "";


    const isTrailer =
        params.get("trailer") === "true";


    // =====================================================
    // ESTADO
    // =====================================================

    let itemAtual = null;


    // =====================================================
    // NOTIFICAÇÃO
    // =====================================================

    function mostrarNotificacao(
        mensagem
    ) {

        const box =
            document.getElementById(
                "notification"
            );

        const text =
            document.getElementById(
                "notificationText"
            );

        text.innerText =
            mensagem;

        box.classList.remove(
            "hidden"
        );

        setTimeout(
            () => {

                box.classList.add(
                    "hidden"
                );

            },
            3500
        );

    }


    // =====================================================
    // LOADING
    // =====================================================

    function mostrarLoading(
        mensagem = "Carregando vídeo..."
    ) {

        loadingText.innerText =
            mensagem;

        loading.classList.remove(
            "hidden"
        );

        erroPlayer.classList.add(
            "hidden"
        );

    }


    function esconderLoading() {

        loading.classList.add(
            "hidden"
        );

    }


    // =====================================================
    // ERRO
    // =====================================================

    function mostrarErro(
        mensagem
    ) {

        esconderLoading();

        erroTexto.innerText =
            mensagem;

        erroPlayer.classList.remove(
            "hidden"
        );

    }


    // =====================================================
    // YOUTUBE ID
    // =====================================================

    function extrairYoutubeID(
        url
    ) {

        if (!url)
            return null;


        // ID puro de 11 caracteres

        if (
            /^[a-zA-Z0-9_-]{11}$/
                .test(url)
        ) {

            return url;

        }


        try {

            const parsed =
                new URL(url);


            // youtube.com/watch?v=

            if (
                parsed.hostname
                    .includes("youtube.com")
            ) {

                const v =
                    parsed.searchParams
                        .get("v");

                if (v)
                    return v;


                // /embed/ID

                const partes =
                    parsed.pathname
                        .split("/")
                        .filter(Boolean);

                const embedIndex =
                    partes.indexOf("embed");

                if (
                    embedIndex !== -1 &&
                    partes[embedIndex + 1]
                ) {

                    return partes[
                        embedIndex + 1
                    ];

                }


                // /shorts/ID

                const shortsIndex =
                    partes.indexOf("shorts");

                if (
                    shortsIndex !== -1 &&
                    partes[shortsIndex + 1]
                ) {

                    return partes[
                        shortsIndex + 1
                    ];

                }

            }


            // youtu.be/ID

            if (
                parsed.hostname
                    .includes("youtu.be")
            ) {

                return parsed.pathname
                    .replace("/", "")
                    .split("/")[0];

            }

        }

        catch (e) {

            console.warn(
                "URL inválida:",
                url
            );

        }


        // Regex adicional

        const match =
            String(url).match(
                /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/
            );

        return match
            ? match[1]
            : null;

    }


    // =====================================================
    // DETECTAR TIPO DE VÍDEO
    // =====================================================

    function detectarTipoVideo(
        url
    ) {

        if (!url)
            return "nenhum";


        const yt =
            extrairYoutubeID(url);

        if (yt)
            return "youtube";


        const lower =
            url.toLowerCase();


        if (
            lower.includes(".mp4") ||
            lower.includes(".webm") ||
            lower.includes(".ogg") ||
            lower.includes(".m3u8")
        ) {

            return "video";

        }


        if (
            lower.includes("embed") ||
            lower.includes("player")
        ) {

            return "iframe";

        }


        return "video";

    }


    // =====================================================
    // CARREGAR YOUTUBE
    // =====================================================

    function carregarYoutube(
        url
    ) {

        const id =
            extrairYoutubeID(url);


        if (!id) {

            mostrarErro(
                "O endereço do YouTube não é válido."
            );

            return;

        }


        videoPlayer.classList.add(
            "hidden"
        );

        youtubePlayer.classList.remove(
            "hidden"
        );


        youtubePlayer.src =
            `https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1`;


        youtubePlayer.onload =
            () => {

                esconderLoading();

            };


        // Segurança caso o onload não dispare

        setTimeout(
            () => {

                esconderLoading();

            },
            2500
        );

    }


    // =====================================================
    // CARREGAR VÍDEO
    // =====================================================

    function carregarVideo(
        url
    ) {

        youtubePlayer.src =
            "";

        youtubePlayer.classList.add(
            "hidden"
        );


        videoPlayer.classList.remove(
            "hidden"
        );


        videoPlayer.src =
            url;

        videoPlayer.load();


        videoPlayer.onloadedmetadata =
            () => {

                esconderLoading();

                console.log(
                    "✅ Vídeo carregado"
                );

            };


        videoPlayer.oncanplay =
            () => {

                esconderLoading();

            };


        videoPlayer.onerror =
            () => {

                console.error(
                    "❌ Erro no vídeo:",
                    videoPlayer.error
                );

                mostrarErro(
                    "O vídeo não pôde ser reproduzido. O link pode estar indisponível, bloqueado pelo servidor ou ser incompatível com o navegador."
                );

            };


        // Tentativa automática

        videoPlayer.play()
            .then(() => {

                console.log(
                    "▶️ Reprodução iniciada"
                );

            })
            .catch(() => {

                console.log(
                    "ℹ️ Reprodução automática bloqueada pelo navegador."
                );

                esconderLoading();

            });

    }


    // =====================================================
    // CARREGAR IFRAME
    // =====================================================

    function carregarIframe(
        url
    ) {

        videoPlayer.classList.add(
            "hidden"
        );

        youtubePlayer.classList.remove(
            "hidden"
        );


        youtubePlayer.src =
            url;


        youtubePlayer.onload =
            () => {

                esconderLoading();

            };


        setTimeout(
            () => {

                esconderLoading();

            },
            2500
        );

    }


    // =====================================================
    // ABRIR PLAYER
    // =====================================================

    function abrirVideo(
        url
    ) {

        if (!url) {

            mostrarErro(
                "Nenhum vídeo foi informado para este conteúdo."
            );

            return;

        }


        mostrarLoading();


        const tipo =
            detectarTipoVideo(url);


        console.log(
            "🎬 Tipo de vídeo:",
            tipo
        );

        console.log(
            "🔗 URL:",
            url
        );


        if (
            tipo === "youtube"
        ) {

            carregarYoutube(
                url
            );

            return;

        }


        if (
            tipo === "iframe"
        ) {

            carregarIframe(
                url
            );

            return;

        }


        carregarVideo(
            url
        );

    }


    // =====================================================
    // BUSCAR FIRESTORE
    // =====================================================

    async function carregarDadosFirestore() {

        if (
            !itemId ||
            !colecao
        ) {

            console.warn(
                "ID ou coleção não informados."
            );

            return null;

        }


        try {

            const referencia =
                doc(
                    db,
                    colecao,
                    itemId
                );


            const snap =
                await getDoc(
                    referencia
                );


            if (
                !snap.exists()
            ) {

                console.warn(
                    "Conteúdo não encontrado."
                );

                return null;

            }


            return {

                id:
                    snap.id,

                colecao:
                    colecao,

                ...snap.data()

            };

        }

        catch (erro) {

            console.error(
                "Erro ao consultar Firestore:",
                erro
            );

            return null;

        }

    }


    // =====================================================
    // PREENCHER INFORMAÇÕES
    // =====================================================

    function preencherInformacoes(
        item
    ) {

        if (!item)
            return;


        itemAtual =
            item;


        titulo.innerText =
            item.titulo ||
            tituloURL ||
            "V8 Play+";


        ano.innerText =
            item.ano ||
            "";


        categoria.innerText =
            item.categoria ||
            item.tipo ||
            "";


        if (!ano.innerText)
            document
                .getElementById(
                    "separadorAno"
                )
                .style.display =
                "none";


        descricao.innerText =
            item.descricao ||
            "Sem descrição disponível.";


        if (isTrailer) {

            trailerBadge.classList.remove(
                "hidden"
            );

        }

    }


    // =====================================================
    // VOLTAR
    // =====================================================

    document
        .getElementById(
            "btnVoltar"
        )
        .onclick =
        () => {

            if (
                window.history.length > 1
            ) {

                window.history.back();

            }

            else {

                window.location.href =
                    "index.html";

            }

        };


    // =====================================================
    // RETRY
    // =====================================================

    document
        .getElementById(
            "btnRetry"
        )
        .onclick =
        () => {

            erroPlayer.classList.add(
                "hidden"
            );

            if (itemAtual) {

                const url =
                    isTrailer
                        ? (
                            itemAtual.trailer ||
                            itemAtual.videoTrailer ||
                            videoURL
                        )
                        : (
                            itemAtual.video ||
                            itemAtual.video1 ||
                            itemAtual.video2 ||
                            itemAtual.video3 ||
                            itemAtual.embed ||
                            videoURL
                        );

                abrirVideo(url);

            }

            else if (videoURL) {

                abrirVideo(
                    videoURL
                );

            }

        };


    // =====================================================
    // INICIALIZAÇÃO
    // =====================================================

    async function iniciar() {

        console.log(
            "🚀 Player V8 Play+ iniciado"
        );


        console.log(
            "ID:",
            itemId
        );

        console.log(
            "Coleção:",
            colecao
        );

        console.log(
            "Vídeo recebido:",
            videoURL
        );

        console.log(
            "Trailer:",
            isTrailer
        );


        mostrarLoading(
            "Carregando conteúdo..."
        );


        // -------------------------------------------------
        // BUSCA FIRESTORE
        // -------------------------------------------------

        const item =
            await carregarDadosFirestore();


        if (item) {

            preencherInformacoes(
                item
            );


            let url;


            if (isTrailer) {

                url =
                    item.trailer ||
                    item.videoTrailer ||
                    videoURL;

            }

            else {

                url =
                    item.video ||
                    item.video1 ||
                    item.video2 ||
                    item.video3 ||
                    item.embed ||
                    videoURL;

            }


            if (!url) {

                mostrarErro(
                    isTrailer
                        ? "Este título não possui trailer disponível."
                        : "Este título não possui vídeo disponível."
                );

                return;

            }


            abrirVideo(
                url
            );


            return;

        }


        // -------------------------------------------------
        // FALLBACK DA URL
        // -------------------------------------------------

        if (videoURL) {

            titulo.innerText =
                tituloURL ||
                "V8 Play+";


            abrirVideo(
                videoURL
            );


            return;

        }


        // -------------------------------------------------
        // SEM VÍDEO
        // -------------------------------------------------

        mostrarErro(
            "Não foi possível localizar o conteúdo solicitado."
        );

    }


    iniciar();

</script>


</body>
</html>
