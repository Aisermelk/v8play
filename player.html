<script type="module">

import { db } from "./js/firebase.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const ABYSS_BASE_URL = "https://player.abyssplayer.com";


/* =====================================================
   ELEMENTOS
===================================================== */

const videoPlayer = document.getElementById("videoPlayer");
const youtubePlayer = document.getElementById("youtubePlayer");
const iframePlayer = document.getElementById("iframePlayer");

const loading = document.getElementById("loading");
const loadingText = document.getElementById("loadingText");

const erroPlayer = document.getElementById("erroPlayer");
const erroTexto = document.getElementById("erroTexto");

const titulo = document.getElementById("titulo");
const ano = document.getElementById("ano");
const categoria = document.getElementById("categoria");
const descricao = document.getElementById("descricao");

const trailerBadge = document.getElementById("trailerBadge");


/* =====================================================
   PARÂMETROS
===================================================== */

const params = new URLSearchParams(
    window.location.search
);

const itemId = params.get("id") || "";
const colecao = params.get("colecao") || "";
const videoURL = params.get("video") || "";
const tituloURL = params.get("title") || "";

const isTrailer =
    params.get("trailer") === "true";


let itemAtual = null;


/* =====================================================
   UTILITÁRIOS
===================================================== */

function limparUrl(valor) {

    if (!valor) return "";

    return String(valor).trim();

}


function esconderLoading() {

    loading.classList.add("hidden");

}


function mostrarLoading(texto = "Carregando...") {

    loadingText.textContent = texto;

    loading.classList.remove("hidden");

    erroPlayer.classList.add("hidden");

}


function mostrarErro(texto) {

    esconderLoading();

    erroTexto.textContent =
        texto ||
        "Não foi possível carregar o conteúdo.";

    erroPlayer.classList.remove("hidden");

}


/* =====================================================
   ESCONDER PLAYERS
===================================================== */

function esconderPlayers() {

    try {
        videoPlayer.pause();
    } catch {}

    videoPlayer.removeAttribute("src");
    videoPlayer.load();

    videoPlayer.classList.add("hidden");


    youtubePlayer.src = "";

    youtubePlayer.classList.add("hidden");


    iframePlayer.src = "";

    iframePlayer.classList.add("hidden");

}


/* =====================================================
   YOUTUBE
===================================================== */

function extrairYoutubeID(url) {

    url = limparUrl(url);

    if (!url) return null;


    if (/^[a-zA-Z0-9_-]{11}$/.test(url)) {

        return url;

    }


    try {

        const parsed = new URL(url);

        const host =
            parsed.hostname.toLowerCase();


        if (host === "youtu.be") {

            const partes =
                parsed.pathname
                    .split("/")
                    .filter(Boolean);

            return partes[0] || null;

        }


        if (
            host === "youtube.com" ||
            host === "www.youtube.com" ||
            host.endsWith(".youtube.com")
        ) {

            const v =
                parsed.searchParams.get("v");

            if (v) return v;


            const partes =
                parsed.pathname
                    .split("/")
                    .filter(Boolean);


            const tipos = [
                "embed",
                "shorts",
                "live"
            ];


            for (const tipo of tipos) {

                const index =
                    partes.indexOf(tipo);

                if (
                    index !== -1 &&
                    partes[index + 1]
                ) {

                    return partes[index + 1];

                }

            }

        }

    } catch {}

    return null;

}


/* =====================================================
   EXTRAIR SRC DE IFRAME
===================================================== */

function extrairSrcIframe(valor) {

    if (!valor) return null;


    const match =
        valor.match(
            /<iframe[^>]+src=["']([^"']+)["']/i
        );


    return match
        ? match[1]
        : null;

}


/* =====================================================
   ABYSS
===================================================== */

function ehAbyss(valor) {

    if (!valor) return false;

    const texto =
        String(valor).toLowerCase();


    return (
        texto.includes("abyssplayer.com") ||
        texto.includes("abyss.to")
    );

}


/* =====================================================
   SLUG ABYSS
===================================================== */

function pareceSlug(valor) {

    if (!valor) return false;


    return /^[a-zA-Z0-9_-]{6,100}$/.test(
        valor
    );

}


/* =====================================================
   CONSTRUIR ABYSS
===================================================== */

function construirAbyss(valor) {

    valor =
        limparUrl(valor);


    if (!valor) return "";


    if (ehAbyss(valor)) {

        return valor;

    }


    if (pareceSlug(valor)) {

        return (
            ABYSS_BASE_URL +
            "/" +
            encodeURIComponent(valor)
        );

    }


    return "";

}


/* =====================================================
   REDIRECIONAR PARA ABYSS
===================================================== */

function redirecionarAbyss(valor) {

    const url =
        construirAbyss(valor);


    if (!url) {

        mostrarErro(
            "Não foi possível localizar o player Abyss."
        );

        return;

    }


    console.log(
        "🚀 Redirecionando para Abyss:",
        url
    );


    mostrarLoading(
        "Abrindo player externo..."
    );


    /*
     * Pequeno atraso para o usuário
     * visualizar a mensagem.
     */

    setTimeout(() => {

        window.location.href = url;

    }, 300);

}


/* =====================================================
   CARREGAR YOUTUBE
===================================================== */

function carregarYoutube(url) {

    const id =
        extrairYoutubeID(url);


    if (!id) {

        mostrarErro(
            "O link do YouTube não é válido."
        );

        return;

    }


    esconderPlayers();

    mostrarLoading(
        "Carregando YouTube..."
    );


    youtubePlayer.classList.remove(
        "hidden"
    );


    const query =
        new URLSearchParams({

            autoplay: "1",
            rel: "0",
            playsinline: "1",
            modestbranding: "1"

        });


    youtubePlayer.src =
        `https://www.youtube.com/embed/${id}?${query}`;


    youtubePlayer.onload = () => {

        esconderLoading();

    };


    setTimeout(
        esconderLoading,
        4000
    );

}


/* =====================================================
   IFRAME NORMAL
===================================================== */

function carregarIframe(url) {

    if (!url) {

        mostrarErro(
            "URL do player não encontrada."
        );

        return;

    }


    /*
     * IMPORTANTE:
     *
     * Abyss NÃO entra aqui.
     *
     * Abyss é redirecionado.
     */

    if (ehAbyss(url)) {

        redirecionarAbyss(url);

        return;

    }


    esconderPlayers();

    mostrarLoading(
        "Carregando player..."
    );


    iframePlayer.classList.remove(
        "hidden"
    );


    iframePlayer.src = url;


    iframePlayer.onload = () => {

        esconderLoading();

    };


    setTimeout(
        esconderLoading,
        5000
    );

}


/* =====================================================
   PLAYER HTML5
===================================================== */

function carregarVideo(url) {

    if (!url) {

        mostrarErro(
            "URL do vídeo não encontrada."
        );

        return;

    }


    esconderPlayers();

    mostrarLoading(
        "Carregando vídeo..."
    );


    videoPlayer.classList.remove(
        "hidden"
    );


    videoPlayer.onloadedmetadata = () => {

        esconderLoading();

    };


    videoPlayer.oncanplay = () => {

        esconderLoading();

    };


    videoPlayer.onerror = () => {

        console.error(
            "Erro no vídeo:",
            videoPlayer.error
        );


        mostrarErro(
            "O vídeo não pôde ser reproduzido."
        );

    };


    videoPlayer.src = url;

    videoPlayer.load();

}


/* =====================================================
   DETECTAR TIPO
===================================================== */

function detectarTipo(valor) {

    valor =
        limparUrl(valor);


    if (!valor)
        return "nenhum";


    /*
     * ABYSS
     */

    if (ehAbyss(valor)) {

        return "abyss";

    }


    /*
     * SLUG
     */

    if (pareceSlug(valor)) {

        return "abyss";

    }


    /*
     * YOUTUBE
     */

    if (extrairYoutubeID(valor)) {

        return "youtube";

    }


    /*
     * IFRAME HTML
     */

    if (
        valor
            .toLowerCase()
            .includes("<iframe")
    ) {

        const src =
            extrairSrcIframe(valor);


        if (src && ehAbyss(src)) {

            return "abyss";

        }


        return "iframe";

    }


    /*
     * URL
     */

    if (
        /^https?:\/\//i.test(valor)
    ) {

        const lower =
            valor.toLowerCase();


        /*
         * MP4
         */

        if (
            /\.(mp4|webm|ogg)(\?|#|$)/i
                .test(lower)
        ) {

            return "video";

        }


        /*
         * M3U8
         */

        if (
            /\.m3u8(\?|#|$)/i
                .test(lower)
        ) {

            return "video";

        }


        /*
         * Outros servidores
         */

        return "iframe";

    }


    return "nenhum";

}


/* =====================================================
   ABRIR VÍDEO
===================================================== */

function abrirVideo(valor) {

    valor =
        limparUrl(valor);


    if (!valor) {

        mostrarErro(
            isTrailer
                ? "Este título não possui trailer."
                : "Este título não possui vídeo."
        );

        return;

    }


    console.log(
        "🎬 Valor recebido:",
        valor
    );


    const tipo =
        detectarTipo(valor);


    console.log(
        "🎥 Tipo:",
        tipo
    );


    switch (tipo) {

        case "abyss":

            redirecionarAbyss(
                valor
            );

            break;


        case "youtube":

            carregarYoutube(
                valor
            );

            break;


        case "iframe": {

            const src =
                extrairSrcIframe(valor)
                || valor;


            carregarIframe(src);

            break;

        }


        case "video":

            carregarVideo(
                valor
            );

            break;


        default:

            mostrarErro(
                "Formato de vídeo não reconhecido."
            );

    }

}


/* =====================================================
   FIRESTORE
===================================================== */

async function carregarFirestore() {

    if (
        !itemId ||
        !colecao
    ) {

        return null;

    }


    try {

        console.log(
            "🔥 Firestore:",
            colecao,
            itemId
        );


        const referencia =
            doc(
                db,
                colecao,
                itemId
            );


        const snap =
            await getDoc(
                referencia
            );


        if (!snap.exists()) {

            return null;

        }


        return {

            id: snap.id,

            colecao,

            ...snap.data()

        };

    }

    catch (erro) {

        console.error(
            "❌ Firestore:",
            erro
        );

        return null;

    }

}


/* =====================================================
   OBTER VÍDEO
===================================================== */

function obterVideo(item) {

    if (!item)
        return "";


    /*
     * TRAILER
     */

    if (isTrailer) {

        return limparUrl(

            item.trailer ||
            item.videoTrailer ||
            item.trailerUrl ||
            item.urlTrailer ||
            item.video_trailer ||
            ""

        );

    }


    /*
     * PRINCIPAL
     */

    return limparUrl(

        item.video ||
        item.video1 ||
        item.video2 ||
        item.video3 ||
        item.embed ||
        item.urlVideo ||
        item.videoUrl ||
        item.url ||
        videoURL

    );

}


/* =====================================================
   INFORMAÇÕES
===================================================== */

function preencherInformacoes(item) {

    if (!item) return;


    itemAtual = item;


    titulo.textContent =
        item.titulo ||
        tituloURL ||
        "V8 Play+";


    ano.textContent =
        item.ano || "";


    categoria.textContent =
        item.categoria ||
        item.tipo ||
        "";


    const separador =
        document.getElementById(
            "separadorAno"
        );


    if (
        !ano.textContent ||
        !categoria.textContent
    ) {

        separador.style.display =
            "none";

    }

    else {

        separador.style.display =
            "";

    }


    descricao.textContent =
        item.descricao ||
        "Sem descrição disponível.";


    if (isTrailer) {

        trailerBadge.classList.remove(
            "hidden"
        );

    }

}


/* =====================================================
   VOLTAR
===================================================== */

document
    .getElementById("btnVoltar")
    .addEventListener(
        "click",
        () => {

            if (
                window.history.length > 1
            ) {

                window.history.back();

            }

            else {

                window.location.href =
                    "index.html";

            }

        }
    );


/* =====================================================
   RETRY
===================================================== */

document
    .getElementById("btnRetry")
    .addEventListener(
        "click",
        () => {

            erroPlayer.classList.add(
                "hidden"
            );


            const url =
                obterVideo(
                    itemAtual
                );


            if (url) {

                abrirVideo(
                    url
                );

            }

            else {

                mostrarErro(
                    "Vídeo não encontrado."
                );

            }

        }
    );


/* =====================================================
   INICIAR
===================================================== */

async function iniciar() {

    console.log(
        "================================"
    );

    console.log(
        "🚀 V8 PLAY+ PLAYER"
    );

    console.log(
        "ID:",
        itemId
    );

    console.log(
        "Coleção:",
        colecao
    );

    console.log(
        "================================"
    );


    mostrarLoading(
        "Buscando conteúdo..."
    );


    /*
     * 1.
     * FIRESTORE
     */

    const item =
        await carregarFirestore();


    if (item) {

        preencherInformacoes(
            item
        );


        const video =
            obterVideo(item);


        if (!video) {

            mostrarErro(
                isTrailer
                    ? "Este conteúdo não possui trailer."
                    : "Este conteúdo não possui vídeo."
            );

            return;

        }


        abrirVideo(video);

        return;

    }


    /*
     * 2.
     * URL DIRETA
     */

    if (videoURL) {

        titulo.textContent =
            tituloURL ||
            "V8 Play+";


        abrirVideo(
            videoURL
        );

        return;

    }


    /*
     * 3.
     * ERRO
     */

    mostrarErro(
        "Não foi possível localizar o conteúdo solicitado."
    );

}


/* =====================================================
   EXECUTAR
===================================================== */

iniciar()
    .catch(
        erro => {

            console.error(
                "❌ Erro fatal:",
                erro
            );


            mostrarErro(
                "Ocorreu um erro ao iniciar o player."
            );

        }
    );

</script>
