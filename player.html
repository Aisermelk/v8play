<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistir - V8 Play+</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        :root {
            --primary: #00d4ff;
            --primary-hover: #00a2c7;
            --bg-dark: #0a0a0b;
            --bg-card: #16161a;
            --text: #ffffff;
            --text-secondary: #aaaaaa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-dark); color: var(--text); font-family: 'Poppins', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

        /* HEADER */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(10,10,11,0.95); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { display: flex; align-items: center; text-decoration: none; font-size: 1.4rem; font-weight: 800; color: white; gap: 10px; }
        .logo span { color: var(--primary); }
        .logo-img { height: 38px; width: auto; object-fit: contain; }
        .btn-voltar { background: rgba(255,255,255,0.1); color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.85rem; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .btn-voltar:hover { background: rgba(255,255,255,0.2); }

        /* CONTAINER DO PLAYER */
        .player-container { flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; padding: 30px 5%; display: flex; flex-direction: column; gap: 20px; }
        
        .video-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; }
        .video-wrapper video, .video-wrapper iframe { width: 100%; height: 100%; border: none; outline: none; object-fit: contain; }

        /* BLOQUEIO DE PAGAMENTO */
        .paywall-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,10,11,0.92); backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; z-index: 10; }
        .paywall-overlay h2 { font-size: 1.8rem; font-weight: 700; margin-bottom: 10px; text-transform: uppercase; }
        .paywall-overlay p { color: var(--text-secondary); max-width: 500px; font-size: 0.95rem; margin-bottom: 25px; line-height: 1.5; }
        .btn-checkout { background: #ffaa00; color: #000; border: none; padding: 12px 28px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-checkout:hover { background: #e09600; transform: translateY(-2px); }

        /* METADADOS DO VÍDEO */
        .video-info h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; }
        .video-meta { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 15px; display: flex; gap: 12px; }
        .video-desc { color: #ccc; font-size: 0.95rem; line-height: 1.6; max-width: 900px; }

        /* ESTADO DE CARREGAMENTO */
        .loading-screen { display: flex; align-items: center; justify-content: center; height: 60vh; font-size: 1.1rem; color: var(--text-secondary); gap: 10px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo"><img src="assets/v8p.png" alt="V8 Play+" class="logo-img" onerror="this.style.display='none'"> <span>V8 Play+</span></a>
        <a href="index.html" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar ao Início</a>
    </header>

    <div class="player-container" id="mainContainer">
        <div class="loading-screen">
            <i class="fa-solid fa-spinner fa-spin"></i> Carregando conteúdo...
        </div>
    </div>

    <script type="module">
        import { db, auth } from "./js/firebase.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const urlParams = new URLSearchParams(window.location.search);
        const itemId = urlParams.get('id');
        const colecao = urlParams.get('colecao');
        const isTrailer = urlParams.get('trailer') === 'true';

        async function inicializarPlayer() {
            const container = document.getElementById('mainContainer');

            if (!itemId || !colecao) {
                container.innerHTML = `<h2 style="color:#ff6b6b; text-align:center; margin-top:50px;">Parâmetros inválidos para reprodução.</h2>`;
                return;
            }

            try {
                const docRef = doc(db, colecao, itemId);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    container.innerHTML = `<h2 style="color:#ff6b6b; text-align:center; margin-top:50px;">Conteúdo não encontrado.</h2>`;
                    return;
                }

                const item = docSnap.data();
                const tag = (item.tag || item.tipoAcesso || 'gratuito').toLowerCase();
                const preco = item.preco || 1.00;
                
                const linkMidia = isTrailer ? item.trailer : (item.videoUrl || item.url || item.link);
                const precisaPagar = tag !== 'gratuito' && !isTrailer;

                // Define o link de checkout específico com base na tag (Prime vs Premium)
                let checkoutUrl = "https://checkout.infinitepay.io/aisermelquisedec/Im3ug7KDw0"; // Padrão Prime
                if (tag === 'premium') {
                    checkoutUrl = "https://checkout.infinitepay.io/aisermelquisedec/OcUlwaNq5H"; // Premium
                }

                container.innerHTML = `
                    <div class="video-wrapper" id="videoWrapper">
                        ${precisaPagar ? `
                            <div class="paywall-overlay">
                                <h2>Conteúdo Exclusivo ${tag.toUpperCase()}</h2>
                                <p>Para assistir a este título completo, libere seu acesso ao plano ${tag.toUpperCase()} agora mesmo por R$ ${Number(preco).toFixed(2)}.</p>
                                <a href="${checkoutUrl}" class="btn-checkout" target="_blank">
                                    <i class="fa-solid fa-lock-open"></i> Liberar Acesso (${tag.toUpperCase()})
                                </a>
                            </div>
                        ` : ''}
                        
                        ${linkMidia && linkMidia.includes('youtube.com') || linkMidia && linkMidia.includes('youtu.be') ? 
                            `<iframe src="${converterYoutubeUrl(linkMidia)}" allowfullscreen></iframe>` :
                            `<video controls autoplay src="${linkMidia || ''}"></video>`
                        }
                    </div>
                    <div class="video-info">
                        <h1>${item.titulo || 'Título do Vídeo'} ${isTrailer ? '(Trailer)' : ''}</h1>
                        <div class="video-meta">
                            <span>${item.ano || '2026'}</span> • <span>${item.categoria || item.tipo || 'Geral'}</span>
                        </div>
                        <p class="video-desc">${item.descricao || 'Sem descrição cadastrada.'}</p>
                    </div>
                `;

            } catch (erro) {
                console.error("Erro ao carregar player:", erro);
                container.innerHTML = `<h2 style="color:#ff6b6b; text-align:center; margin-top:50px;">Erro ao carregar o player de mídia.</h2>`;
            }
        }

        function converterYoutubeUrl(url) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : url;
        }

        onAuthStateChanged(auth, (user) => {
            inicializarPlayer();
        });
    </script>
</body>
</html>
