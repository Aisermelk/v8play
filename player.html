<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>V8 Play+ | Player</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <style>

        :root {
            --primary: #00d4ff;
            --primary-hover: #00a2c7;

            --bg: #080809;
            --surface: #121216;

            --text: #fff;
            --text2: #aaa;

            --danger: #ff4d4d;

            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: var(--bg);
        }

        body {
            min-height: 100vh;
            color: var(--text);
            font-family: "Poppins", sans-serif;
            overflow-x: hidden;
        }

        button {
            font-family: inherit;
        }

        .hidden {
            display: none !important;
        }

        /* ================================
           HEADER
        ================================= */

        header {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 70px;

            display: flex;
            align-items: center;

            gap: 15px;

            padding: 10px 5%;

            z-index: 1000;

            background:
                linear-gradient(
                    to bottom,
                    rgba(8,8,9,.98),
                    rgba(8,8,9,.82)
                );

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border-bottom:
                1px solid
                rgba(255,255,255,.05);
        }

        .btn-voltar {
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                rgba(255,255,255,.08);

            color: #fff;

            cursor: pointer;

            transition: .2s;

            flex-shrink: 0;
        }

        .btn-voltar:hover {
            background: var(--primary);
            color: #000;

            transform: translateX(-2px);
        }

        .logo {
            display: flex;
            align-items: center;

            text-decoration: none;

            color: #fff;

            font-size: 1.35rem;
            font-weight: 800;
        }

        .logo span {
            color: var(--primary);
        }

        .logo-img {
            height: 40px;
            width: auto;

            object-fit: contain;

            margin-right: 8px;
        }

        /* ================================
           MAIN
        ================================= */

        main {
            width: 100%;
            min-height: 100vh;

            padding-top: 70px;
        }

        .player-wrapper {
            width: 100%;
            max-width: 1400px;

            margin: 0 auto;

            padding: 20px 4% 50px;
        }

        /* ================================
           PLAYER
        ================================= */

        .player-container {
            position: relative;

            width: 100%;

            aspect-ratio: 16 / 9;

            background: #000;

            border-radius: var(--radius);

            overflow: hidden;

            border:
                1px solid
                rgba(255,255,255,.07);

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.6);
        }

        #iframePlayer {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            display: block;

            border: 0;

            background: #000;
        }

        /* ================================
           LOADING
        ================================= */

        #loading {
            position: absolute;

            inset: 0;

            z-index: 50;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 15px;

            background:
                rgba(0,0,0,.92);
        }

        .spinner {
            width: 50px;
            height: 50px;

            border-radius: 50%;

            border:
                4px solid
                rgba(255,255,255,.12);

            border-top-color:
                var(--primary);

            animation:
                girar .8s linear infinite;
        }

        @keyframes girar {
            to {
                transform: rotate(360deg);
            }
        }

        #loadingText {
            color: #aaa;

            font-size: .9rem;

            text-align: center;

            padding: 0 20px;
        }

        /* ================================
           ERRO
        ================================= */

        #erroPlayer {
            position: absolute;

            inset: 0;

            z-index: 60;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 25px;

            text-align: center;

            background:
                rgba(0,0,0,.97);
        }

        .erro-box {
            width: 100%;
            max-width: 520px;
        }

        .erro-box i {
            display: block;

            font-size: 48px;

            color: var(--danger);

            margin-bottom: 15px;
        }

        .erro-box h2 {
            font-size: 1.35rem;

            margin-bottom: 10px;
        }

        .erro-box p {
            color: #aaa;

            font-size: .9rem;

            line-height: 1.6;

            margin-bottom: 20px;
        }

        .btn-retry {
            border: none;

            background: var(--primary);

            color: #000;

            padding: 11px 22px;

            border-radius: 7px;

            font-weight: 700;

            cursor: pointer;

            transition: .2s;
        }

        .btn-retry:hover {
            background: var(--primary-hover);

            transform: translateY(-1px);
        }

        /* ================================
           INFORMAÇÕES
        ================================= */

        .info {
            padding: 25px 0 0;
        }

        .info h1 {
            font-size: 1.8rem;

            font-weight: 700;

            margin-bottom: 8px;

            line-height: 1.2;
        }

        .meta {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            color: var(--text2);

            font-size: .85rem;

            margin-bottom: 15px;
        }

        .descricao {
            max-width: 900px;

            color: #ccc;

            font-size: .92rem;

            line-height: 1.7;
        }

        /* ================================
           TRAILER
        ================================= */

        .trailer-badge {
            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding: 5px 10px;

            margin-bottom: 12px;

            border-radius: 5px;

            background:
                rgba(0,212,255,.1);

            border:
                1px solid
                rgba(0,212,255,.3);

            color: var(--primary);

            font-size: .72rem;

            font-weight: 700;

            text-transform: uppercase;
        }

        /* ================================
           MOBILE
        ================================= */

        @media (max-width:700px) {

            header {
                height: 60px;

                padding: 8px 4%;
            }

            main {
                padding-top: 60px;
            }

            .btn-voltar {
                width: 38px;
                height: 38px;
            }

            .logo {
                font-size: 1.05rem;
            }

            .logo-img {
                height: 34px;
            }

            .player-wrapper {
                padding: 10px 0 35px;
            }

            .player-container {
                border-radius: 0;

                border-left: none;
                border-right: none;
            }

            .info {
                padding: 20px 4% 40px;
            }

            .info h1 {
                font-size: 1.4rem;
            }

            .descricao {
                font-size: .85rem;
            }
        }

        @media (max-width:430px) {

            .logo span {
                display: none;
            }

            .logo-img {
                margin-right: 0;
            }
        }

    </style>

</head>

<body>

<header>

    <button
        class="btn-voltar"
        id="btnVoltar"
        type="button"
        aria-label="Voltar"
        title="Voltar"
    >
        <i class="fa-solid fa-arrow-left"></i>
    </button>

    <a
        href="index.html"
        class="logo"
    >

        <img
            src="assets/v8p.png"
            class="logo-img"
            alt="V8 Play+"
            onerror="this.style.display='none'"
        >

        <span>V8 Play+</span>

    </a>

</header>


<main>

    <div class="player-wrapper">

        <div class="player-container">

            <!-- LOADING -->

            <div id="loading">

                <div class="spinner"></div>

                <div id="loadingText">
                    Carregando player...
                </div>

            </div>


            <!-- ÚNICO PLAYER: IFRAME -->

            <iframe
                id="iframePlayer"
                class="hidden"
                frameborder="0"
                scrolling="no"
                allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"
            ></iframe>


            <!-- ERRO -->

            <div
                id="erroPlayer"
                class="hidden"
            >

                <div class="erro-box">

                    <i
                        class="fa-solid fa-circle-exclamation"
                    ></i>

                    <h2>
                        Não foi possível carregar o player
                    </h2>

                    <p id="erroTexto">
                        Verifique o endereço do vídeo
                        e tente novamente.
                    </p>

                    <button
                        class="btn-retry"
                        id="btnRetry"
                        type="button"
                    >

                        <i
                            class="fa-solid fa-rotate"
                        ></i>

                        Tentar novamente

                    </button>

                </div>

            </div>

        </div>


        <!-- INFORMAÇÕES -->

        <div class="info">

            <div
                id="trailerBadge"
                class="trailer-badge hidden"
            >

                <i class="fa-solid fa-film"></i>

                Trailer

            </div>

            <h1 id="titulo">
                Carregando...
            </h1>

            <div class="meta">

                <span id="ano"></span>

                <span id="separadorAno">
                    •
                </span>

                <span id="categoria"></span>

            </div>

            <p
                class="descricao"
                id="descricao"
            >
                Carregando informações...
            </p>

        </div>

    </div>

</main>


<script type="module">

    import { db } from "./js/firebase.js";

    import {
        doc,
        getDoc
    } from
    "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


    /* ================================================
       ELEMENTOS
    ================================================ */

    const iframePlayer =
        document.getElementById("iframePlayer");

    const loading =
        document.getElementById("loading");

    const loadingText =
        document.getElementById("loadingText");

    const erroPlayer =
        document.getElementById("erroPlayer");

    const erroTexto =
        document.getElementById("erroTexto");

    const titulo =
        document.getElementById("titulo");

    const ano =
        document.getElementById("ano");

    const categoria =
        document.getElementById("categoria");

    const descricao =
        document.getElementById("descricao");

    const trailerBadge =
        document.getElementById("trailerBadge");

    const btnVoltar =
        document.getElementById("btnVoltar");

    const btnRetry =
        document.getElementById("btnRetry");


    /* ================================================
       PARÂMETROS
    ================================================ */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const itemId =
        params.get("id") || "";

    const colecao =
        params.get("colecao") || "";

    const videoURL =
        params.get("video") || "";

    const tituloURL =
        params.get("title") || "";

    const isTrailer =
        params.get("trailer") === "true";


    let itemAtual = null;


    /* ================================================
       NORMALIZAR
    ================================================ */

    function limparUrl(valor) {

        if (!valor)
            return "";

        let url =
            String(valor).trim();


        /*
         * Remove prefixos acidentais
         *
         * video: https://...
         * iframe: https://...
         */

        url =
            url.replace(
                /^(video|iframe)\s*:\s*/i,
                ""
            ).trim();


        return url;
    }


    /* ================================================
       EXTRAIR SRC DO IFRAME
    ================================================ */

    function extrairSrcIframe(valor) {

        if (!valor)
            return "";


        let texto =
            limparUrl(valor);


        /*
         * Caso seja código HTML:
         *
         * <iframe src="https://...">
         */

        const match =
            texto.match(
                /<iframe[^>]+src\s*=\s*["']([^"']+)["']/i
            );


        if (match && match[1]) {

            return match[1].trim();

        }


        /*
         * Caso tenha apenas src="..."
         */

        const src =
            texto.match(
                /src\s*=\s*["']([^"']+)["']/i
            );


        if (src && src[1]) {

            return src[1].trim();

        }


        /*
         * URL direta
         */

        return texto;
    }


    /* ================================================
       VALIDAR URL
    ================================================ */

    function validarUrl(url) {

        try {

            const parsed =
                new URL(url);

            return (
                parsed.protocol === "http:" ||
                parsed.protocol === "https:"
            );

        }

        catch {

            return false;

        }
    }


    /* ================================================
       LOADING
    ================================================ */

    function mostrarLoading(
        mensagem = "Carregando player..."
    ) {

        loadingText.textContent =
            mensagem;

        loading.classList.remove(
            "hidden"
        );

        erroPlayer.classList.add(
            "hidden"
        );
    }


    function esconderLoading() {

        loading.classList.add(
            "hidden"
        );
    }


    /* ================================================
       ERRO
    ================================================ */

    function mostrarErro(mensagem) {

        esconderLoading();

        erroTexto.textContent =
            mensagem ||
            "Não foi possível carregar o player.";

        erroPlayer.classList.remove(
            "hidden"
        );
    }


    /* ================================================
       CARREGAR IFRAME
    ================================================ */

    function carregarIframe(valor) {

        let url =
            extrairSrcIframe(valor);


        console.log(
            "🔗 URL recebida:",
            url
        );


        if (!url) {

            mostrarErro(
                "Nenhum endereço de player foi informado."
            );

            return;

        }


        if (!validarUrl(url)) {

            mostrarErro(
                "O endereço do player é inválido."
            );

            console.error(
                "❌ URL inválida:",
                url
            );

            return;

        }


        mostrarLoading(
            "Carregando player..."
        );


        /*
         * Limpa iframe anterior
         */

        iframePlayer.src =
            "about:blank";


        /*
         * Pequeno intervalo para
         * garantir novo carregamento
         */

        setTimeout(() => {

            iframePlayer.src =
                url;

            iframePlayer.classList.remove(
                "hidden"
            );

        }, 50);


        /*
         * O evento load confirma
         * que o documento do iframe
         * foi carregado.
         */

        iframePlayer.onload =
            () => {

                console.log(
                    "✅ Iframe carregado:",
                    url
                );

                esconderLoading();

            };


        /*
         * Alguns players podem não
         * disparar corretamente o load.
         */

        setTimeout(
            () => {

                esconderLoading();

            },
            5000
        );

    }


    /* ================================================
       FIRESTORE
    ================================================ */

    async function carregarFirestore() {

        if (
            !itemId ||
            !colecao
        ) {

            console.warn(
                "⚠️ ID ou coleção ausentes."
            );

            return null;

        }


        try {

            console.log(
                "🔥 Firestore:",
                colecao,
                itemId
            );


            const referencia =
                doc(
                    db,
                    colecao,
                    itemId
                );


            const snap =
                await getDoc(
                    referencia
                );


            if (!snap.exists()) {

                console.warn(
                    "⚠️ Documento não encontrado."
                );

                return null;

            }


            const dados =
                snap.data();


            console.log(
                "✅ Conteúdo encontrado:",
                dados
            );


            return {

                id: snap.id,

                colecao,

                ...dados

            };

        }

        catch (erro) {

            console.error(
                "❌ Erro Firestore:",
                erro
            );

            return null;

        }
    }


    /* ================================================
       OBTER VÍDEO
    ================================================ */

    function obterVideo(item) {

        if (!item)
            return "";


        if (isTrailer) {

            return limparUrl(

                item.trailer ||

                item.videoTrailer ||

                item.trailerUrl ||

                item.urlTrailer ||

                videoURL

            );

        }


        return limparUrl(

            item.video ||

            item.embed ||

            item.iframe ||

            item.player ||

            item.videoUrl ||

            item.urlVideo ||

            videoURL

        );
    }


    /* ================================================
       INFORMAÇÕES
    ================================================ */

    function preencherInformacoes(item) {

        if (!item)
            return;


        itemAtual =
            item;


        titulo.textContent =
            item.titulo ||
            tituloURL ||
            "V8 Play+";


        ano.textContent =
            item.ano ||
            "";


        categoria.textContent =
            item.categoria ||
            item.tipo ||
            "";


        const separador =
            document.getElementById(
                "separadorAno"
            );


        if (
            !ano.textContent ||
            !categoria.textContent
        ) {

            separador.style.display =
                "none";

        }


        descricao.textContent =
            item.descricao ||
            "Sem descrição disponível.";


        if (isTrailer) {

            trailerBadge.classList.remove(
                "hidden"
            );

        }
    }


    /* ================================================
       VOLTAR
    ================================================ */

    btnVoltar.addEventListener(
        "click",
        () => {

            if (
                window.history.length > 1
            ) {

                window.history.back();

            }

            else {

                window.location.href =
                    "index.html";

            }

        }
    );


    /* ================================================
       RETRY
    ================================================ */

    btnRetry.addEventListener(
        "click",
        () => {

            erroPlayer.classList.add(
                "hidden"
            );

            const url =
                obterVideo(
                    itemAtual
                );


            if (url) {

                carregarIframe(
                    url
                );

            }

            else {

                mostrarErro(
                    "Não foi possível localizar o player."
                );

            }

        }
    );


    /* ================================================
       INICIAR
    ================================================ */

    async function iniciar() {

        console.log(
            "======================================"
        );

        console.log(
            "🚀 V8 PLAY+ — PLAYER IFRAME"
        );

        console.log(
            "ID:",
            itemId
        );

        console.log(
            "Coleção:",
            colecao
        );

        console.log(
            "Trailer:",
            isTrailer
        );

        console.log(
            "======================================"
        );


        mostrarLoading(
            "Buscando conteúdo..."
        );


        /*
         * Primeiro Firestore
         */

        const item =
            await carregarFirestore();


        if (item) {

            preencherInformacoes(
                item
            );


            const video =
                obterVideo(
                    item
                );


            if (!video) {

                mostrarErro(
                    isTrailer
                        ? "Este conteúdo não possui trailer."
                        : "Este conteúdo não possui player."
                );

                return;

            }


            carregarIframe(
                video
            );

            return;

        }


        /*
         * Fallback da URL
         */

        if (videoURL) {

            titulo.textContent =
                tituloURL ||
                "V8 Play+";


            carregarIframe(
                videoURL
            );

            return;

        }


        mostrarErro(
            "Não foi possível localizar o player deste conteúdo."
        );

    }


    /* ================================================
       EXECUTAR
    ================================================ */

    iniciar()
        .catch(
            erro => {

                console.error(
                    "❌ Erro fatal:",
                    erro
                );

                mostrarErro(
                    "Ocorreu um erro ao iniciar o player."
                );

            }
        );

</script>

</body>

</html>
