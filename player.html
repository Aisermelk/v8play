<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Player - V8 Play+</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --primary: #00d4ff;
            --primary-hover: #00a2c7;
            --bg-dark: #0a0a0b;
            --bg-card: #16161a;
            --text: #ffffff;
            --text-secondary: #aaaaaa;
            --danger: #ff5c5c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: var(--bg-dark);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        /* ================================
           NAVBAR
        ================================= */

        .navbar {
            width: 100%;
            min-height: 68px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 12px 5%;

            background: #121214;

            border-bottom: 1px solid #222;

            position: sticky;
            top: 0;

            z-index: 1000;
        }

        .logo {
            color: var(--primary);

            font-size: 1.5rem;

            font-weight: 800;

            text-decoration: none;
        }

        .btn-voltar {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            color: #fff;

            text-decoration: none;

            background: #222;

            padding: 9px 16px;

            border-radius: 7px;

            font-size: .9rem;

            transition: .2s;

            border: 1px solid #333;
        }

        .btn-voltar:hover {
            background: #333;

            border-color: #444;

            transform: translateY(-1px);
        }

        /* ================================
           CONTAINER
        ================================= */

        .player-container {

            width: 100%;

            max-width: 1150px;

            margin: 0 auto;

            padding: 35px 5% 50px;
        }

        .player-title {

            margin-bottom: 20px;

            font-size: 1.8rem;

            font-weight: 700;

            line-height: 1.3;
        }

        /* ================================
           PLAYER
        ================================= */

        .video-wrapper {

            position: relative;

            width: 100%;

            aspect-ratio: 16 / 9;

            min-height: 250px;

            background: #000;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, .65);

            border: 1px solid #222;
        }

        .video-wrapper iframe,
        .video-wrapper video {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            border: 0;

            display: block;

            background: #000;
        }

        .video-wrapper video {

            object-fit: contain;
        }

        /* ================================
           LOADING
        ================================= */

        .loading {

            position: absolute;

            inset: 0;

            z-index: 50;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            gap: 14px;

            background: #000;

            color: #aaa;

            text-align: center;
        }

        .spinner {

            width: 42px;

            height: 42px;

            border: 4px solid #333;

            border-top-color: var(--primary);

            border-radius: 50%;

            animation:
                girar .8s linear infinite;
        }

        @keyframes girar {

            to {
                transform: rotate(360deg);
            }

        }

        .loading-text {

            font-size: .9rem;

            color: #aaa;
        }

        /* ================================
           ERRO
        ================================= */

        .erro-player {

            position: absolute;

            inset: 0;

            z-index: 20;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            gap: 12px;

            padding: 30px;

            text-align: center;

            background: #050505;

            color: var(--danger);
        }

        .erro-player strong {

            font-size: 1.15rem;
        }

        .erro-player small {

            color: #888;

            max-width: 800px;

            word-break: break-word;

            line-height: 1.5;
        }

        .erro-player button {

            margin-top: 8px;

            border: none;

            background: var(--primary);

            color: #000;

            padding: 10px 18px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: 600;
        }

        /* ================================
           AÇÕES
        ================================= */

        .player-actions {

            margin-top: 20px;

            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }

        .btn-secondary {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            background: var(--primary);

            color: #000;

            border: none;

            padding: 10px 20px;

            border-radius: 7px;

            font-weight: 600;

            cursor: pointer;

            transition: .2s;
        }

        .btn-secondary:hover {

            background: var(--primary-hover);

            transform: translateY(-1px);
        }

        .btn-secondary:disabled {

            opacity: .35;

            cursor: not-allowed;

            transform: none;
        }

        /* ================================
           INFO
        ================================= */

        .info-player {

            margin-top: 15px;

            color: var(--text-secondary);

            font-size: .85rem;

            line-height: 1.5;
        }

        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 700px) {

            .navbar {

                padding: 12px 4%;
            }

            .logo {

                font-size: 1.15rem;
            }

            .btn-voltar {

                padding: 8px 12px;

                font-size: .8rem;
            }

            .player-container {

                padding:
                    22px 4% 40px;
            }

            .player-title {

                font-size: 1.35rem;

                margin-bottom: 15px;
            }

            .video-wrapper {

                border-radius: 8px;

                min-height: 200px;
            }

        }

    </style>

</head>


<body>


<header class="navbar">

    <a
        href="index.html"
        class="logo"
    >
        V8 Play+
    </a>

    <a
        href="index.html"
        class="btn-voltar"
    >
        ← Voltar
    </a>

</header>


<main class="player-container">


    <h1
        id="player-title"
        class="player-title"
    >
        Carregando título...
    </h1>


    <div
        id="video-container"
        class="video-wrapper"
    >

        <div
            id="loading"
            class="loading"
        >

            <div class="spinner"></div>

            <span class="loading-text">
                Carregando vídeo...
            </span>

        </div>

    </div>


    <div class="player-actions">

        <button
            id="btn-download-file"
            class="btn-secondary"
            disabled
        >
            ⬇ Baixar Conteúdo
        </button>

    </div>


    <div
        id="player-info"
        class="info-player"
    >
        V8 Play+
    </div>


</main>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import { db } from "./js/firebase.js";

import {
    doc,
    getDoc
} from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =====================================================
   ELEMENTOS
===================================================== */

const container =
    document.getElementById(
        "video-container"
    );

const titleEl =
    document.getElementById(
        "player-title"
    );

const loading =
    document.getElementById(
        "loading"
    );

const btnDownload =
    document.getElementById(
        "btn-download-file"
    );

const playerInfo =
    document.getElementById(
        "player-info"
    );


/* =====================================================
   PARÂMETROS DA URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const itemId =
    params.get("id");

const colecao =
    params.get("colecao");

const modoTrailer =
    params.get("trailer") === "true";


console.log(
    "================================"
);

console.log(
    "🎬 V8 PLAY+ PLAYER"
);

console.log(
    "ID:",
    itemId
);

console.log(
    "COLEÇÃO:",
    colecao
);

console.log(
    "TRAILER:",
    modoTrailer
);

console.log(
    "================================"
);


/* =====================================================
   VARIÁVEIS
===================================================== */

let tituloAtual =
    "V8 Play+";

let downloadUrl =
    "";


/* =====================================================
   LIMPAR URL
===================================================== */

function limparUrl(valor) {

    if (
        valor === null ||
        valor === undefined
    ) {
        return "";
    }

    return String(valor)

        .trim()

        .replace(/^["']+|["']+$/g, "");

}


/* =====================================================
   VALIDAR URL
===================================================== */

function ehUrlValida(url) {

    if (!url) {
        return false;
    }

    try {

        new URL(url);

        return true;

    }

    catch {

        return false;

    }

}


/* =====================================================
   YOUTUBE
===================================================== */

function extrairYoutubeId(url) {

    const valor =
        limparUrl(url);

    if (!valor) {
        return null;
    }


    /*
       ID direto
    */

    if (
        /^[A-Za-z0-9_-]{11}$/
            .test(valor)
    ) {

        return valor;

    }


    /*
       Normaliza URL
    */

    let urlObj;

    try {

        urlObj =
            new URL(
                valor
            );

    }

    catch {

        return null;

    }


    const host =
        urlObj.hostname

            .toLowerCase()

            .replace(
                /^www\./,
                ""
            )

            .replace(
                /^m\./,
                ""
            );


    /*
       youtu.be
    */

    if (
        host === "youtu.be"
    ) {

        const id =
            urlObj.pathname

                .split("/")

                .filter(Boolean)[0];

        return id || null;

    }


    /*
       YouTube
    */

    if (
        host === "youtube.com" ||
        host === "youtube-nocookie.com"
    ) {

        /*
           watch?v=
        */

        const watchId =
            urlObj.searchParams.get(
                "v"
            );

        if (watchId) {

            return watchId;

        }


        /*
           embed
        */

        const embed =
            urlObj.pathname.match(
                /\/embed\/([^/?]+)/i
            );

        if (embed) {

            return embed[1];

        }


        /*
           shorts
        */

        const shorts =
            urlObj.pathname.match(
                /\/shorts\/([^/?]+)/i
            );

        if (shorts) {

            return shorts[1];

        }


        /*
           live
        */

        const live =
            urlObj.pathname.match(
                /\/live\/([^/?]+)/i
            );

        if (live) {

            return live[1];

        }

    }


    return null;

}


/* =====================================================
   É YOUTUBE?
===================================================== */

function ehYoutube(url) {

    const valor =
        limparUrl(url)
            .toLowerCase();

    return (

        valor.includes(
            "youtube.com"
        )

        ||

        valor.includes(
            "youtu.be"
        )

    );

}


/* =====================================================
   ARQUIVO DE VÍDEO
===================================================== */

function ehArquivoVideo(url) {

    const valor =
        limparUrl(url);

    if (!valor) {
        return false;
    }


    const semQuery =
        valor

            .split("#")[0]

            .split("?")[0]

            .toLowerCase();


    return (

        semQuery.endsWith(".mp4") ||

        semQuery.endsWith(".webm") ||

        semQuery.endsWith(".ogg") ||

        semQuery.endsWith(".ogv") ||

        semQuery.endsWith(".m4v") ||

        semQuery.endsWith(".mov") ||

        semQuery.endsWith(".m3u8")

    );

}


/* =====================================================
   REMOVER LOADING
===================================================== */

function esconderLoading() {

    const loader =
        document.getElementById(
            "loading"
        );

    if (loader) {

        loader.remove();

    }

}


/* =====================================================
   MOSTRAR ERRO
===================================================== */

function mostrarErro(
    mensagem,
    detalhe = ""
) {

    console.error(
        "❌",
        mensagem,
        detalhe
    );


    container.innerHTML = "";


    const erro =
        document.createElement(
            "div"
        );


    erro.className =
        "erro-player";


    erro.innerHTML = `

        <strong>
            ⚠️ ${mensagem}
        </strong>

        ${
            detalhe
                ? `
                    <small>
                        ${detalhe}
                    </small>
                  `
                : ""
        }

        <button
            onclick="window.location.href='index.html'"
        >
            Voltar ao catálogo
        </button>

    `;


    container.appendChild(
        erro
    );

}


/* =====================================================
   YOUTUBE PLAYER
===================================================== */

function abrirYoutube(
    youtubeId
) {

    console.log(
        "▶️ YouTube ID:",
        youtubeId
    );


    const iframe =
        document.createElement(
            "iframe"
        );


    iframe.src =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(
            youtubeId
        ) +
        "?autoplay=1" +
        "&rel=0" +
        "&modestbranding=1" +
        "&playsinline=1";


    iframe.title =
        tituloAtual;


    iframe.allow =
        "autoplay; encrypted-media; " +
        "picture-in-picture; fullscreen";


    iframe.allowFullscreen =
        true;


    iframe.referrerPolicy =
        "strict-origin-when-cross-origin";


    /*
       Coloca primeiro o iframe
       e só depois remove o loading.
    */

    container.innerHTML = "";

    container.appendChild(
        iframe
    );


    playerInfo.innerText =
        modoTrailer
            ? "Trailer • YouTube"
            : "Vídeo • YouTube";


    iframe.addEventListener(
        "load",
        () => {

            console.log(
                "✅ iframe YouTube carregado."
            );

            esconderLoading();

        }
    );


    /*
       Segurança caso o evento
       load não seja disparado.
    */

    setTimeout(
        esconderLoading,
        4000
    );

}


/* =====================================================
   VIDEO DIRETO
===================================================== */

function abrirVideo(
    url
) {

    console.log(
        "🎥 Abrindo vídeo:",
        url
    );


    const video =
        document.createElement(
            "video"
        );


    video.controls =
        true;

    video.autoplay =
        true;

    video.playsInline =
        true;

    video.preload =
        "metadata";

    video.src =
        url;


    video.addEventListener(
        "loadedmetadata",
        () => {

            console.log(
                "✅ Metadata carregada."
            );

            esconderLoading();

        }
    );


    video.addEventListener(
        "canplay",
        () => {

            console.log(
                "▶️ Vídeo pronto."
            );

            esconderLoading();

        }
    );


    video.addEventListener(
        "error",
        () => {

            console.error(
                "❌ Erro HTML5:",
                video.error
            );


            let detalhe =
                "O arquivo não pôde ser reproduzido.";

            if (
                video.error
            ) {

                detalhe +=
                    " Código: " +
                    video.error.code;

            }


            mostrarErro(
                "Não foi possível reproduzir o vídeo.",
                detalhe
            );

        }
    );


    container.innerHTML = "";

    container.appendChild(
        video
    );


    playerInfo.innerText =
        modoTrailer
            ? "Trailer • Vídeo direto"
            : "Vídeo • Arquivo direto";


    /*
       Tentativa de autoplay.
       Se o navegador bloquear,
       o usuário ainda pode apertar play.
    */

    video.play()
        .then(
            () => {

                console.log(
                    "▶️ Reprodução iniciada."
                );

            }
        )
        .catch(
            erro => {

                console.warn(
                    "Autoplay bloqueado:",
                    erro
                );

                esconderLoading();

            }
        );

}


/* =====================================================
   PLAYER EXTERNO
===================================================== */

function abrirPlayerExterno(
    url
) {

    console.log(
        "🌐 Player externo:",
        url
    );


    if (
        !ehUrlValida(url)
    ) {

        mostrarErro(
            "Link de vídeo inválido.",
            url
        );

        return;

    }


    const iframe =
        document.createElement(
            "iframe"
        );


    iframe.src =
        url;


    iframe.title =
        tituloAtual;


    iframe.allow =
        "autoplay; fullscreen; " +
        "encrypted-media; " +
        "picture-in-picture";


    iframe.allowFullscreen =
        true;


    iframe.referrerPolicy =
        "strict-origin-when-cross-origin";


    container.innerHTML = "";

    container.appendChild(
        iframe
    );


    playerInfo.innerText =
        modoTrailer
            ? "Trailer • Player externo"
            : "Vídeo • Player externo";


    iframe.addEventListener(
        "load",
        () => {

            esconderLoading();

        }
    );


    setTimeout(
        esconderLoading,
        4000
    );

}


/* =====================================================
   ABRIR MÍDIA
===================================================== */

function abrirMidia(
    url
) {

    const link =
        limparUrl(url);


    console.log(
        "🔗 Link final:",
        link
    );


    if (!link) {

        mostrarErro(

            modoTrailer

                ? "Este título não possui trailer cadastrado."

                : "Este título não possui vídeo cadastrado."

        );

        return;

    }


    /*
       YOUTUBE
    */

    if (
        ehYoutube(link)
    ) {

        const id =
            extrairYoutubeId(
                link
            );


        if (!id) {

            mostrarErro(
                "Link do YouTube inválido.",
                link
            );

            return;

        }


        abrirYoutube(
            id
        );

        return;

    }


    /*
       ARQUIVO DIRETO
    */

    if (
        ehArquivoVideo(link)
    ) {

        abrirVideo(
            link
        );

        return;

    }


    /*
       HLS / M3U8
       Alguns servidores não usam
       extensão no final.
    */

    if (
        link.includes(
            ".m3u8"
        )
    ) {

        abrirVideo(
            link
        );

        return;

    }


    /*
       PLAYER EXTERNO
    */

    abrirPlayerExterno(
        link
    );

}


/* =====================================================
   DOWNLOAD
===================================================== */

function configurarDownload() {

    if (
        modoTrailer ||
        !downloadUrl
    ) {

        btnDownload.disabled =
            true;

        return;

    }


    btnDownload.disabled =
        false;


    btnDownload.onclick =
        () => {

            const url =
                limparUrl(
                    downloadUrl
                );


            if (!url) {

                return;

            }


            window.open(
                url,
                "_blank",
                "noopener,noreferrer"
            );

        };

}


/* =====================================================
   ENCONTRAR URL DO VÍDEO
===================================================== */

function encontrarVideo(
    item
) {

    if (
        modoTrailer
    ) {

        return (

            item.trailer ||

            item.videoTrailer ||

            item.trailerUrl ||

            ""

        );

    }


    /*
       Ordem de prioridade
    */

    const campos = [

        "video",

        "video1",

        "video2",

        "video3",

        "video4",

        "urlVideo",

        "videoUrl",

        "embed",

        "player"

    ];


    for (
        const campo of campos
    ) {

        if (
            item[campo]
        ) {

            const valor =
                limparUrl(
                    item[campo]
                );


            if (valor) {

                return valor;

            }

        }

    }


    return "";

}


/* =====================================================
   CARREGAR FILME
===================================================== */

async function carregarFilme() {

    /*
       Verificação ID
    */

    if (!itemId) {

        mostrarErro(
            "ID do título não informado.",
            "A URL do player não possui o parâmetro id."
        );

        return;

    }


    /*
       Verificação coleção
    */

    if (!colecao) {

        mostrarErro(
            "Coleção não informada.",
            "A URL do player não possui o parâmetro colecao."
        );

        return;

    }


    try {

        console.log(
            "🔥 Buscando Firestore..."
        );

        console.log(
            "Coleção:",
            colecao
        );

        console.log(
            "Documento:",
            itemId
        );


        /*
           Documento
        */

        const referencia =
            doc(
                db,
                colecao,
                itemId
            );


        const snapshot =
            await getDoc(
                referencia
            );


        if (
            !snapshot.exists()
        ) {

            mostrarErro(
                "Título não encontrado.",
                `${colecao}/${itemId}`
            );

            return;

        }


        const item =
            snapshot.data();


        console.log(
            "🎬 Documento encontrado:"
        );

        console.log(
            item
        );


        /*
           TÍTULO
        */

        tituloAtual =
            item.titulo ||
            "V8 Play+";


        titleEl.innerText =
            tituloAtual;


        document.title =
            `${tituloAtual} - V8 Play+`;


        /*
           VÍDEO
        */

        const videoUrl =
            encontrarVideo(
                item
            );


        /*
           DOWNLOAD
        */

        downloadUrl =
            limparUrl(
                item.arquivoDownload ||
                item.download ||
                item.urlDownload ||
                ""
            );


        console.log(
            "🎥 VÍDEO:",
            videoUrl
        );

        console.log(
            "⬇️ DOWNLOAD:",
            downloadUrl
        );


        /*
           Sem vídeo
        */

        if (!videoUrl) {

            mostrarErro(

                modoTrailer

                    ? "Trailer não cadastrado."

                    : "Vídeo não cadastrado neste título.",

                `Documento: ${itemId}`

            );

            return;

        }


        /*
           Abre player
        */

        abrirMidia(
            videoUrl
        );


        /*
           Download
        */

        configurarDownload();


    }

    catch (erro) {

        console.error(
            "❌ Erro ao carregar título:",
            erro
        );


        mostrarErro(

            "Erro ao carregar o título.",

            erro?.message ||
            String(erro)

        );

    }

}


/* =====================================================
   INICIAR
===================================================== */

carregarFilme();

</script>


</body>

</html>
