<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player - V8 Play+</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white">

    <!-- CABEÇALHO DO PLAYER -->
    <header class="navbar">
        <div class="logo">V8 Play+</div>
        <a href="index.html" class="btn-voltar">Voltar ao Catálogo</a>
    </header>

    <!-- CONTAINER PRINCIPAL DO VÍDEO -->
    <main class="player-container">
        <h1 id="player-title" class="player-title">Carregando título...</h1>
        
        <div class="video-wrapper">
            <video id="main-video" controls autoplay class="video-element">
                Seu navegador não suporta a tag de vídeo.
            </video>
        </div>

        <!-- AÇÕES DO PLAYER (VISUALIZAÇÃO / DOWNLOAD) -->
        <div class="player-actions">
            <button id="btn-download-file" class="btn-secondary">Baixar Conteúdo (Acesso Vitalício)</button>
        </div>
    </main>

    <!-- SCRIPT DE MANIPULAÇÃO DA URL E DOWNLOAD -->
    <script>
        // Capturar parâmetros enviados pela URL (vídeo e título)
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('video');
        const videoTitle = urlParams.get('title');

        // Exibir título na tela e na aba do navegador
        if (videoTitle) {
            const decodedTitle = decodeURIComponent(videoTitle);
            document.getElementById('player-title').innerText = decodedTitle;
            document.title = `${decodedTitle} - V8 Play+`;
        }

        // Configurar a fonte do player de vídeo
        const videoElement = document.getElementById('main-video');
        if (videoUrl) {
            videoElement.src = decodeURIComponent(videoUrl);
        } else {
            alert("Endereço do vídeo não encontrado.");
        }

        // Funcionalidade do botão de download direto
        document.getElementById('btn-download-file').onclick = () => {
            if (videoUrl) {
                const decodedUrl = decodeURIComponent(videoUrl);
                const safeTitle = videoTitle ? decodeURIComponent(videoTitle) : 'conteudo-v8play';
                
                // Criação de elemento temporário para disparar o download
                const a = document.createElement('a');
                a.href = decodedUrl;
                a.download = `${safeTitle}.mp4`;
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } else {
                alert("Link de download indisponível no momento.");
            }
        };
    </script>
</body>
</html>
