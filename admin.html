<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - V8 Play+</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root {
            --primary: #00d4ff;
            --primary-hover: #00a2c7;
            --bg-dark: #0a0a0b;
            --bg-card: #16161a;
            --bg-modal: #121214;
            --text: #ffffff;
            --text-secondary: #aaaaaa;
            --danger: #ff4757;
            --success: #2ed573;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-dark); color: var(--text); font-family: 'Poppins', sans-serif; padding-bottom: 50px; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: #121216; border-bottom: 1px solid #222; }
        .logo { font-size: 1.4rem; font-weight: 800; color: white; text-decoration: none; }
        .logo span { color: var(--primary); }
        .user-status { font-size: 0.9rem; color: var(--text-secondary); }

        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }

        .card-box { background: var(--bg-card); border-radius: 10px; padding: 25px; border: 1px solid #222; margin-bottom: 25px; }
        .card-box h2 { font-size: 1.2rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #2b2b36; padding-bottom: 10px; color: var(--primary); }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }

        label { font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; }
        input, select, textarea { background: #1c1c22; border: 1px solid #333; color: white; padding: 10px 14px; border-radius: 6px; font-family: inherit; font-size: 0.9rem; outline: none; transition: 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); }
        input:disabled, select:disabled { opacity: 0.6; cursor: not-allowed; }
        textarea { resize: vertical; min-height: 80px; }

        .checkbox-group { display: flex; gap: 20px; align-items: center; margin-top: 10px; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem; }

        .btn-salvar { background: var(--primary); color: #000; border: none; padding: 12px 25px; font-weight: 700; border-radius: 6px; cursor: pointer; transition: 0.2s; margin-top: 15px; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 8px; }
        .btn-salvar:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-cancelar { background: #333; color: white; border: none; padding: 12px 20px; font-weight: 600; border-radius: 6px; cursor: pointer; margin-top: 15px; margin-left: 10px; }

        /* TABELA DE CONTEÚDO */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px 15px; border-bottom: 1px solid #222; font-size: 0.88rem; }
        th { background: #121216; color: var(--text-secondary); font-weight: 600; }
        tr:hover { background: rgba(255,255,255,0.02); }

        .badge-tag { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .badge-tag.gratis { background: rgba(0, 212, 255, 0.15); color: #00d4ff; border: 1px solid #00d4ff; }
        .badge-tag.prime { background: rgba(255, 170, 0, 0.2); color: #ffaa00; border: 1px solid #ffaa00; }
        .badge-tag.premium { background: rgba(0, 114, 255, 0.2); color: #0072ff; border: 1px solid #0072ff; }

        .btn-acao { background: none; border: none; color: #aaa; cursor: pointer; font-size: 1rem; padding: 5px; margin-right: 8px; transition: 0.2s; }
        .btn-acao.editar:hover { color: var(--primary); }
        .btn-acao.excluir:hover { color: var(--danger); }

        #notification { position: fixed; bottom: 25px; right: 25px; background: #1f1f24; color: white; padding: 12px 24px; border-radius: 8px; z-index: 4000; border: 1px solid var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-size: 0.9rem; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">V8 Play+ <span>Admin</span></a>
        <div class="user-status" id="adminStatus">Verificando permissões...</div>
    </header>

    <div class="container">

        <!-- PAINEL 1: CONFIGURAÇÃO DE VALORES DAS TAGS -->
        <div class="card-box">
            <h2><i class="fa-solid fa-tags"></i> Valoração dos Planos / Tags (Geral)</h2>
            <form id="formPlanos" class="form-grid">
                <div class="form-group">
                    <label for="precoPrime">Preço Tag PRIME (R$):</label>
                    <input type="number" step="0.01" min="1.00" id="precoPrime" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label for="precoPremium">Preço Tag PREMIUM (R$):</label>
                    <input type="number" step="0.01" min="1.00" id="precoPremium" placeholder="0.00" required>
                </div>
                <div class="form-group full">
                    <button type="submit" class="btn-salvar" style="width: fit-content;"><i class="fa-solid fa-floppy-disk"></i> Atualizar Preços dos Planos</button>
                </div>
            </form>
        </div>

        <!-- PAINEL 2: CADASTRO / EDIÇÃO DE ITEM -->
        <div class="card-box">
            <h2 id="formTitulo"><i class="fa-solid fa-plus-circle"></i> Cadastrar Novo Conteúdo</h2>
            <form id="formConteudo">
                <input type="hidden" id="itemId">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="titulo">Título:</label>
                        <input type="text" id="titulo" placeholder="Ex: Michael (2026)" required>
                    </div>

                    <div class="form-group">
                        <label for="colecao">Coleção / Tipo:</label>
                        <select id="colecao" required>
                            <option value="filmes">Filme</option>
                            <option value="series">Série</option>
                            <option value="animes">Anime</option>
                            <option value="doramas">Dorama</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="categoria">Gênero / Categoria:</label>
                        <select id="categoria" required>
                            <option value="">Selecione a Categoria...</option>
                            <option value="Ação">Ação</option>
                            <option value="Comédia">Comédia</option>
                            <option value="Terror">Terror</option>
                            <option value="Drama">Drama</option>
                            <option value="Romance">Romance</option>
                            <option value="Aventura">Aventura</option>
                            <option value="Ficção Científica">Ficção Científica</option>
                            <option value="Animação">Animação</option>
                            <option value="Suspense">Suspense</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="ano">Ano de Lançamento:</label>
                        <input type="text" id="ano" placeholder="2026">
                    </div>

                    <div class="form-group">
                        <label for="tag">Tag do Conteúdo:</label>
                        <select id="tag" required>
                            <option value="gratis">Grátis (Libera com Anúncio)</option>
                            <option value="prime">Prime (Pago)</option>
                            <option value="premium">Premium (Pago)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="preco">Valor Individual (R$):</label>
                        <input type="number" step="0.01" id="preco" placeholder="0.00">
                    </div>

                    <div class="form-group full">
                        <label for="capa">URL da Capa (Poster):</label>
                        <input type="url" id="capa" placeholder="https://...">
                    </div>

                    <div class="form-group full">
                        <label for="banner">URL do Banner (Destaque Hero):</label>
                        <input type="url" id="banner" placeholder="https://...">
                    </div>

                    <div class="form-group full">
                        <label for="video1">URL Player Principal (Opção 1):</label>
                        <input type="url" id="video1" placeholder="https://... (.mp4 ou embed iframe)">
                    </div>

                    <div class="form-group">
                        <label for="video2">URL Player Opção 2 (Opcional):</label>
                        <input type="url" id="video2" placeholder="https://...">
                    </div>

                    <div class="form-group">
                        <label for="video3">URL Player Opção 3 (Opcional):</label>
                        <input type="url" id="video3" placeholder="https://...">
                    </div>

                    <div class="form-group full">
                        <label for="arquivoDownload">URL Link Direto de Download:</label>
                        <input type="url" id="arquivoDownload" placeholder="https://... (deixe em branco para usar a Opção 1)">
                    </div>

                    <div class="form-group full">
                        <label for="trailer">URL Trailer (YouTube/Embed):</label>
                        <input type="url" id="trailer" placeholder="https://www.youtube.com/embed/ID_DO_VIDEO">
                    </div>

                    <div class="form-group full">
                        <label for="descricao">Sinopse / Descrição:</label>
                        <textarea id="descricao" placeholder="Escreva a descrição do conteúdo..."></textarea>
                    </div>

                    <div class="form-group full checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="destaque"> Colocar no Banner Principal (Hero / Em Alta)
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="recomendado"> Marcar como Recomendado
                        </label>
                    </div>
                </div>

                <div style="margin-top: 20px;">
                    <button type="submit" class="btn-salvar" id="btnSalvarItem"><i class="fa-solid fa-check"></i> Salvar Conteúdo</button>
                    <button type="button" class="btn-cancelar hidden" id="btnCancelarEdicao">Cancelar Edição</button>
                </div>
            </form>
        </div>

        <!-- PAINEL 3: GERENCIAMENTO E LISTA DE ITENS -->
        <div class="card-box">
            <h2><i class="fa-solid fa-list-check"></i> Conteúdos Cadastrados</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Tipo</th>
                            <th>Categoria</th>
                            <th>Tag</th>
                            <th>Valor</th>
                            <th>Destaque</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaConteudo">
                        <tr><td colspan="7" style="text-align: center; color: #666;">Carregando lista de itens...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <div id="notification" class="hidden"><span id="notificationText"></span></div>

    <!-- FIREBASE MODULES -->
    <script type="module">
        import { db, auth } from "./js/firebase.js";
        import { collection, getDocs, doc, setDoc, getDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        let todosItens = [];
        let precosAtuais = { prime: 0.00, premium: 0.00 };
        const COLECOES = ["filmes", "series", "animes", "doramas"];

        // SEGURANÇA E AUTENTICAÇÃO DE ADMIN
        onAuthStateChanged(auth, async (user) => {
            const statusEl = document.getElementById('adminStatus');
            if (!user) {
                statusEl.innerHTML = "<span style='color: var(--danger);'>Acesso negado. Faça login no index.html</span>";
                alert("Você precisa estar logado para acessar o Painel Admin.");
                window.location.href = "index.html";
                return;
            }

            try {
                const userDoc = await getDoc(doc(db, "usuarios", user.uid));
                if (!userDoc.exists() || !userDoc.data().admin) {
                    statusEl.innerHTML = `<span style='color: var(--danger);'>Conta (${user.email}) sem permissão de Administrador.</span>`;
                    alert("Sua conta não possui permissão de Administrador.");
                    window.location.href = "index.html";
                    return;
                }

                statusEl.innerHTML = `<span style='color: var(--success);'><i class="fa-solid fa-user-shield"></i> Autenticado: ${user.email}</span>`;
                carregarPrecosPlanos();
                carregarListaConteudos();

            } catch (e) {
                console.error(e);
                statusEl.innerHTML = "<span style='color: var(--danger);'>Erro ao validar permissões.</span>";
            }
        });

        // 1. CARREGAR PREÇOS DAS TAGS
        async function carregarPrecosPlanos() {
            try {
                const snap = await getDoc(doc(db, "configuracoes", "planos"));
                if (snap.exists()) {
                    const d = snap.data();
                    if (d.prime !== undefined) precosAtuais.prime = Number(d.prime);
                    if (d.premium !== undefined) precosAtuais.premium = Number(d.premium);
                }
                document.getElementById('precoPrime').value = precosAtuais.prime.toFixed(2);
                document.getElementById('precoPremium').value = precosAtuais.premium.toFixed(2);
            } catch (e) {
                console.warn("Sem preços salvos. Usando padrão 0.00.");
                document.getElementById('precoPrime').value = "0.00";
                document.getElementById('precoPremium').value = "0.00";
            }
        }

        // SALVAR PREÇOS DAS TAGS
        document.getElementById('formPlanos').onsubmit = async (e) => {
            e.preventDefault();
            const pPrime = parseFloat(document.getElementById('precoPrime').value) || 0.00;
            const pPremium = parseFloat(document.getElementById('precoPremium').value) || 0.00;

            if (pPrime < 1.00 || pPremium < 1.00) {
                mostrarNotificacao("O valor mínimo por plano é R$ 1,00 (exigência da InfinitePay para gerar o Pix).");
                return;
            }

            try {
                await setDoc(doc(db, "configuracoes", "planos"), {
                    prime: pPrime,
                    premium: pPremium,
                    atualizadoEm: serverTimestamp()
                }, { merge: true });

                precosAtuais.prime = pPrime;
                precosAtuais.premium = pPremium;
                mostrarNotificacao("Preços atualizados com sucesso!");
            } catch (err) {
                mostrarNotificacao("Erro ao salvar preços das tags.");
            }
        };

        // AJUSTAR AUTOMATICAMENTE O CAMPO DE PREÇO QUANDO A TAG FOR ALTERADA
        document.getElementById('tag').onchange = (e) => {
            const val = e.target.value;
            const campoPreco = document.getElementById('preco');
            if (val === 'prime') campoPreco.value = precosAtuais.prime.toFixed(2);
            else if (val === 'premium') campoPreco.value = precosAtuais.premium.toFixed(2);
            else campoPreco.value = "0.00";
        };

        // 2. BUSCA E LISTAGEM DE CONTEÚDO
        async function carregarListaConteudos() {
            const tbody = document.getElementById('tabelaConteudo');
            tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #666;">Buscando itens...</td></tr>`;
            todosItens = [];

            for (const col of COLECOES) {
                try {
                    const snap = await getDocs(collection(db, col));
                    snap.forEach(d => {
                        todosItens.push({ id: d.id, colecao: col, ...d.data() });
                    });
                } catch (e) {
                    console.error(`Erro ao carregar coleção ${col}:`, e);
                }
            }

            // Ordenação em memória por data
            todosItens.sort((a, b) => {
                const dataA = a.criadoEm?.toDate ? a.criadoEm.toDate() : new Date(0);
                const dataB = b.criadoEm?.toDate ? b.criadoEm.toDate() : new Date(0);
                return dataB - dataA;
            });

            if (todosItens.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #666;">Nenhum item cadastrado.</td></tr>`;
                return;
            }

            tbody.innerHTML = "";
            todosItens.forEach(item => {
                const tag = (item.tag || item.plano || "gratis").toLowerCase();
                const valorExibir = tag === 'gratis' ? 'Grátis' : `R$ ${Number(item.preco || precosAtuais[tag] || 0).toFixed(2)}`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${item.titulo}</strong></td>
                    <td>${item.colecao}</td>
                    <td>${item.categoria || '-'}</td>
                    <td><span class="badge-tag ${tag}">${tag}</span></td>
                    <td>${valorExibir}</td>
                    <td>${item.destaque ? '<i class="fa-solid fa-star" style="color: #ffaa00;"></i> Sim' : 'Não'}</td>
                    <td>
                        <button class="btn-acao editar" title="Editar"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn-acao excluir" title="Excluir"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;

                tr.querySelector('.editar').onclick = () => prepararEdicao(item);
                tr.querySelector('.excluir').onclick = () => excluirItem(item);

                tbody.appendChild(tr);
            });
        }

        // 3. SALVAR OU ATUALIZAR ITEM
        document.getElementById('formConteudo').onsubmit = async (e) => {
            e.preventDefault();

            const itemId = document.getElementById('itemId').value;
            const colecao = document.getElementById('colecao').value;
            const tag = document.getElementById('tag').value;
            const preco = parseFloat(document.getElementById('preco').value) || (tag === 'gratis' ? 0 : precosAtuais[tag]);

            const itemData = {
                titulo: document.getElementById('titulo').value,
                categoria: document.getElementById('categoria').value,
                ano: document.getElementById('ano').value,
                tag: tag,
                plano: tag, // Retrocompatibilidade
                preco: preco,
                capa: document.getElementById('capa').value,
                banner: document.getElementById('banner').value,
                video1: document.getElementById('video1').value,
                video2: document.getElementById('video2').value,
                video3: document.getElementById('video3').value,
                arquivoDownload: document.getElementById('arquivoDownload').value,
                trailer: document.getElementById('trailer').value,
                descricao: document.getElementById('descricao').value,
                destaque: document.getElementById('destaque').checked,
                recomendado: document.getElementById('recomendado').checked,
                ativo: true,
                atualizadoEm: serverTimestamp()
            };

            try {
                if (itemId) {
                    await setDoc(doc(db, colecao, itemId), itemData, { merge: true });
                    mostrarNotificacao("Conteúdo atualizado com sucesso!");
                } else {
                    itemData.criadoEm = serverTimestamp();
                    const novoRef = doc(collection(db, colecao));
                    await setDoc(novoRef, itemData);
                    mostrarNotificacao("Novo conteúdo cadastrado com sucesso!");
                }

                resetarFormulario();
                carregarListaConteudos();
            } catch (err) {
                console.error(err);
                mostrarNotificacao("Erro ao salvar conteúdo no Firestore.");
            }
        };

        function prepararEdicao(item) {
            document.getElementById('itemId').value = item.id;
            document.getElementById('titulo').value = item.titulo || "";
            
            // Trava o campo de coleção para garantir salvamento correto no documento original
            const selectColecao = document.getElementById('colecao');
            selectColecao.value = item.colecao;
            selectColecao.disabled = true;

            document.getElementById('categoria').value = item.categoria || "";
            document.getElementById('ano').value = item.ano || "";
            document.getElementById('tag').value = (item.tag || item.plano || "gratis").toLowerCase();
            document.getElementById('preco').value = item.preco !== undefined ? item.preco : "";
            document.getElementById('capa').value = item.capa || "";
            document.getElementById('banner').value = item.banner || "";
            document.getElementById('video1').value = item.video1 || item.video || "";
            document.getElementById('video2').value = item.video2 || "";
            document.getElementById('video3').value = item.video3 || "";
            document.getElementById('arquivoDownload').value = item.arquivoDownload || "";
            document.getElementById('trailer').value = item.trailer || "";
            document.getElementById('descricao').value = item.descricao || "";
            document.getElementById('destaque').checked = !!item.destaque;
            document.getElementById('recomendado').checked = !!item.recomendado;

            document.getElementById('formTitulo').innerHTML = `<i class="fa-solid fa-pen-to-square"></i> Editando: ${item.titulo}`;
            document.getElementById('btnCancelarEdicao').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function excluirItem(item) {
            if (!confirm(`Tem certeza que deseja excluir "${item.titulo}"?`)) return;

            try {
                await deleteDoc(doc(db, item.colecao, item.id));
                mostrarNotificacao("Item excluído com sucesso!");
                carregarListaConteudos();
            } catch (e) {
                mostrarNotificacao("Erro ao excluir item.");
            }
        }

        document.getElementById('btnCancelarEdicao').onclick = resetarFormulario;

        function resetarFormulario() {
            document.getElementById('formConteudo').reset();
            document.getElementById('itemId').value = "";
            
            // Libera o campo de coleção novamente para novos cadastros
            document.getElementById('colecao').disabled = false;

            document.getElementById('formTitulo').innerHTML = `<i class="fa-solid fa-plus-circle"></i> Cadastrar Novo Conteúdo`;
            document.getElementById('btnCancelarEdicao').classList.add('hidden');
        }

        function mostrarNotificacao(msg) {
            const box = document.getElementById('notification');
            document.getElementById('notificationText').innerText = msg;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 3500);
        }
    </script>
</body>
</html>
